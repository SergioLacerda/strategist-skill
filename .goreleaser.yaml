version: 2

project_name: strategist

before:
  hooks:
    # `go mod tidy` here would let a release silently rewrite go.mod/go.sum
    # for the commit being tagged. Module hygiene is already enforced on every
    # push by the Health Orchestrator workflow, so the release only needs to
    # fetch and integrity-check what the tagged commit already declares.
    - go mod download
    - go mod verify

builds:
  - id: strategist
    main: ./cmd/strategist
    # Keep the plain binary name and GoReleaser's default per-target dist/
    # layout. Naming the binary after its target (plus no_unique_dist_dir) was
    # tried so the on-disk filename would equal the published asset name, but
    # with `formats: [binary]` the archive stage re-registers the same file
    # under the name_template below — making the build-stage and archive-stage
    # artifact names identical and producing six "artifact already present in
    # the list / this might cause errors when publishing" warnings. Verified
    # locally with `goreleaser release --snapshot`: 6 collisions with the
    # templated name, 0 with this one.
    #
    # Nothing downstream needs the on-disk name anymore: the release workflow
    # resolves paths from dist/artifacts.json and names published assets from
    # that manifest's `name` field, and the attestation subjects come from
    # dist/SHA256SUMS.
    binary: strategist
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{.Version}}
    # Reproducibility: without this the embedded build timestamp is "now", so
    # rebuilding the same tag never yields the same bytes.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [binary]
    name_template: "strategist-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

release:
  github:
    owner: SergioLacerda
    name: strategist-skill
  draft: false
  replace_existing_artifacts: true
  # Verification instructions in every release body. The release workflow runs
  # the same checks after publishing (scripts/verify-published-release.sh); keep
  # this text in step with SECURITY.md § Verifying Release Integrity.
  footer: |
    ## Verify this release

    Replace `strategist-linux-amd64` with the asset you downloaded.

    ```bash
    # Checksums
    sha256sum --check --ignore-missing SHA256SUMS

    # GitHub build provenance
    gh attestation verify strategist-linux-amd64 --owner SergioLacerda

    # Cosign keyless signature (download strategist-linux-amd64.bundle too)
    cosign verify-blob strategist-linux-amd64 \
      --bundle strategist-linux-amd64.bundle \
      --certificate-identity "https://github.com/SergioLacerda/strategist-skill/.github/workflows/release.yml@refs/tags/{{ .Tag }}" \
      --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

    # The binary reports this release
    chmod +x strategist-linux-amd64 && ./strategist-linux-amd64 version   # V{{ .Version }}
    ```

    Details and rationale: [SECURITY.md](https://github.com/SergioLacerda/strategist-skill/blob/main/SECURITY.md#verifying-release-integrity).

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
