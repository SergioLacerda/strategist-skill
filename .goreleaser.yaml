version: 2

project_name: strategist

before:
  hooks:
    # `go mod tidy` here would let a release silently rewrite go.mod/go.sum
    # for the commit being tagged. Module hygiene is already enforced on every
    # push by the Health Orchestrator workflow, so the release only needs to
    # fetch and integrity-check what the tagged commit already declares.
    - go mod download
    - go mod verify

builds:
  - id: strategist
    main: ./cmd/strategist
    # The binary is named for its target and written straight into dist/ (see
    # no_unique_dist_dir below) so that the on-disk filename is identical to
    # the published release asset name. The release workflow signs and attests
    # these files by path, and `gh attestation verify strategist-linux-amd64`
    # (README/SECURITY) reads more clearly when the attested subject name is
    # the same string users downloaded.
    binary: strategist-{{ .Os }}-{{ .Arch }}
    no_unique_dist_dir: true
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{.Version}}
    # Reproducibility: without this the embedded build timestamp is "now", so
    # rebuilding the same tag never yields the same bytes.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [binary]
    name_template: "strategist-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

release:
  github:
    owner: SergioLacerda
    name: strategist-skill
  draft: false
  replace_existing_artifacts: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
