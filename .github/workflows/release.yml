name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write      # OIDC token para SLSA signing
  attestations: write  # publicar atestado no GitHub

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@9c156ee5a69193a9a85c4b91df1644a3a6e8f5ab # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release binaries (keyless)
        run: |
          for f in dist/strategist-*; do
            [[ "$f" == *.bundle ]] && continue
            cosign sign-blob --yes "$f" --bundle "${f}.bundle"
          done
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Upload cosign bundles to release
        run: |
          TAG="${GITHUB_REF_NAME}"
          for bundle in dist/strategist-*.bundle; do
            gh release upload "$TAG" "$bundle" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: strategist-${{ github.ref_name }}-sbom.cdx.json
          output-file: strategist-sbom.cdx.json
          format: cyclonedx-json
          upload-release-assets: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/strategist_*
