name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # OIDC token for cosign keyless signing
      attestations: write  # publish GitHub build provenance attestation

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Verify no pre-existing release for this tag
        # A GitHub Release created by hand (e.g. via the web UI) before this
        # workflow runs can interfere with goreleaser's own release-creation
        # and asset-upload logic in ways that are hard to diagnose after the
        # fact — fail loudly here instead of letting goreleaser silently
        # behave differently against a release it didn't create.
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A GitHub Release already exists for tag $TAG. Delete it (or the tag) before re-running, so goreleaser creates it from scratch." >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify goreleaser produced binaries
        # goreleaser-action reports success even if the underlying `goreleaser`
        # run built zero archives (e.g. it published but archiving no-op'd) —
        # the steps below use nullglob loops that silently no-op on zero
        # matches too, so without this check a total build failure surfaces
        # only much later, confusingly, at the attest step.
        run: |
          shopt -s nullglob
          files=(dist/strategist-*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No dist/strategist-* artifacts found after goreleaser run" >&2
            exit 1
          fi
          printf '%s\n' "${files[@]}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release binaries (keyless)
        # Keyless signing (Fulcio/Rekor) has been GA since cosign v1.13 — the
        # COSIGN_EXPERIMENTAL=1 flag this step previously set is a pre-GA relic
        # from older cosign docs and is not required by the cosign version this
        # pinned cosign-installer release installs.
        run: |
          shopt -s nullglob
          for f in dist/strategist-*; do
            [[ -f "$f" ]] || continue
            [[ "$f" == *.bundle ]] && continue
            cosign sign-blob --yes "$f" --bundle "${f}.bundle"
          done

      - name: Upload cosign bundles to release
        run: |
          shopt -s nullglob
          TAG="${GITHUB_REF_NAME}"
          bundles=(dist/strategist-*.bundle)
          if [[ ${#bundles[@]} -eq 0 ]]; then
            echo "::error::No cosign bundles found to upload" >&2
            exit 1
          fi
          for bundle in "${bundles[@]}"; do
            gh release upload "$TAG" "$bundle" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: strategist-${{ github.ref_name }}-sbom.cdx.json
          output-file: strategist-sbom.cdx.json
          format: cyclonedx-json
          upload-release-assets: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          # GoReleaser's name_template ("strategist-{{ .Os }}-{{ .Arch }}") hyphenates,
          # so the subject glob must match dist/strategist-* — an underscore glob here
          # would match zero files and silently attest nothing.
          subject-path: dist/strategist-*
