name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # OIDC token for cosign keyless signing
      attestations: write  # publish GitHub build provenance attestation

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release binaries (keyless)
        # Keyless signing (Fulcio/Rekor) has been GA since cosign v1.13 — the
        # COSIGN_EXPERIMENTAL=1 flag this step previously set is a pre-GA relic
        # from older cosign docs and is not required by the cosign version this
        # pinned cosign-installer release installs.
        run: |
          shopt -s nullglob
          for f in dist/strategist-*; do
            [[ -f "$f" ]] || continue
            [[ "$f" == *.bundle ]] && continue
            cosign sign-blob --yes "$f" --bundle "${f}.bundle"
          done

      - name: Upload cosign bundles to release
        run: |
          shopt -s nullglob
          TAG="${GITHUB_REF_NAME}"
          for bundle in dist/strategist-*.bundle; do
            gh release upload "$TAG" "$bundle" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: strategist-${{ github.ref_name }}-sbom.cdx.json
          output-file: strategist-sbom.cdx.json
          format: cyclonedx-json
          upload-release-assets: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          # GoReleaser's name_template ("strategist-{{ .Os }}-{{ .Arch }}") hyphenates,
          # so the subject glob must match dist/strategist-* — an underscore glob here
          # would match zero files and silently attest nothing.
          subject-path: dist/strategist-*
