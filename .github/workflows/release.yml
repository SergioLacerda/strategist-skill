name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write      # OIDC token para SLSA signing
  attestations: write  # publicar atestado no GitHub

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release binaries (keyless)
        run: |
          shopt -s nullglob
          for f in dist/strategist-*; do
            [[ -f "$f" ]] || continue
            [[ "$f" == *.bundle ]] && continue
            cosign sign-blob --yes "$f" --bundle "${f}.bundle"
          done
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Upload cosign bundles to release
        run: |
          shopt -s nullglob
          TAG="${GITHUB_REF_NAME}"
          for bundle in dist/strategist-*.bundle; do
            gh release upload "$TAG" "$bundle" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: strategist-${{ github.ref_name }}-sbom.cdx.json
          output-file: strategist-sbom.cdx.json
          format: cyclonedx-json
          upload-release-assets: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/strategist_*
