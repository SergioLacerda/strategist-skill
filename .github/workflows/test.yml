name: Health Orchestrator

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Local CI lint gates
        run: make ci-lint

      # Every build embeds the same OpenSpec bundle and uses the host Node, so
      # there is no build-tag variant to vet or lint separately.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      - name: Embedded skill catalog drift check
        run: make embed-skills-check

  test-windows:
    # Standalone clients run on Windows; every other job is ubuntu-only, so the
    # runtime-root, path-form and install-error paths are otherwise unproven
    # there (Drift A/B evidence). Kept to the packages that own that behavior.
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Windows runtime-path tests
        shell: bash
        run: go test ./internal/domain ./internal/runtimeenv ./internal/install ./internal/check ./cmd/strategist

      # The minimum supported host Node, so the smoke proves the >=20.19.0 floor.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19'

      # Real Windows exec path: build, then install and check with only the
      # host Node on PATH (no OpenSpec, no npm). This is the evidence the
      # POSIX-shell test fakes cannot give.
      - name: Standalone smoke (host Node only on PATH)
        shell: bash
        run: ./scripts/smoke-standalone-install.sh

      # The blocking step above covers the packages that own the Windows runtime
      # behavior. This runs the whole tree so failures elsewhere are visible; it
      # does not block until the promotion criteria hold (docs/adr/0052-cicd-enforcement-policy.md,
      # decision 5): 30 consecutive green runs, zero unexplained failures, duration in budget.
      # continue-on-error-catalog: owner=SergioLacerda reason=full Windows suite is evidence until the flakiness window is met remove-when=30 consecutive green runs with zero unexplained failures (then delete this line and make the step blocking)
      - name: Whole test tree (evidence, not yet blocking)
        shell: bash
        continue-on-error: true
        run: go test ./...

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Local CI test gates
        run: make ci-test

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19'

      # Prove the shipped shape on Linux too: an ordinary build installs and
      # passes check with only the minimum host Node on PATH (the Windows job
      # proves the same on Windows).
      - name: Standalone smoke (host Node only on PATH)
        run: ./scripts/smoke-standalone-install.sh

      - name: Generate coverage badge
        run: make coverage-badge

      - name: Upload coverage badge artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-badge
          path: |
            coverage/coverage-badge.json
            coverage/badge.svg
          retention-days: 14

      - name: Publish test-style report to job summary
        if: always()
        run: |
          {
            echo "### Test Style Report"
            echo
            echo '```'
            make test-report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Vulnerability check
        run: make vuln-ci

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fixture and schema validation
        run: make validate-fixtures

  site-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/landing/package-lock.json

      - name: Local web gates
        run: make ci-web

  release-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Local release dry run
        run: make release-dry-run

  # Static analysis of the CI itself (docs/adr/0052-cicd-enforcement-policy.md,
  # decision 6). Not part of `lint`: these tools live outside the module graph,
  # so they stay a separate job until they have a stable track record.
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install pinned workflow linters
        run: |
          make install-actionlint
          make install-zizmor
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Workflow lint (actionlint, shellcheck, zizmor, release pin)
        run: make workflow-lint
        env:
          # Enables zizmor's online audits (impostor commits, known-vulnerable actions).
          GH_TOKEN: ${{ github.token }}

  # Records per-job duration and outcome (and the Windows full-suite step's
  # outcome) for every run: the data behind the promotion criteria in
  # docs/adr/0052-cicd-enforcement-policy.md. Reporting only; never required.
  ci-metrics:
    needs: [lint, test-windows, test, security, validate, site-build, release-dry-run, workflow-lint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report job durations
        run: bash scripts/report-job-durations.sh "${RUN_ID}" ci-metrics
        env:
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}

      - name: Upload job metrics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-metrics
          path: ci-metrics/
          retention-days: 90

