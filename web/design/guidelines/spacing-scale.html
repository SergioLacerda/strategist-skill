<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);font-family:var(--font-mono);padding:26px 28px;display:flex;align-items:flex-end;gap:14px}
  .u{text-align:center}
  .bar{background:var(--grad-bar);border-radius:2px;width:26px}
  .n{font-size:10px;color:var(--faint);margin-top:8px}
</style></head>
<body>
  <div class="u"><div class="bar" style="height:4px"></div><div class="n">1·4</div></div>
  <div class="u"><div class="bar" style="height:8px"></div><div class="n">2·8</div></div>
  <div class="u"><div class="bar" style="height:12px"></div><div class="n">3·12</div></div>
  <div class="u"><div class="bar" style="height:16px"></div><div class="n">4·16</div></div>
  <div class="u"><div class="bar" style="height:20px"></div><div class="n">5·20</div></div>
  <div class="u"><div class="bar" style="height:26px"></div><div class="n">6·26</div></div>
  <div class="u"><div class="bar" style="height:34px"></div><div class="n">7·34</div></div>
  <div class="u"><div class="bar" style="height:48px"></div><div class="n">8·48</div></div>
  <div class="u"><div class="bar" style="height:64px"></div><div class="n">9·64</div></div>
  <div class="u"><div class="bar" style="height:80px"></div><div class="n">10·80</div></div>
</body></html>
