<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);padding:22px 28px;color:var(--text)}
  .r{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--line);padding:7px 0}
  .r .t{font-size:11px;color:var(--faint);font-family:var(--font-mono);width:120px;flex:none}
  .s{font-family:var(--font-display);color:var(--amber-hi)}
</style></head>
<body>
  <div class="r"><span class="t">hero · 68 grimoire</span><span class="s" style="font-family:var(--font-grimoire);font-size:40px">Strategist</span></div>
  <div class="r"><span class="t">h2 · 26 role</span><span class="s" style="font-size:26px">Ranger</span></div>
  <div class="r"><span class="t">h3 · 20</span><span class="s" style="font-size:20px">Treasure Chest</span></div>
  <div class="r"><span class="t">body · 14 mono</span><span class="s" style="font-family:var(--font-mono);font-size:14px;color:var(--text)">discovery → refinement → gate</span></div>
  <div class="r"><span class="t">caption · 11 mono</span><span class="s" style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">non-blocking feedback</span></div>
</body></html>
