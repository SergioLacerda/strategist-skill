<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);font-family:var(--font-mono);padding:24px 26px;display:flex;gap:18px}
  .sw{flex:1}
  .chip{height:74px;border-radius:var(--radius-sm);border:1px solid var(--line);box-shadow:0 0 22px rgba(232,194,90,.18)}
  .nm{margin-top:10px;font-size:12px;color:var(--text);letter-spacing:.02em}
  .hx{font-size:11px;color:var(--faint);margin-top:2px}
</style></head>
<body>
  <div class="sw"><div class="chip" style="background:var(--amber)"></div><div class="nm">--amber</div><div class="hx">#e8c25a · links, sigils</div></div>
  <div class="sw"><div class="chip" style="background:var(--amber-hi)"></div><div class="nm">--amber-hi</div><div class="hx">#f8df90 · titles, glow</div></div>
  <div class="sw"><div class="chip" style="background:var(--amber-dim)"></div><div class="nm">--amber-dim</div><div class="hx">#b8933f · rules, dim glyph</div></div>
</body></html>
