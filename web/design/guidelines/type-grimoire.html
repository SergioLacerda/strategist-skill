<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);padding:24px 28px}
  .grim{font-family:var(--font-grimoire);font-weight:700;font-size:52px;color:var(--amber-hi);letter-spacing:.04em;text-shadow:var(--glow-amber-hi);line-height:1}
  .disp{font-family:var(--font-display);font-size:26px;color:var(--amber);letter-spacing:.03em;margin-top:14px}
  .cap{font-family:var(--font-mono);font-size:11px;color:var(--faint);letter-spacing:.04em;margin-top:14px}
</style></head>
<body>
  <div class="grim">Strategist</div>
  <div class="disp">The Approval Gate</div>
  <div class="cap">--font-grimoire (Cinzel Decorative) · --font-display (Cinzel)</div>
</body></html>
