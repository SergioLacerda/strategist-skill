<!-- @dsCard group="Brand" viewport="700x230" name="Brand mark" subtitle="The ✦ crest, ornament rule, and grimoire wordmark" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--grad-page);padding:0}
  .hero{position:relative;text-align:center;padding:30px 40px;overflow:hidden}
  .crest{font-size:38px;color:var(--amber);text-shadow:0 0 22px rgba(232,194,90,.55);letter-spacing:.3em}
  .orn{color:var(--amber-dim);letter-spacing:.5em;font-size:13px;margin:10px 0;font-family:var(--font-mono)}
  .mark{font-family:var(--font-grimoire);font-weight:700;font-size:58px;color:var(--amber-hi);letter-spacing:.04em;text-shadow:0 0 30px rgba(232,194,90,.35);margin:2px 0}
  .sub{font-family:var(--font-display);font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:var(--orange)}
</style></head>
<body>
  <div class="hero crt">
    <div class="crest">✦</div>
    <div class="orn">━━━━━━ ⟡ ━━━━━━</div>
    <div class="mark">Strategist</div>
    <div class="sub">Your experience will never be the same</div>
  </div>
</body></html>
