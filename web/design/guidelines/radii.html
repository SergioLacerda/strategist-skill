<!-- @dsCard group="Spacing" viewport="700x170" name="Radii" subtitle="Small & sharp — xs 3 / sm 4 / md 6 / pill" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);font-family:var(--font-mono);padding:26px 28px;display:flex;gap:22px;align-items:flex-start}
  .u{text-align:center}
  .box{width:84px;height:60px;background:var(--panel);border:1px solid var(--line-2)}
  .n{font-size:11px;color:var(--text);margin-top:9px}
  .h{font-size:10px;color:var(--faint);margin-top:2px}
</style></head>
<body>
  <div class="u"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="n">--radius-xs</div><div class="h">3px · badges</div></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="n">--radius-sm</div><div class="h">4px · cards/btn</div></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-md)"></div><div class="n">--radius-md</div><div class="h">6px · panels</div></div>
  <div class="u"><div class="box" style="border-radius:var(--radius-pill);width:120px"></div><div class="n">--radius-pill</div><div class="h">999px · klass tag</div></div>
</body></html>
