<!-- @dsCard group="Type" viewport="700x220" name="Mono body & labels" subtitle="IBM Plex Mono — terminal body, labels, klass tags" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);font-family:var(--font-mono);padding:24px 28px;color:var(--text)}
  .body{font-size:14px;color:var(--text);max-width:560px;line-height:var(--lh-body)}
  .label{font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:var(--orange);margin-top:18px}
  .klass{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--orange);margin-top:12px}
  .cap{font-size:11px;color:var(--faint);margin-top:16px}
</style></head>
<body>
  <div class="body">An autonomous skill that orchestrates multi-phase missions through pluggable roles, delegating each step and waiting at the approval gate.</div>
  <div class="label">mission pipeline</div>
  <div class="klass">Master · Orchestrator</div>
  <div class="cap">--font-mono (IBM Plex Mono) · body 14px · label .4em · klass .22em</div>
</body></html>
