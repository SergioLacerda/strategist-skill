<!-- @dsCard group="Colors" viewport="700x180" name="Ember & CRT green" subtitle="Warm secondary + the sparingly-used success green" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);font-family:var(--font-mono);padding:24px 26px;display:flex;gap:18px}
  .sw{flex:1}
  .chip{height:74px;border-radius:var(--radius-sm);border:1px solid var(--line)}
  .nm{margin-top:10px;font-size:12px;color:var(--text)}
  .hx{font-size:11px;color:var(--faint);margin-top:2px}
</style></head>
<body>
  <div class="sw"><div class="chip" style="background:var(--orange)"></div><div class="nm">--orange</div><div class="hx">#cf7a2c · labels, gate</div></div>
  <div class="sw"><div class="chip" style="background:var(--rust)"></div><div class="nm">--rust</div><div class="hx">#8a4128 · portcullis walls</div></div>
  <div class="sw"><div class="chip" style="background:var(--green)"></div><div class="nm">--green</div><div class="hx">#74cf8e · OK / live (sparse)</div></div>
  <div class="sw"><div class="chip" style="background:var(--green-dim)"></div><div class="nm">--green-dim</div><div class="hx">#3f6e4f</div></div>
</body></html>
