<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);font-family:var(--font-mono);padding:22px 26px}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
  .g{text-align:center}
  .med{width:54px;height:54px;margin:0 auto;border:1px solid var(--line-2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--amber);background:radial-gradient(circle,rgba(232,194,90,.14),transparent 70%);text-shadow:0 0 12px rgba(232,194,90,.5)}
  .nm{font-size:10px;color:var(--faint);margin-top:7px}
  .note{font-size:11px;color:var(--muted);margin-top:18px;line-height:1.5}
</style></head>
<body>
  <div class="grid">
    <div class="g"><div class="med">☉</div><div class="nm">Strategist</div></div>
    <div class="g"><div class="med">⌖</div><div class="nm">Ranger</div></div>
    <div class="g"><div class="med">❒</div><div class="nm">Archivist</div></div>
    <div class="g"><div class="med">✜</div><div class="nm">Sniper</div></div>
    <div class="g"><div class="med">✶</div><div class="nm">Wizard</div></div>
    <div class="g"><div class="med" style="color:var(--orange);border-color:var(--orange);text-shadow:0 0 12px rgba(207,122,44,.55)">⛨</div><div class="nm">Gate</div></div>
    <div class="g"><div class="med">⚲</div><div class="nm">Opportunist</div></div>
    <div class="g"><div class="med">⚑</div><div class="nm">Side Quest</div></div>
    <div class="g"><div class="med">❖</div><div class="nm">Treasure</div></div>
    <div class="g"><div class="med">✦</div><div class="nm">Crest</div></div>
    <div class="g"><div class="med">⟡</div><div class="nm">Ornament</div></div>
  </div>
  <div class="note">Iconography is <b style="color:var(--amber)">Unicode glyphs</b> set in a circular hairline medallion with a radial amber wash — no icon font, no SVG sprite, no emoji.</div>
</body></html>
