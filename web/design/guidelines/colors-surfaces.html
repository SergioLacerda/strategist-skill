<!-- @dsCard group="Colors" viewport="700x180" name="Surfaces" subtitle="Deep resin browns — page through raised panel" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);font-family:var(--font-mono);padding:24px 26px;display:flex;gap:14px}
  .sw{flex:1}
  .chip{height:74px;border-radius:var(--radius-sm);border:1px solid var(--line)}
  .nm{margin-top:10px;font-size:11.5px;color:var(--text)}
  .hx{font-size:11px;color:var(--faint);margin-top:2px}
</style></head>
<body>
  <div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="nm">--ink</div><div class="hx">#0c0805</div></div>
  <div class="sw"><div class="chip" style="background:var(--bg)"></div><div class="nm">--bg</div><div class="hx">#14100a</div></div>
  <div class="sw"><div class="chip" style="background:var(--bg-2)"></div><div class="nm">--bg-2</div><div class="hx">#1b1610</div></div>
  <div class="sw"><div class="chip" style="background:var(--panel)"></div><div class="nm">--panel</div><div class="hx">#211a11</div></div>
  <div class="sw"><div class="chip" style="background:var(--panel-2)"></div><div class="nm">--panel-2</div><div class="hx">#2a2117</div></div>
</body></html>
