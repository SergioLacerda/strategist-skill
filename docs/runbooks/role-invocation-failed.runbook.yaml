schema_version: "1"
runbook_id: role-invocation-failed
runbook_type: operational
source_doc: docs/runbooks/role-invocation-failed.md

applies_when:
  - "error=role_invocation_failed observed, with slot=<discovery|refinement|execution> and provider=<configured_provider> in the error context"

objective: Diagnose and resolve a configured slot provider whose skill.yaml is missing, schema-invalid, or not callable in the current runtime.

preconditions:
  - The failure is about the provider being uninvokable (not about its behavior once invoked) — preflight only validates that the manifest exists and matches the slot's risk contract
  - Discovery no longer invokes an external weapon at all (all discovery subtypes resolve to internal_skills/ranger natively), so discovery-subtype coverage is not a runtime condition of this failure

verification:
  - "Run `strategist check` and confirm the current slot → provider mapping and whether it reports ok"
  - "Confirm the provider is actually installed where Strategist expects a skill (e.g. ~/.claude/skills/<provider>/)"
  - "Confirm .strategist/active.yaml's slots.<phase> value matches an installed provider's id exactly — typos are the most common cause"
  - "If the provider's skill.yaml exists but fails schema validation, fix or reinstall it"
  - "Rerun `strategist check` until STATUS reports ok before retrying the mission"
  - "If slot=refinement and no alternative provider is installed: confirm roles/archivist.yaml + internal_skills/archivist/SKILL.md exist, then escalate the native-role-vs-reconfigure-vs-analysis-only choice to the user instead of substituting Archivist silently — see docs/runbooks/role-invocation-failed.md § Refinement-Specific Escalation and ADR-0027"
  - "For a Ranked archivist -> openspec-propose binding, confirm .strategist/openspec/config.yaml is direct, ranked-runtimes.yaml contains the matching slot/provider/digest, and openspec context --json succeeds with cwd=.strategist/openspec"
  - "If Ranked runtime state, digest, root, or healthcheck fails, block the binding and repair through governed installation; never fall back silently to native Archivist, another provider, the repository root, or .analysis"

checks:
  - id: active-yaml-slot-matches-installed-provider
    level: mandatory
  - id: skill-yaml-schema-valid
    level: mandatory
  - id: strategist-check-reports-ok
    level: mandatory
  - id: refinement-native-role-escalation-if-no-alternative-provider
    level: conditional
  - id: ranked-runtime-prepared-and-healthy
    level: conditional
    when: "the selected provider is a certified Ranked binding"
  - id: ranked-runtime-cwd-delivery
    level: conditional
    when: "the selected provider declares a private runtime root"

metadata:
  version: 3
  reviewed_at: "2026-09-16"
