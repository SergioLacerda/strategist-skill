schema_version: "1"
runbook_id: provider-fallback-policy
runbook_type: operational
source_doc: docs/runbooks/provider-fallback-policy.md

applies_when:
  - "error=slot_provider_not_found observed, with slot=<discovery|refinement|execution> in the error context"
  - "error=role_provider_invalid observed, with slot=<discovery|refinement|execution> in the error context"
  - "error=slot_risk_mismatch observed, with slot=<discovery|refinement|execution> in the error context"
  - "error=role_invocation_failed observed, with slot=<discovery|refinement|execution> and provider=<configured_provider> in the error context"

objective: Diagnose the slot-provider failure and repair the selected binding; never apply the retired block/ask/native fallback policy.

preconditions:
  - A candidate native role is not a substitute for the selected Weapon
  - This runbook does not replace docs/runbooks/role-invocation-failed.md for role_invocation_failed specifically; it is the general entry point across all four tokens and defers to that file's refinement-slot escalation when relevant

verification:
  - "Classify the failure token against the Root Cause list in docs/runbooks/provider-fallback-policy.md"
  - "Confirm a compatible native role exists for the affected slot (roles/<slot-role>.yaml + internal_skills/<slot-role>/SKILL.md)"
  - "If .strategist/active.yaml contains provider_resolution_policy, report it as obsolete and remove it"
  - "Repair or explicitly rebind the selected Weapon; never apply native/provider fallback"
  - "Rerun strategist check until STATUS reports ok before retrying the mission"

checks:
  - id: failure-token-classified
    level: mandatory
  - id: native-role-compatibility-verified
    level: mandatory
  - id: selected-binding-repaired-without-fallback
    level: mandatory
  - id: approval-gate-not-bypassed
    level: mandatory
  - id: refinement-slot-escalation-deferred-to-role-invocation-failed-runbook
    level: conditional

metadata:
  version: 1
  reviewed_at: "2026-08-20"
