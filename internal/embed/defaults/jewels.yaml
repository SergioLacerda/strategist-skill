# Jewels — compact, source-linked knowledge units, children of a specific treasure chest.
# Generated directly by the agent analyzing a chest, or during `strategist treasure-chest
# index` (no pre-approval gate); trust is capped at the parent chest's trust.tier. See
# docs/cli-reference.md § Jewels, ADR 0012, and
# .analysis/refined/treasure-chest-index-mine-pipeline/design.md for the full schema and
# lifecycle.
# Format version: 1

schema_version: "1"

# jewel schema reference:
#
# id: string                  # unique identifier
# chest_id: string             # mandatory — parent chest id (jewel is a child of exactly one chest)
# kind: string                 # decision | pattern | anti_pattern | gap | risk | constraint |
#                               #   example | heuristic | template | question
# statement: string            # compact fact/pattern/decision, source-linked
# source_refs: [string]        # mandatory — at least one, format <chest-id>#<section-slug>
# trust: T0 | T1 | T2 | T3     # mandatory; MUST be <= parent chest's trust.tier
# status: proposed | accepted | verified | deprecated
#   proposed   — agent- or index-generated, not yet human-curated; usable only as a hint
#   accepted   — promoted by `strategist treasure-chest items accept`
#   verified   — promoted by `strategist treasure-chest items verify`, requires evidence
#   deprecated — no longer usable at runtime
#   "active" is a removed legacy status — migrate with
#   `strategist treasure-chest items migrate-status` (active -> accepted).
# reviewed_by: agent | human
# last_reviewed: YYYY-MM-DD    # optional; set only if/when a human reviews it
# score:                       # optional — LLM-governed candidate quality signal, set during index
#   value: 0-100
#   reasons: [string]
# applicability:               # optional — set during polishing
#   scope: [discovery | refinement | execution | all]
#   applies_when: [string]
#   avoid_when: [string]
# verification:                # optional — populated only by `mine --verify`
#   evidence_refs: [string]
# pattern: string              # optional, kind: template only — short label for a recurring
#                               #   handoff-failure pattern (e.g. "recommendation_promoted_to_requirement")
# challenge_template:          # optional, kind: template only — seeds a future Handoff Challenge
#   applies_to: [string]         #   transition ids this pattern applies to (e.g. archivist_to_sniper,
#                                 #   ranger_to_archivist) — a list, since one pattern can recur across transitions
#   type: string                 #   objective | boundary | classification | gate | recall | verdict
#   prompt: string                #   the challenge question itself
# severity: low | medium | high  # optional, kind: template only
#   pattern/challenge_template/severity are additive fields validated by
#   internal/treasure.ValidateJewelEntry — parsing/writing a jewel with none of them
#   set is unchanged. See
#   .analysis/refined/20260803-handoff-challenge-extensions/design.md § Item 2.
# evidence_class: explicit | corroborated_inference | weak_inference | unknown  # optional
# evidence_confidence: low | medium | high  # optional
# valid_until: RFC3339 timestamp  # optional — no expiry when unset
#   evidence_class/evidence_confidence/valid_until are additive fields on any jewel
#   (no kind restriction), reusing internal/domain.Evidence's own Class/Confidence
#   vocabulary rather than embedding the Evidence struct. Power three advisory,
#   non-blocking checks — never auto-modify a jewel — run via
#   `strategist treasure-chest items check-evidence <chest-id>`:
#     expired    — valid_until has passed
#     duplicate  — same normalized (trimmed, case-folded) statement within a chest
#     conflict   — overlapping source_refs with a differing statement or status
#       within a chest (heuristic only, always a human-review flag, never
#       auto-resolved)
#   See .analysis/refined/20260803-jewel-evidence-wiring/design.md.
#
# internal/domain.Evidence itself (the full finding -> source -> snippet/hash ->
# classification -> confidence record — see internal/domain/evidence.go and
# internal/embed/defaults/schemas/evidence.schema.yaml) now additionally carries:
#   hash: string             # optional — sha256 hex digest of the cited excerpt text,
#                             #   or of the whole source file when excerpt-level
#                             #   content wasn't available to the caller; see
#                             #   domain.HashExcerpt / domain.NewEvidence
#   excerpt_anchor: string   # optional — exactly which part of source_ref was cited
#                             #   (e.g. a line range "L12-L34" or a heading anchor);
#                             #   empty means the citation is to the whole source
#   commit: string           # optional — git commit the citation was verified
#                             #   against; empty for non-git sources or when not
#                             #   resolved at construction time
# These three are additive fields on the standalone Evidence record type, not on
# Jewel — a jewel does not embed an Evidence value (it only mirrors the
# class/confidence/valid_until vocabulary above), so no new jewel-level scalar
# fields are introduced by this. Anything that constructs or parses an
# internal/domain.Evidence value (e.g. a mission package's evidence[] block) picks
# up hash/excerpt_anchor/commit automatically once populated.

jewels: []
