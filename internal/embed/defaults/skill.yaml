id: strategist
version: "1.0.0"
schema_version: "1"
status: active
risk_score: orchestrator
category: orchestration

description: >
  Analysis and documentation skill. Evaluates problems, verifies implemented demands,
  detects gaps between requirements and delivery, and updates requirements.
  Produces analysis and documentation only — never mutates code.
  Route selection (full pipeline or Critical Hit) is handled internally.
  Internal role work follows the configured providers — Strategist never performs
  discovery, refinement, or execution directly.

capability:
  produces: [analysis, documentation, implementation_handoff]
  never_produces: [code_mutation, git_mutation, direct_execution]
  resolution_paths:
    # NOTE: resolution_paths above are pipeline routes, distinct from the
    # Weapon/Ability taxonomy below. A route selects which pipeline shape runs;
    # Weapons and Abilities describe what runs inside a slot/role once a route
    # is selected.
    full_pipeline:
      sequence: [intake, discovery, refinement, approval_gate, execution]
      when: complex analysis, ambiguous demands, new requirements
    critical_hit:
      sequence: [intake, inline_gate, execution]
      when: >
        artifact management within workspace folders (analysis_move). Two modes: plain
        move (no evaluation, no evidence) and closure move (explicit implementation/
        validation claim + evidence summary, closing a pending/refined package into
        done/). Does NOT fire automatically when a main_mission reaches
        documentation_applied — that is documentation completion, not implementation
        evidence. A completed main_mission normally ends with its package in refined/.
        Never infers completion on its own.
  route_decision: internal (Scout / intake routing layer — see internal_skills/scout)
  delegating_agent_contract: invoke with request context — route is resolved internally

# Vocabulary layer distinguishing Weapons from Abilities. Documentation/naming only —
# it does not change pipeline mechanism, routing, or the FSM. See
# docs/strategist-concepts.md § Abilities for the human-facing explanation.
taxonomy:
  description: >
    Weapons are external skill_provider skills invoked via the Skill tool and bound to
    a slot in active.yaml (orchestration.slot_hierarchy.*.may_delegate_to). Abilities
    are internal routines that run inside a Role/phase — they are not configurable,
    not swappable, and have no active.yaml entry.
  weapons:
    - id: brainstorming
      bound_to_slot: discovery
    - id: openspec-explore
      bound_to_slot: refinement
  abilities:
    - id: opportunist_attack
      runs_in: refinement (Archivist, post-refinement, before completion_signal)
      outputs: [adr, runbook, treasure_chest]
      source: contracts/machine/opportunity-attack.yaml
    - id: search
      runs_in: discovery (Ranger, consult_treasure_chests); cache reused by refinement (Archivist)
      consults: treasure_chest
      source: roles/ranger.yaml#canonical, roles/archivist.yaml#canonical
    - id: critical_hit
      runs_in: scout (route resolved before Ranger/Archivist)
      note: >
        Label only — Critical Hit is mechanically a Route resolved by Scout
        (see resolution_paths.critical_hit above), not a Role-internal routine.
        Unified here purely to reduce user-facing vocabulary.
    - id: side_quest
      runs_in: discovery or refinement (any phase)
  resources:
    # Consulted by the Search ability. Not an Ability itself — never executable,
    # never a route, never a slot.
    treasure_chest:
      consulted_by: search
      contains: [jewel, potion]

orchestration:
  model: master_skill
  # Scout is internal/built-in Strategist behavior — NOT a slot. It has no
  # active.yaml entry, no roles/scout.yaml, and is never configurable.
  # See internal_skills/scout/, schemas/scout-route-decision.schema.yaml, and
  # contracts/machine/scout-routing.yaml.
  scout:
    internal_role: scout
    owner: internal (orchestrator)
    pre_pipeline: true
    never_a_slot: true
  slot_hierarchy:
    discovery:
      skill: ranger
      # Ranger is the internal discovery persona. It owns discovery_subtype behavior
      # (creative, evaluation, diagnostic, closure_evidence) and always performs
      # discovery itself (native role) — no external weapon is ever consulted for
      # discovery invocation, for any subtype (see contracts/narrative/00-routing.md
      # § Discovery Weapon Resolution by Subtype; a live invocation of a
      # manifest-compliant creative weapon surfaced contract-incompatible behavior,
      # see .analysis/refined/20260728-ranger-drift-eval/).
      may_delegate_to: []
      # active.slots.discovery (default: brainstorming) is still validated at preflight
      # (exists, invocable, matches the write_analysis risk contract) but is not
      # invoked for discovery — the field is retained for provider-metadata/future use.
    refinement:
      skill: archivist
      # Archivist is the internal refinement persona. openspec-explore is its default
      # weapon, not a replacement for the persona.
      may_delegate_to: [openspec-explore, dossier-builder, context-enrichment]
    execution:
      skill: sniper
      # Sniper is internal and controlled. It has no subtype customization.
      may_delegate_to: [sdd-ask]

parameters:
  - name: profile
    type: string
    default: local
    allowed: [local]
    description: >
      Runtime profile resolution mode for this mission. Only the local profile is
      accepted in this workspace.
  - name: mode
    type: string
    default: null
    description: >
      Override active.yaml persona for this mission only.
      Accepted values: pragmatic, epic.
  - name: speed
    type: string
    default: balanced
    values: [fast, balanced, full]
    description: >
      Mission speed policy. fast minimizes narrative and skips non-blocking phases,
      balanced keeps the current default flow, and full preserves complete telemetry.

# active.yaml config fields recognized by this skill
active_config:
  slots:
    type: object
    required: true
    fields: [discovery, refinement, execution]
    description: >
      Slot provider assignments. Each value is a skill id resolved at preflight.
      discovery → Ranger (write_analysis), refinement → Archivist (write_analysis),
      execution → Sniper (controlled).
  language:
    type: object
    required: true
    fields: [ui, docs, chat, code]
    description: >
      Four independent language axes, set by the install wizard
      (internal/install/wizard.go#promptLanguages) and written as a nested
      block in active.yaml (internal/install/active_yaml.go#writeActiveYAML):
        ui   — wizard/CLI-facing strings (content_by_lang, phase_announcements)
        docs — written artifact files: discovery/refinement analysis, proposal,
               design, tasks, ADRs (see contracts/narrative/03-discovery.md and
               04-refinement.md § Language)
        chat — Strategist-mediated conversational prose, including the refinement
               slot provider's own user-facing output (forwarded via the
               refinement pipeline stage's chat_language input — see
               contracts/narrative/09-response.md § Chat Language and
               roles/archivist.yaml#must)
        code — reserved words, identifiers, and code embedded inside artifacts;
               never translated regardless of the other three axes
      `docs` and `chat` are independent — a written artifact's language is never
      inferred from the surrounding chat language, and vice versa.
  mode:
    type: string
    default: epic
    values: [pragmatic, epic]
    description: >
      Persona used for this installation. Controls tone, verbosity, and phase labels.
      pragmatic is terse; epic is narrative. Set in active.yaml as the `mode` field.
slots:
  discovery:
    contract: write_analysis
    requires_config: true       # must be set in active.yaml; no built-in default
    default_skill: null         # explicit null: no implicit fallback — preflight fails if absent
    write_scope: "<base_path>/pending/"
    write_types: [".md"]
    output_format_note: >
      Default output for normal missions is <base_path>/pending/<mission_id>-analysis.md.
      Pipeline stages may declare artifact_path to override for specialized routes.
      The pipeline stage artifact_path always takes precedence over slot output_format.
    canonical:
      - find_unexpected_items       # surface items outside declared mission scope
      - consult_treasure_chests     # if chests scoped to discovery present, consult before LLM
      - output_format: "<base_path>/pending/<mission_id>-analysis.md"
      - handoff_contract: "schemas/handoff-ranger-to-archivist.schema.yaml"
    description: Explores the problem space and writes the transient analysis handoff artifact.
  refinement:
    contract: write_analysis
    requires_config: false      # optional: archivist is the built-in default
    default_skill: archivist
    write_scope:
      - "<base_path>/"
      - "<base_path>/refined/"
    write_types: [".md"]
    canonical:
      - consult_treasure_chests     # if chests scoped to refinement present, consult before LLM
      - opportunity_attack          # routine: evaluate ADR necessity after writing refined artifacts; surface candidates at approval gate
      - emit_completion_signal      # must emit has_execution_tasks: true|false after writing artifacts
      - output_format:
          - "<base_path>/refined/<mission_id>/analysis.md"
          - "<base_path>/refined/<mission_id>/proposal.md"
          - "<base_path>/refined/<mission_id>/design.md"
          - "<base_path>/refined/<mission_id>/tasks.md"
      - handoff_contract: "schemas/handoff-archivist-to-sniper.schema.yaml"
    description: Reads the Ranger transient analysis artifact, promotes it into the mission directory, and writes the refined package.
  execution:
    contract: controlled
    requires_config: true       # must be set in active.yaml; no built-in default
    default_skill: null
    canonical:
      - requires_review_gate_acceptance  # Strategist enforces — documented here for slot awareness
      - consult_treasure_chests          # if chests scoped to execution present, consult before acting
    description: Materializes approved documentation_targets. Approval gate acceptance required.

# Treasure chests — scoped knowledge sources passed to slots at invocation time.
# Declared in active.yaml under treasure_chests:. Each slot receives only the chests
# whose scope includes its role. The slot skill decides how to use the chest.
# scope values: all | discovery | refinement | execution (list or single string)
treasure_chest_schema:
  manifest: "strategist/treasure-chests.yaml"    # full governance manifest (trust, routing, budget)
  source_card_schema: ".strategist/schemas/source-card.schema.yaml"
  legacy_fields: [id, path, scope, description]  # supported in active.yaml declarations
  scope_values: [all, discovery, refinement, execution]
  note: >
    Chests in active.yaml use legacy_fields. Chests in treasure-chests.yaml have full governance.
    treasure-chests.yaml sources take precedence on conflict.

preflight:
  - validate_slot_providers
  - validate_role_invocation       # role/provider invocation failures are internal skill errors
  - load_internal_domain
  - load_persona

pipeline:
  - stage: intake
    skill: prompt-intake
    produces: mission_contract    # includes token_strategy block (mode, pressure_score, triage_gate)
  - stage: triage_gate
    type: conditional_pause
    condition: "mission_contract.token_strategy.triage_gate.blocked == true"
    description: >
      Present the single unblocking question from token_strategy.triage_gate.blocking_question.
      Do not advance to context_enrichment until user answers. Re-run intake after answer.
  - stage: scout_routing
    skill: scout
    input: mission_contract
    produces: route_decision
    description: >
      Scout classifies the request and selects critical_hit, implementation_short_route,
      or full_pipeline. See schemas/scout-route-decision.schema.yaml and
      contracts/machine/scout-routing.yaml. Scout is internal — never a slot.
  - stage: context_enrichment
    skill: context-enrichment
    condition: "route_decision.selected_route == full_pipeline"
    input:
      task_type: mission_contract.task_type
      token_strategy: mission_contract.token_strategy    # drives budget limits by mode
    produces: dossier
  - stage: compression_metrics
    type: internal
    condition: "route_decision.selected_route == full_pipeline"
    description: >
      Log dossier compression_metrics to .strategist/memory/chest-usage.jsonl. Non-blocking.
      Format: JSON lines with mission_id, mode, sources_seen, sources_selected,
      cards_created, tokens_estimated, provider_used.
    blocking: false
  - stage: discovery
    slot: discovery
    condition: "route_decision.selected_route == full_pipeline"
    input:
      mission_contract: mission_contract
      discovery_subtype: route_decision.discovery_subtype
    artifact_path: "<base_path>/pending/<mission_id>-analysis.md"
  - stage: refinement
    slot: refinement
    input:
      analysis_artifact: analysis_artifact
      chat_language: active.language.chat    # required directive for the provider's own conversational output — see roles/archivist.yaml#must
      docs_language: active.language.docs    # unchanged: governs the four written artifact files only
    note: >
      Opportunity Attack runs as a routine inside Archivist (refinement) only.
      Evaluates ADR necessity after all four refined artifacts are written.
      ADR side quest (if warranted) is surfaced at the approval_gate.
    artifact_path: "<base_path>/refined/<mission_id>/"
    produces:
      - "<base_path>/refined/<mission_id>/analysis.md"
      - "<base_path>/refined/<mission_id>/proposal.md"
      - "<base_path>/refined/<mission_id>/design.md"
      - "<base_path>/refined/<mission_id>/tasks.md"
  - stage: approval_gate
    type: mandatory_pause
    description: Present the refined analysis. Require explicit user review acceptance before documentation materialization slot.
  - stage: execution
    slot: execution
    input: refined_plan
    artifact_path: "<base_path>/archived/<mission_id>-report.md"
    condition: approval_granted
  - stage: learning
    skill: learning-curator
    blocking: false
    runs_after: execution         # runs after execution completes; does not gate the response
    on_failure: log_and_continue  # learning failure never aborts the mission

stop_conditions:
  - preflight_failed
  - slots_not_configured              # active.slots absent or empty
  - slot_provider_not_found
  - slot_risk_mismatch
  - intake_conflict_unresolved
  - user_requests_revision
  - user_rejects_analysis
  - opportunity_sniper_failed         # non-blocking: log and continue to Archivist
  - slot_write_type_violation         # slot tried to write a non-.md file
  - slot_write_scope_violation        # slot tried to write outside its declared scope
  - local_execution_provider_missing  # delegated invocation did not provide execution_provider
  - execution_provider_unavailable    # resolved provider cannot be invoked in this environment

result_schema: mission-result.schema.yaml

governance_injection:
  optional: true
  wire_field: governance_injection
  preferred_semantic_term: local_execution_context
  description: >
    The only declared extension point for an invoking local context. Any governance adapter,
    parent orchestrator, harness, or policy adapter MUST route its context through these fields only.
    This block is provider-agnostic — it is not coupled to any specific governance system.
    It does not alter pipeline sequence, Strategist Approval Gate requirements,
    or artifact persistence — it only injects provider, paths, policy gate, and context.
  fields:
    - execution_provider
    - base_path
    - knowledge_paths
    - governance_context
    - invocation_mode       # direct | delegated (default: direct if absent)
    - execution_gate        # allowed | blocked (default: allowed if absent)
    - request_intent        # read-only classifier context; never authorizes pipeline bypass

execution_provider_resolution:
  direct_invocation:
    source: active.slots.execution
    description: >
      Standalone invocation: resolve execution provider from the slot config only.
      No per-request execution provider override is permitted.
  delegated_invocation:
    source: local_execution_context.execution_provider
    required: true
    fallback: none
    on_missing: blocked
    error: local_execution_provider_missing
  invariants:
    - strategist_approval_gate_required           # gate always required, regardless of invocation mode
    - no_direct_shell_execution                   # Strategist never executes Sniper tasks directly
    - no_code_mutation                            # execution slot is documentation-only
    - local_context_wins_provider_only            # local context overrides only the provider; pipeline unchanged
  blocked_states:
    - id: local_execution_provider_missing
      condition: invocation_mode=delegated AND execution_provider is null
      action: block
      message: "delegated invocation did not provide execution_provider; provide local execution context or use direct invocation"
    - id: execution_provider_unavailable
      condition: resolved_provider cannot be invoked in current environment
      action: block
      message: "resolved execution_provider cannot be invoked; fix provider configuration or runtime installation"

# Governance compliance — synced via `strategist sync-governance`
compliance:
  mandates: [M001, M002, M003, M016]   # mandates fully satisfied
  partial: [M005, M007, M008, M015]    # mandates partially satisfied (see sync-governance)
  validated_by: self                   # "sdd-governance" when registered in SDD registry

validation_policy:
  require_preflight: true
  require_postcheck: false             # learning phase is non-blocking; postcheck not enforced

budget_policy:
  token_budget: high                   # orchestrator — multi-phase, multiple slot invocations
  timeout_seconds: 600                 # 10 min ceiling; individual slots have their own budgets
  max_retries: 1                       # transient slot failures: one retry, then permanent

compression_policy:
  description: >
    Governs how context-enrichment and dossier-builder select and compress sources.
    Driven by token_strategy.mode from mission_contract.
  default_provider: builtin-structural
  modes:
    lean:
      max_sources: 2
      max_cards: 5
      max_dossier_tokens: 900
      external_provider: false
    balanced:
      max_sources: 4
      max_cards: 10
      max_dossier_tokens: 2200
      external_provider: optional
    deep:
      max_sources: 8
      max_cards: 20
      max_dossier_tokens: 5000
      external_provider: preferred
      builtin_fallback_tokens: 2200   # cap when external provider absent
  providers:
    - id: builtin-structural
      type: internal
      required: true
      capabilities: [normalize, deduplicate, rank, filter, chunk, source_cards, dossier]
    # Add external providers here when available.
    # Format: id, type: external, required: false, endpoint or command.
  fallback:
    on_provider_missing: builtin-structural
    on_provider_error: builtin-structural
  security:
    external_provider_may_return: [dossier, source_cards, ranking, metrics, warnings]
    external_provider_may_not: [scope_decisions, execution, side_quest_approval, mission_contract_changes]
  metrics_log: ".strategist/memory/chest-usage.jsonl"

role_budgets:
  description: >
    Per-role token ceilings by mode, independent of compression_policy.modes (which
    budgets the context_enrichment/dossier phase, not the roles themselves). ranger
    budgets what Discovery reads beyond the dossier; archivist budgets the bounded
    reopen set allowed by contracts/machine/handoff-contract.yaml#refinement_context_policy.
    Values are placeholders pending real data from handoff_metrics_log
    (.strategist/memory/handoff-metrics.jsonl) — not yet tuned from telemetry.
  ranger:
    lean:     {max_sources: 2, max_context_tokens: 3000}
    balanced: {max_sources: 4, max_context_tokens: 6000}
    deep:     {max_sources: 8, max_context_tokens: 12000}
  archivist:
    lean:     {max_reopen_sources: 0, max_context_tokens: 2000}
    balanced: {max_reopen_sources: 1, max_context_tokens: 4000}
    deep:     {max_reopen_sources: 3, max_context_tokens: 8000}

handoff_metrics_log:
  path: ".strategist/memory/handoff-metrics.jsonl"
  emitted_by: archivist
  emitted_when: refinement_complete
  fields: [mission_id, discovery_tokens, brief_tokens, brief_compression_ratio, refinement_reopens, evidence_coverage_ratio]
  note: >
    brief_compression_ratio and evidence_coverage_ratio require discovery_tokens and
    evidence_cards[] (schemas/handoff-ranger-to-archivist.schema.yaml) to be populated
    by the Ranger artifact; both are null until missions populate those fields —
    expected during rollout, not a bug.

token_economy_stop_conditions:
  - id: ambiguous_task_no_criteria
    trigger: task_is_ambiguous and acceptance_criteria_missing
    action: generate_one_minimum_unblocking_question
    blocks: discovery
  - id: source_no_justification
    trigger: source_has_no_relevance_justification
    action: do_not_load_source
  - id: plan_exceeds_scope
    trigger: execution_plan_exceeds_declared_scope
    action: split_into_separate_missions
  - id: sniper_context_gap
    trigger: sniper_needs_context_not_in_handoff
    action: return_to_archivist
    blocks: re_reading_full_discovery
  - id: unrelated_side_quest
    trigger: side_quest_is_unrelated
    action: record_in_backlog_only
    blocks: refine_in_current_mission

telemetry_policy:
  emit_runtime_event: true
  event_format: "[Strategist] phase=<phase> status=<status> [fields]"
  otel_required_if_enabled: true
  speed_mode:
    default: balanced
    profiles:
      fast:
        output_profile: default
        suppress_learning_phase: true
        suppress_non_blocking_narrative: true
      balanced:
        output_profile: default
        suppress_learning_phase: false
        suppress_non_blocking_narrative: false
      full:
        output_profile: full

# External provider compliance contract (used in preflight when governance_injection is active)
# Provider skill.yaml should declare:
#   compliance:
#     mandates: [M007, M015, ...]
#     validated_by: sdd-governance
provider_compliance:
  governance_injection_trust: auto     # providers from governance_injection are trusted without re-validation
  external_trust: risk_score_only      # non-SDD providers: validate risk_score only (current behavior)

forbidden_behaviors:
  - materialize_documentation_without_review_acceptance
  - direct_repository_mutation_without_pipeline_evidence
  - write_config_to_target_repo
  - perform_discovery_directly_instead_of_delegating
  - skip_preflight
  - load_knowledge_not_in_index
  - skip_opportunity_attack_routine          # Archivist MUST run opportunity_attack (ADR evaluation) after writing all four refined artifacts
  - suppress_opportunity_attack_feedback     # if ADR criteria met, Archivist MUST surface ADR side quest at gate
  - sniper_decides_side_quest_strategy       # only Archivist decides; Sniper reports only
  - skip_triage_gate                         # triage_gate.blocked=true must pause pipeline
  - open_discovery_while_triage_blocked      # context_enrichment must not run while blocked
  - ranger_writes_outside_pending
  - engineer_writes_outside_analysis
  - archivist_writes_non_md
  - delegate_analysis_creation_to_sniper
  - archivist_reopens_discovery_sources_without_declared_reason  # see contracts/machine/handoff-contract.yaml#refinement_context_policy for the closed allowed_reasons list
  - id: non_documentation_write
    description: >
      Sniper attempted to write a non-documentation file. Sniper write scope is strictly
      limited to documentation_targets declared in the approved analysis and base_path docs.
      Code files and Git mutating commands are always forbidden regardless of approval gate state.
    emit: "[Strategist] phase=compliance status=blocked reason=non_documentation_write attempted_path={path}"
    action: block
  - id: pipeline_bypass_detected
    description: >
      A direct repository mutation was attempted without the canonical evidence
      required by the active route. Main pipeline requires Ranger analysis artifact,
      refined artifacts, and approval gate evidence.
    emit: >
      "[Strategist] phase=compliance status=blocked reason=pipeline_bypass_detected
       attempted_action={attempted_action} expected_phase={expected_phase}
       missing_evidence={missing_evidence} resume_hint={resume_hint}"
    action: block
  - id: missing_profile_diagnostics
    description: >
      Bootstrap completed but mandatory diagnostic block was not emitted.
      Required fields: profile_mode, profile_source_path, active_yaml_path,
      persona_resolved, reason. All 5 must appear before the first mission phase.
    emit: "[Strategist] phase=compliance status=blocked reason=missing_profile_diagnostics"
    action: block
  - id: persona_render_mismatch
    description: >
      persona_resolved=epic but pipeline emits text without epic style in first
      3 phase emissions (missing phase emoji or Ranger/Archivist/Sniper labels).
      Also applies inversely: persona_resolved=pragmatic with epic narrative.
    emit: >
      "[Strategist] phase=compliance status=blocked reason=persona_render_mismatch
       persona_resolved={persona_resolved} detected_style={detected_style}"
    action: block

runtime_model:
  description: >
    Two-path model. The canonical source (strategist/) is a development-time template
    embedded in the Go binary. The runtime instance (.strategist/) is the stamped copy
    in the user workspace. The agent MUST read exclusively from .strategist/ during
    mission execution. Reading from strategist/ directly is path drift.
  canonical_source:
    location: "<skill-repo>/strategist/"
    role: development template, embedded in Go binary
    owner: this repository
    mutated_by: [code review, PR, release]
  runtime_instance:
    location: "<user-workspace>/.strategist/"
    role: single source of truth for all runtime reads
    owner: strategist install command
    mutated_by: [strategist install, strategist compile, user manual edits + recompile]
    always_present:
      - active.yaml           # required: slot config, persona, base_path
      - contracts/            # required: stamped contract set
      - .compiled/            # required: compiled artifacts (domain.gz)
      - roles/                # required: slot provider bindings
      - personas/             # required: persona definitions
    optional:
      - memory/               # created on first learning phase
      - knowledge.index.yaml  # empty until user populates
      - treasure-chests.yaml  # populated by wizard or user
  path_rule: >
    ALL contract, schema, role, persona, and knowledge reads during a mission
    MUST use paths rooted at .strategist/. The path strategist/* is NEVER a
    valid read target during mission execution — it is a documentation error.
  validation:
    preflight_check: ".strategist/active.yaml must exist before any phase begins"
    error_if_missing: "emit error=not_installed, stop, hint: run strategist install"

agent_directives:
  primary_rule: "Delegate, never execute directly."
  role_invocation_model: master_skill
  drift_patterns_file: "identity/drift-patterns.yaml"
  footprint_rule: "Write only to <base_path>/ subdirs and .strategist/ internals. No config in target repo root."
  path_rule: "Read from .strategist/ only. strategist/ is the canonical source — never a runtime read target."
