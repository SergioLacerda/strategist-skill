# active.yaml — pragmatic standalone template
# Generated from: templates/pragmatic-standalone.yaml
# Mode: standalone (no SDD integration)

mode: pragmatic

base_path: .analysis

knowledge_index_path: knowledge.index.yaml

# Language for all generated artifacts (discovery docs, ADRs, analysis files).
# Values: en | pt-BR
language:
  ui: pt-BR
  docs: en
  chat: pt-BR
  code: en

# Slot plugins — which skill fills each mission role.
# Edit provider ids here to change slot plugins. Preflight validates risk_score contracts.
slots:
  discovery: brainstorming         # Ranger  — write_analysis contract
  refinement: openspec-propose     # Archivist — write_analysis contract (docs/adr/0035-embedded-weapon-fallback-policy.md)
  execution: sniper                # Sniper  — built-in native role (customize to swap slot plugin)

# Treasure chests — scoped knowledge sources passed to each slot at invocation.
# Uncomment and configure to add offline knowledge (e.g. governance docs, examples).
# scope: all | discovery | refinement | execution
