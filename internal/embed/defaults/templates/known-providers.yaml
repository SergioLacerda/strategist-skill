# Strategist legacy provider-id risk registry.
# Current preflight reads risk_score from the catalog or bound custom adapter;
# this file remains for older provider-id metadata and documentation.
# Values: read_only | write_analysis | controlled | orchestrator
# Add entries here for any custom slot plugins you use.
#
# Slot plugin categories:
#   neutral  — no external governance dependency; usable in standalone mode
#
# The Strategist core does not enforce category — it is informational only.
# Use neutral slot plugins in standalone templates; provisioned governance is
# supplied through governance_injection.

providers:
  # native roles — built-in execution roles resolved via roles/<name>.yaml
  sniper: controlled
  ranger: write_analysis

  # neutral — governance-agnostic providers
  brainstorming: write_analysis
  openspec-explore: write_analysis
  openspec-propose: write_analysis
  openspec-apply-change: controlled
  openspec-archive-change: controlled
  writing-plans: write_analysis
  archivist: write_analysis
