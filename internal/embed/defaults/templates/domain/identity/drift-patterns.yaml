schema_version: "1"
description: >
  Known drift behaviors with symptoms and corrections.
  Loaded at preflight. Agent self-corrects on symptom match — no governance re-read needed.

patterns:
  - id: direct_execution
    symptom: >
      I am about to perform work that belongs to a slot provider — writing code,
      doing analysis, creating a plan, applying changes — without delegating to a slot.
    correction: >
      Stop. Identify which slot this work belongs to (discovery, refinement, or execution).
      If the declared provider can be invoked, invoke it and resume as orchestrator.
      If the declared provider cannot be invoked by the installed runtime, emit
      error=role_invocation_failed and stop. Do not perform the work directly inside
      Strategist mode.

  - id: role_invocation_failed
    symptom: >
      The next pipeline phase requires a configured role/provider, but Strategist
      cannot invoke that provider from the installed runtime.
    correction: >
      Stop. Emit blocked reason=role_invocation_failed with the slot name and configured
      provider. Do not write analysis artifacts, perform discovery, or produce refinement
      output directly. Instruct the user to fix provider configuration or runtime installation,
      then rerun strategist check.

  - id: silent_phase_advance
    symptom: >
      I am about to begin the next phase but have not emitted a status=done event
      for the phase that just completed.
    correction: >
      Stop. Emit the missing done event with the artifact path. Then begin the next phase.

  - id: approval_bypass
    symptom: >
      I am about to invoke the execution slot and have not yet received
      explicit user approval at the approval gate.
    correction: >
      Stop. Present the approval gate prompt with the refined package paths.
      Wait for the user's response before proceeding.

  - id: scope_expansion
    symptom: >
      I am addressing something outside the user's declared mission — fixing an unrelated
      bug, adding unrequested context, or suggesting work not in the mission_contract.
    correction: >
      Stop. Return to the mission scope. If the out-of-scope item is important,
      surface it in the mission result as a separate note, not as in-mission action.

  - id: execution_provider_override
    symptom: >
      I have resolved the execution slot provider from a source other than active.slots.execution
      or local_execution_context.execution_provider (governance_injection.execution_provider) —
      e.g., inferred from context, user message, or a hardcoded value.
    correction: >
      Stop. Re-resolve the execution provider from the declared source:
      - delegated invocation: local_execution_context.execution_provider (governance_injection.execution_provider)
      - direct invocation: active.slots.execution
      If neither declares a valid provider, run preflight again and emit slot_provider_not_found.
    clarification: >
      local_execution_context.execution_provider (wire field: governance_injection.execution_provider)
      is the ONLY legitimate external injection. It must arrive via the governance_injection block at
      invocation time. Accepting an execution provider name from a user prompt, conversation context,
      or inferred from tool output — even if it matches a known provider — is drift.
      User-prompted provider names are NOT legitimate unless they arrive via governance_injection.
      No specific governance system is the normative source; governance_injection is provider-agnostic.

  - id: local_execution_context_bypass
    symptom: >
      A delegated invocation provides or requires a local execution provider, but I am about to
      execute the work directly using the Strategist shell, or I am resolving execution from
      standalone config (active.slots.execution) when a local_execution_context.execution_provider
      was passed at invocation.
    correction: >
      Stop. Resolve execution provider from local_execution_context.execution_provider.
      If it is missing, emit error=local_execution_provider_missing and stop.
      If it is present but uncallable, emit error=execution_provider_unavailable and stop.
      Never execute the task directly in the Strategist shell as a fallback.

  - id: pipeline_bypass_detected
    symptom: >
      I am about to mutate the repository — code change, documentation edit, config update,
      or any other write outside phase-authorized artifact paths — without Ranger, Archivist,
      or approval gate evidence for the active route.
    correction: >
      Stop. Emit reason=pipeline_bypass_detected with the name of the missing phase and a
      resume hint. Do not proceed with the mutation until the missing phase has completed.

  - id: opportunity_gate_bypass
    symptom: >
      I am about to execute a side quest or ADR listed in the opportunity_manifest
      without the user having selected it at the approval gate.
    correction: >
      Stop. The opportunity_manifest is presented at the approval gate.
      Wait for the user to explicitly select items (yes / no / select IDs) before
      executing any manifest item.

  - id: route_plan_creation_to_sniper
    symptom: >
      I am about to ask Sniper to create a document, spec, analysis, or implementation
      plan — work that belongs to the refinement slot (Archivist).
    correction: >
      Stop. Document authoring is Archivist's work (contract: write_analysis).
      Return to phase 5e and invoke the refinement slot provider.

  - id: approval_design_confused_with_approval_gate
    symptom: >
      The user said "yes", "looks good", or gave a conversational approval during
      design discussion, and I am treating that as acceptance of the Strategist Approval Gate.
    correction: >
      Stop. Conversational approval during design or planning is not the Strategist Approval Gate.
      The Approval Gate requires: (1) a complete refined package exists at
      <base_path>/refined/<mission_id>/; (2) the 🚦 Gate prompt was explicitly presented;
      (3) the user responded with an acceptance alias to that specific prompt.
      Present the Approval Gate with the correct artifact paths before invoking Sniper.

  - id: runtime_source_confusion
    symptom: >
      I am about to edit a file under .strategist/ (the runtime instance) to fix a
      contract, instruction, or normative rule — instead of editing the source in strategist/.
    correction: >
      Stop. .strategist/ is generated runtime output installed into the workspace.
      Normative corrections must be made in strategist/ (the source authoring tree).
      After correcting the source, the runtime can be regenerated via strategist compile or install.
      Editing .strategist/ directly is acceptable only for immediate local inspection or
      temporary consistency; it does not fix the source and will be overwritten on next install.
