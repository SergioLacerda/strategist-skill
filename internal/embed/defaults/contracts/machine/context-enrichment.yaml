module: context-enrichment
type: agent_phase
description: >
  Queries knowledge index by task_type tag to retrieve relevant sources.
  Returns a ranked source list for dossier-builder. Non-blocking — empty result is valid.
  Historical learning retrieval, when used, must preserve a fallback order where
  structured outcomes and lexical/tag retrieval remain available without semantic indexing.

contract:
  input:
    - name: task_type
      type: string
      required: true
      description: Mission task type (e.g. architecture_analysis, refactor, general)
    - name: token_budget
      type: integer
      required: true
      description: Token budget for context loading
    - name: knowledge_index_path
      type: path
      required: true
      description: Path to knowledge.index.yaml

  output:
    - name: sources
      type: list
      description: Matched source objects [{id, type, path, priority, excerpt_length_tokens}]
    - name: source_hints_applied
      type: boolean
      description: Whether source-hints.yaml overrides were applied

  error_conditions:
    - code: knowledge_index_empty
      trigger: knowledge.index.yaml has no sources or is absent
      behavior: Return empty sources list, continue (non-blocking)
    - code: task_type_no_match
      trigger: No source tagged with task_type in index
      behavior: Return empty sources list, continue (non-blocking)
    - code: compiled_artifact_corrupt
      trigger: .compiled/.index.gz fails jq parse
      behavior: Fall back to linear scan of knowledge.index.yaml, emit context_enrichment=standard_path

  treasure_chests:
    description: >
      For each slot invocation, filter active.treasure_chests where scope contains
      the slot role name or "all". Empty list is non-blocking.
    emit_on_consult:
      key: treasure_chest_loaded
      emit_level: DEBUG
      format: "[Strategist] treasure_chest_loaded ids={chest_ids_joined}"
    emit_on_none:
      emit_level: DEBUG
      format: "[Strategist] treasure_chest_loaded none"
    render_policy: debug_bypass

  write_scope: read-only

  owner: internal (orchestrator)

  fast_path:
    artifact: .strategist/.compiled/.index.gz
    check: strategist check-stale .strategist/.compiled/.index.gz
    query: "gunzip -c .strategist/.compiled/.index.gz | jq -r '.tags[\"<task_type>\"][]'"
    log_fresh: "[Strategist] context_enrichment=fast_path"
    log_stale: "[Strategist] context_enrichment=standard_path"

  retrieval_fallback_order:
    - jewel_consultation_as_ranking_hint   # see jewel_retrieval block below
    - trusted_chests_and_explicit_docs
    - tag_based_structured_outcomes
    - lexical_search_on_outcomes_jsonl
    - semantic_retrieval_if_explicitly_enabled_and_healthy

  evidence_pack:
    description: >
      A mission Evidence Pack is an optional artifact that serializes the source_cards
      already selected by dossier-builder for this mission. It is mission-scoped audit
      evidence, not a generic knowledge base — it never loads raw chest contents and
      never introduces a new retrieval unit. It is generated downstream by dossier-builder
      (see internal_skills/dossier-builder/skill.yaml) from dossier.source_cards.
    fields:
      - mission_id
      - task_type            # when available
      - selected_source_count
      - compression_metrics  # when available, from dossier-builder output
      - per_card: [chest, trust, relevance, interpretation, impact, excerpt]  # bounded excerpt only
      - jewels_consulted: [id, chest_id, trust, status, statement]  # distinct from per_card/source_cards
    empty_state:
      trigger: dossier.source_cards is empty
      behavior: Do not generate an Evidence Pack file. Non-blocking. evidence_pack_path is null.
    artifact_path: "<base_path>/<state>/<mission_id>-evidence-pack.md"

  commands:
    description: >
      The Treasure Chest offline organization plane exposes exactly two public,
      steady-state commands. `scan` is folded into `index` as an internal phase and must
      not be documented or invoked as primary UX. There is no `polish` or `pack` command —
      "polish" is an internal, partly-LLM-governed step inside `index`; there is no `pack`
      step at all. See ADR 0012 (jewel lifecycle statuses) and
      .analysis/refined/treasure-chest-index-mine-pipeline/design.md.
    public:
      - name: "strategist treasure-chest index"
        description: >
          Rebuilds the offline knowledge substrate: validates configured/governed/indexed/
          compiled layers, runs the internal scan phase, detects and polishes reusable
          knowledge units into deduplicated status:proposed jewels, and refreshes the
          compiled index.
      - name: "strategist treasure-chest items"
        description: >
          Human curation over status:proposed jewels and potions — list, show, accept,
          verify (with evidence), deprecate, or migrate-status, via subcommands
          (`items list|show|accept|verify|deprecate|migrate-status`). Replaces the
          removed `mine` and `jewel` commands (see
          .analysis/refined/treasure-chest-cli-unification/design.md).
    internal:
      - scan   # mission-history clustering/gap-mining phase, folded into `index`

  jewel_generation:
    description: >
      When consulting a chest, the analyzing agent (Ranger during discovery, Archivist during
      refinement) may generate at most one jewel per chest per consultation, judging relevance
      by its own analysis. No pre-approval gate — the trust-tier ceiling
      (jewel.trust <= chest.trust.tier) is the safeguard, not human review. Agent-generated
      jewels are always written with status: proposed — an agent must never write accepted or
      verified directly; only `strategist treasure-chest items` (human curation) can promote a
      jewel past proposed. See .analysis/refined/bau-tesouro-sq003-004-007/design.md for the
      original rationale, .analysis/refined/bau-tesouro-sq009-jewels-runtime/design.md for this
      contract's origin, and .analysis/refined/treasure-chest-index-mine-pipeline/design.md for
      the proposed/accepted/verified/deprecated lifecycle.
    trigger: ranger_discovery_consultation | archivist_refinement_consultation | treasure_chest_index
    cap_per_consultation: 1
    write_target: .strategist/jewels.yaml
    fields:
      - id
      - chest_id
      - kind            # decision | pattern | anti_pattern | gap | risk | constraint | example | heuristic | template | question
      - statement
      - source_refs
      - trust
      - status          # always "proposed" when agent- or index-generated
      - reviewed_by
      - last_reviewed
      - score           # {value, reasons} — LLM-governed candidate quality signal, never a promotion authority
      - applicability    # {scope, applies_when, avoid_when}
      - verification     # {evidence_refs} — populated only by `treasure-chest items verify --evidence`
    forbidden:
      - generating a jewel with trust exceeding the parent chest's trust.tier
      - generating a jewel without at least one source_ref
      - writing a status other than "proposed" from agent or index generation
      - writing the legacy "active" status (removed; see migration in ADR 0012)

  jewel_retrieval:
    description: >
      Before assembling source_cards for a chest, the analyzing agent may check
      .strategist/jewels.yaml for jewels belonging to that chest and use them as a
      ranking/shortcut hint. This never replaces source_cards assembly — it only influences
      which sources are prioritized. Staleness is qualitative and agent-judged, consistent
      with jewel_generation: a jewel is stale when last_reviewed is null, or older than the
      chest's own last update.
    trigger: ranger_discovery_consultation | archivist_refinement_consultation
    status_precedence:
      - verified   # preferred first
      - accepted   # preferred next
      - proposed   # hint only — never treated as verified evidence, never a substitute for source_cards
    excluded_status:
      - deprecated
    mandatory_fallback:
      condition: jewel is stale | disputed | missing | insufficient | status:proposed and evidence is required
      action: proceed with full source_cards assembly unchanged
    forbidden:
      - treating a jewel as a substitute for source_cards assembly
      - treating a status:proposed jewel as verified evidence
      - consulting a deprecated jewel as if accepted or verified
      - consulting a legacy "active" jewel (invalid after migration; loading must fail loudly)
    outcome_forwarding:
      description: >
        The deduplicated set of jewel IDs consulted under this block (Ranger during
        discovery, Archivist during refinement — union, deduplicated by id) must be
        forwarded into mission_result.jewels_consulted (see mission-result.schema.yaml)
        rather than discarded after use as a ranking hint. This is separate from, and
        does not change, jewel_retrieval's own ranking/fallback behavior above — it only
        adds a downstream reporting obligation so learning-curator can populate
        outcome-entry.schema.yaml's jewel_ids field. See
        .analysis/refined/2026-07-22-jewel-outcome-feedback-loop/design.md.

  planned_score_selection_transparency:
    status: not_implemented
    description: >
      Track T-K / SQ-008. Today, selection reasons are implicit: trust tier ordering
      (T0 > T1 > T2 > T3), chest_stop_conditions, and mode budget limits determine which
      sources become source_cards, but no explicit numeric score or ranked-reason list is
      exposed to Ranger/Archivist. A future refinement may expose selection as explicit
      scores or ranked reasons instead of selected/not-selected only. Recorded here so the
      idea is not silently dropped — no semantic/vector retrieval or unbounded ranking is
      implied or authorized by this note.
