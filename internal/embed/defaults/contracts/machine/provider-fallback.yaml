module: provider-fallback
type: routing_decision
version: "0.1"

provenance:
  adr_ref: docs/adr/0028-native-role-resilient-baseline.md
  lifecycle: retired
  owner: governance

description: >
  Retired legacy contract. Active missions resolve one canonical Weapon per
  Role slot and fail closed when that Weapon or any required component cannot
  be invoked. Native/provider fallback is not a valid execution path and this
  document is retained only as migration evidence.

active_behavior: none
operator_action: remove_obsolete_provider_resolution_policy_and_rebind_the_selected_weapon

trigger_conditions:
  fallback_applicable:
    all_of:
      - configured_slot_provider_fails_at_invocation_time: true
      - strategist_check_reports_compatible_native_role_fallback_for_slot: true
      - slot_is_not_discovery: true

historical_records:
  path: .strategist/memory/fallback-decisions.jsonl
  readable: true
  writable_by_active_missions: false

invariants:
  - active missions never apply a native/provider fallback
  - active missions never write a new fallback decision
  - selected providers and Weapons are immutable for a mission
  - unavailable or incompatible providers terminate with role_invocation_failed
