module: scout-routing
type: routing_decision
version: "0.1"

provenance:
  adr_ref: null
  lifecycle: active
  owner: governance

description: >
  Machine contract for Scout, the internal pre-pipeline Intake Router. Scout
  classifies each request immediately after intake and selects one of
  critical_hit, implementation_short_route, or full_pipeline. Scout emits a
  compact route_decision (see
  schemas/scout-route-decision.schema.yaml) — it never performs discovery itself,
  never invokes Sniper directly, never bypasses the Strategist Approval Gate, and
  never replaces Ranger when evidence review is required.

trigger_conditions:
  critical_hit_candidate:
    description: >
      Scout defers entirely to critical-hit.yaml's own trigger_conditions
      (plain_move and closure_move). Scout does not redefine these conditions —
      it only detects whether they are satisfied and, if so, selects
      selected_route=critical_hit.
    defers_to: "contracts/machine/critical-hit.yaml#trigger_conditions"
  implementation_short_route_candidate:
    all_of:
      - request_explicitly_asks_for_implementation_or_materialization: true
      - local_context_or_prompt_scope_sufficient: true
      - documentation_or_materialization_targets_clear: true
      - unresolved_ambiguity: false
      - code_mutation_required: false
      - git_mutation_required: false
    none_of:
      - status_annotation_requires_broad_investigation: true
  full_pipeline_default:
    description: >
      Selected whenever neither critical_hit_candidate nor
      implementation_short_route_candidate conditions are fully satisfied, or when
      route_confidence is below the threshold. This is the conservative fallback.
    always_available: true

route_confidence_threshold: 0.6

evidence_state_classification:
  explicit: >
    Evidence sufficient to annotate/close/short-route without discovery is already
    supplied in the request or already present in the target artifact.
  insufficient: >
    The request lacks enough detail to route narrowly, but does not necessarily
    require deep discovery — treated as full_pipeline with discovery_subtype
    determined by request_category.
  requires_discovery: >
    Evidence must be gathered by Ranger. selected_route=full_pipeline and
    discovery_subtype MUST be set.

emit:
  on_route_selected:
    format: >
      "[Strategist] phase=intake status=route_selected component=scout
       route={route} route_reason={reason} route_confidence={confidence}
       evidence_state={evidence_state}"
    level: INFO
  route_decision_persistence:
    description: >
      The route_decision record (schemas/scout-route-decision.schema.yaml) is
      "logged and telemetered" per that schema's own description, but the
      on_route_selected log line above is narrative-only and not queryable
      after the fact. In addition to that log line, append the same
      route_decision as one JSON line to
      <base_path>/.strategist/memory/route-decisions.jsonl (or
      .strategist/memory/route-decisions.jsonl for direct invocation, mirroring
      where outcomes.jsonl/handoff-metrics.jsonl already live), using
      internal/telemetry's AppendRouteDecisionLine (idempotent by mission_id,
      same shared-flock discipline as AppendOutcomeLine). This is the durable
      record that Scout routing metrics (route_accuracy, fallback_rate,
      unnecessary_pipeline_rate, etc.) aggregate over — see
      .analysis/refined/20260803-scout-routing-metrics/ for the full design
      and phased metric rollout.
    write_scope: append-only, .strategist/memory/route-decisions.jsonl
    non_blocking: true   # a persistence failure here must never block routing or the mission
  on_fallback_to_full_pipeline:
    format: >
      "[Strategist] phase=intake status=fallback component=scout
       reason={reason} route_confidence={confidence}"
    level: INFO

owner: internal (orchestrator)
write_scope: read-only (classification only — Scout never writes mission artifacts)

invariants:
  - Scout NEVER performs deep discovery or reads implementation surfaces beyond what
    is explicitly supplied in the request or mission_contract
  - Scout NEVER invokes Sniper directly
  - Scout NEVER bypasses the Strategist Approval Gate on any route
  - Scout NEVER replaces Ranger when evidence_state=requires_discovery
  - Scout NEVER infers evidence that was not explicitly supplied
  - If route_confidence < route_confidence_threshold, selected_route=full_pipeline
  - If any condition is ambiguous, route to full_pipeline — conservatism is the safe default
  - gate_required is always true, regardless of selected_route
  - discovery_always_resolves_to_native_ranger — discovery invocation never depends on
    discovery_subtype or active.slots.discovery; all subtypes resolve to
    internal_skills/ranger (native_role); no external discovery plugin manifest is ever
    consulted for discovery, so no post-route capability check applies

# post_route_capability_check was removed (see
# .analysis/refined/20260728-ranger-drift-eval/): it only ever applied to
# discovery_subtype=creative, and a live invocation of a manifest-compliant
# creative discovery plugin surfaced structural incompatibilities with Ranger's contract
# that the manifest-only check could not catch. Discovery now resolves to
# internal_skills/ranger for every subtype (see
# contracts/narrative/00-routing.md § Discovery Plugin Resolution by Subtype),
# so there is no remaining case where an external discovery plugin is a discovery
# candidate and this check would run.
