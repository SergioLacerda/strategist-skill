module: critical-hit
type: routing_decision
version: "0.3"

description: >
  Internal capability for workspace artifact management. When conditions are met,
  routes directly to Sniper for a file move without Ranger/Archivist phases.
  Handles moving .md analysis artifacts between base_path analysis folders (plain
  move mode), and closing a pending/refined package into done/ once implementation
  is complete and evidence is supplied (closure mode). Not a route mutually
  exclusive with the pipeline — may fire at intake or mid-mission. Does NOT fire
  automatically when a main_mission reaches documentation_applied — that is
  documentation completion, not implementation/validation evidence (see
  insufficient_evidence and stale_card_detection below). Opportunity Attack never
  performs card closure; it only evaluates ADR need during Archivist refinement.

trigger_conditions:
  plain_move:
    all_of:
      - task_type: analysis_move
      - source_path_within: ["<base_path>/pending/", "<base_path>/refined/", "<base_path>/archived/"]
      - target_path_within: ["<base_path>/pending/", "<base_path>/refined/", "<base_path>/archived/"]
      - file_types: [".md"]
      - risk_level: low
      - file_count: "<= 5"
      - explicit_completion_claim: false
    none_of:
      - source_path_outside_base_path: true
      - target_path_outside_base_path: true
  closure_move:
    all_of:
      - task_type: analysis_move
      - source_path_within: ["<base_path>/pending/", "<base_path>/refined/"]
      - target_path: "<base_path>/done/<id>"
      - explicit_completion_claim: true
      - evidence_summary_present: true    # supplied by user/delegating agent, never invented
    none_of:
      - source_path_outside_base_path: true
      - target_path_outside_base_path: true
      - completion_inferred_from_code_only: true
      - partial_implementation_with_declared_residuals: true

stale_card_detection:
  triggers:
    - on: discovery
      condition: "ranger encounters a pending/ or refined/ package (other than the current mission's) that already carries a recorded implementation/validation claim and evidence, not yet moved"
      action: flag_closure_candidate_for_next_touch   # ranger does not detour to evaluate/close it
    - on: intake_or_bootstrap
      condition: "pending/ or refined/ package already carries a recorded implementation/validation claim and evidence, not yet moved"
      action: flag_closure_candidate_for_next_touch
  insufficient_evidence:
    - documentation_applied
    - sniper_report_exists
    - approval_gate_accepted
    - tasks_md_fully_checked
    - implementation_handoff_items_present
  behavior: >
    Detection only surfaces a candidate and proposes the closure inline gate. It never
    auto-closes and never substitutes for explicit user confirmation and evidence_summary.
    A main_mission reaching documentation_applied does NOT trigger this detection by
    itself — see insufficient_evidence above. Ending a main_mission with its package in
    refined/ is the normal, expected terminal state. evidence_summary_present here uses
    the same evidence_state: explicit bar as Scout's route decision
    (see contracts/machine/scout-routing.yaml#evidence_state_classification).
  emit:
    on_candidate_detected:
      format: "[Strategist] phase=critical_hit status=stale_candidate_detected source={source}"
      level: INFO

valid_moves:
  - "pending/<id>-analysis.md → archived/          # abandon pending analysis (plain)"
  - "refined/<id>/             → archived/          # archive completed refined set (plain)"
  - "archived/<id>-*.md        → pending/           # reopen archived, rare (plain)"
  - "pending/<id>-analysis.md → done/<id>           # completed demand, evidence supplied (closure)"
  - "refined/<id>/             → done/<id>          # completed refined package, evidence supplied (closure)"
  - "any .md within pending/, refined/, archived/ between those three folders (plain)"

route_assigned: direct_execute

pipeline:
  omitted_phases: [discovery, refinement, opportunity_attack]
  artifacts_written:
    plain_move: none
    closure_move:
      - "<source_path>/completion-report.md"
  gate_style: inline

inline_gate:
  plain_move:
    display: |
      Critical Hit detected.
      Move: <source_path>
          → <target_path>
      Confirm? (sim / nao)
  closure_move:
    display: |
      Critical Hit detected (closure).
      Package: <source_path>
      Target:  <base_path>/done/<id>
      Evidence summary required.
      Confirm? (sim / nao)
  stop: true
  wait_for_response: true
  responses:
    yes: proceed to sniper
    sim: proceed to sniper   # reserved Portuguese input token (see internal/i18n/reserved.go)
    no:  resolve as analysis_delivered
    nao: resolve as analysis_delivered  # reserved Portuguese token

sniper_behavior:
  plain_move:
    - move_artifact: true
  closure_move:
    - write_completion_report:
        path: "<source_path>/completion-report.md"
        fields: [what_was_completed, evidence_supplied, checks_run, unresolved_residuals]
    - update_task_statuses:
        scope: tasks.md
        rule: update_only_tasks_covered_by_supplied_evidence
    - move_package:
        to: "<base_path>/done/<id>"
    - emit_completion_status_and_artifact_path: true

emit:
  on_trigger:
    format: "[Strategist] phase=critical_hit status=triggered task_type=analysis_move mode={mode} source={source} target={target}"
    level: INFO
  on_gate_approved:
    format: "[Strategist] phase=critical_hit status=gate_approved mode={mode}"
    level: TRACE
  on_gate_declined:
    format: "[Strategist] phase=critical_hit status=gate_declined mode={mode}"
    level: TRACE
  on_evidence_missing:
    format: "[Strategist] phase=critical_hit status=blocked reason=evidence_missing"
    level: INFO

write_scope: read-only (gate phase only; Sniper write scope applies after approval — plain move: file relocation only; closure move: completion report + tasks.md status + package move only)
owner: internal (orchestrator)

invariants:
  - Critical Hit ONLY fires for task_type: analysis_move
  - Critical Hit owns pending/refined card closure into done/; Opportunity Attack does not move analysis cards
  - Plain move: source and target MUST both be within <base_path> analysis folders (pending/, refined/, archived/)
  - Closure move: source MUST be within <base_path>/pending/ or <base_path>/refined/, target MUST be <base_path>/done/<id>, and evidence_summary MUST be present and MUST NOT be invented by Strategist
  - Task statuses are updated only for tasks explicitly covered by supplied evidence
  - Never infer completion from source code inspection alone
  - Never mutate source code
  - Stale-card detection surfaces candidates only — never auto-closes
  - If any condition is ambiguous, route to main_mission — conservatism is the safe default
  - Approval gate cannot be bypassed even in Critical Hit (either mode)
