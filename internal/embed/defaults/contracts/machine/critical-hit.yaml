module: critical-hit
type: routing_decision
version: "0.2"

description: >
  Decision point for analysis file management requests. When conditions are met,
  routes directly to Sniper for a file move without Ranger/Archivist phases.
  Exclusively handles moving .md analysis artifacts between base_path analysis folders.

trigger_conditions:
  all_of:
    - task_type: analysis_move
    - source_path_within: ["<base_path>/pending/", "<base_path>/refined/", "<base_path>/archived/"]
    - target_path_within: ["<base_path>/pending/", "<base_path>/refined/", "<base_path>/archived/"]
    - file_types: [".md"]
    - risk_level: low
    - file_count: "<= 5"
  none_of:
    - source_path_outside_base_path: true
    - target_path_outside_base_path: true

valid_moves:
  - "pending/<id>-analysis.md → archived/  # abandon pending analysis"
  - "refined/<id>/             → archived/  # archive completed refined set"
  - "archived/<id>-*.md        → pending/   # reopen archived (rare)"
  - "any .md within pending/, refined/, archived/ between those three folders"

route_assigned: direct_execute

pipeline:
  omitted_phases: [discovery, refinement, opportunity_attack]
  artifacts_written: none
  gate_style: inline

inline_gate:
  display: |
    Acerto Crítico detectado.
    Mover: <source_path>
        → <target_path>
    Confirma? (sim / nao)
  stop: true
  wait_for_response: true
  responses:
    yes: proceed to sniper
    sim: proceed to sniper   # reserved Portuguese input token (see internal/i18n/reserved.go)
    no:  resolve as analysis_delivered
    nao: resolve as analysis_delivered  # reserved Portuguese token

emit:
  on_trigger:
    format: "[Strategist] phase=critical_hit status=triggered task_type=analysis_move source={source} target={target}"
    level: INFO
  on_gate_approved:
    format: "[Strategist] phase=critical_hit status=gate_approved"
    level: TRACE
  on_gate_declined:
    format: "[Strategist] phase=critical_hit status=gate_declined"
    level: TRACE

write_scope: read-only (gate phase only; Sniper write scope applies after approval)
owner: internal (orchestrator)

invariants:
  - Critical Hit ONLY fires for task_type: analysis_move
  - Source and target MUST both be within <base_path> analysis folders (pending/, refined/, archived/)
  - If any condition is ambiguous, route to main_mission — conservatism is the safe default
  - Approval gate cannot be bypassed even in Critical Hit route
