module: learning-buffer
type: write_path
description: >
  Shell-based temp-file buffer for learning outcomes. Outcomes are appended to
  outcomes.tmp after each mission. The buffer is flushed to outcomes.jsonl at the
  START of the next mission (§0 Pre-Bootstrap) when line count >= buffer_size.
  Flush at start (not end) ensures crash safety — the previous mission's outcome
  is already in outcomes.tmp before any new writes begin. outcomes.jsonl remains
  the canonical historical source of truth for any future retrieval strategy.

contract:
  input:
    - name: mission_outcome_json
      type: string (one JSON line)
      required: true
      description: >
        Outcome record to buffer (from learning-curator). Minimum required fields:
        mission_id, status, timestamp. Preferred richer shape is defined in
        .strategist/schemas/outcome-entry.schema.yaml.
    - name: buffer_size
      type: integer
      required: false
      default: 20
      description: Flush threshold; configurable via active.yaml learning_buffer_size

  output:
    - name: outcomes_tmp_appended
      type: boolean
      description: Whether the outcome line was appended to outcomes.tmp
    - name: flushed
      type: boolean
      description: Whether buffer was flushed to outcomes.jsonl (only at mission START)
    - name: flush_count
      type: integer
      description: Number of lines flushed (0 if no flush occurred)

  error_conditions:
    - code: write_failure
      trigger: outcomes.tmp write fails
      behavior: Non-blocking — log to stderr, continue. Mission result is NOT affected.
    - code: flush_failure
      trigger: cat or truncate of outcomes.tmp fails during flush
      behavior: Non-blocking — log to stderr. outcomes.tmp is not cleared; retry next mission start.

  write_scope:
    - .strategist/memory/outcomes.tmp (append per mission, cleared on flush)
    - .strategist/memory/outcomes.jsonl (append-only, written on flush)

  owner: internal (learning)

  idempotency_key: mission_id
  idempotency_key_rationale: >
    One outcome entry represents one mission's final result; the status enum
    (see outcome-entry.schema.yaml) is a set of mutually exclusive terminal
    states, so mission_id alone identifies the entry. mission_id presence is
    validated by the schema, but presence is not the same guarantee as
    uniqueness — this key is what flush/append use to detect a duplicate.

  flush_procedure: |
    Before appending each buffered line to outcomes.jsonl, skip it if an
    entry with the same mission_id already exists in outcomes.jsonl. This
    makes the flush safe to retry: if a previous flush appended a line but
    was interrupted before the buffer was cleared (see flush_failure below),
    the retried flush will not re-append it.

    Reference implementation: internal/telemetry.FlushOutcomeBuffer, which
    calls internal/telemetry.AppendOutcomeLine per buffered line — the same
    dedup-on-mission_id function used for direct outcomes.jsonl writes — and
    only clears outcomes.tmp once every buffered line has been processed.

    Equivalent shell form (no dedup — use only when the Go path above is
    unavailable, e.g. debugging):
      cat .strategist/memory/outcomes.tmp >> .strategist/memory/outcomes.jsonl
      : > .strategist/memory/outcomes.tmp

  manual_flush: >
    Run flush_procedure above to force-flush without waiting for buffer_size threshold.

  invariant: >
    outcomes.jsonl is append-only. It is NEVER truncated or overwritten — only appended.

  idempotency_invariant: >
    A given mission_id appears at most once in outcomes.jsonl. Duplicate
    writes (buffer flush racing a direct write, or a flush retried after a
    partial failure) are skipped before append, never cleaned up afterward.

  retrieval_policy: >
    Any lexical or semantic retrieval index derived from outcomes.jsonl is optional,
    rebuildable, and disposable. Derived indexes MUST NOT become the sole source of truth.
