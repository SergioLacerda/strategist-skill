module: adr
type: execution_task
description: >
  ADR creation task executed by Sniper when the user approves the ADR side quest
  at the approval gate. Triggered by opportunity_attack evaluation inside Archivist.
  ADR approval happens at the main gate as a side quest — no separate post-execution phase.

contract:
  trigger: gate_analysis_accepted (gate acceptance) of OA-ADR side quest
  executor: sniper

  template:
    language_source: active.language.docs
    sections:
      en:    [Context, Decision, Consequences]
      pt-BR: [Contexto, Decisão, Consequências]
    required_fields: [title, date, status, mission_id]
    status_value: accepted

  write_scope:
    description: >
      Resolved from active.yaml#adr.canonical_path (optional, project-relative,
      no default). Configured -> write only to <canonical_path>/<adr_filename>,
      never also to <base_path>/archived/. Absent -> unchanged fallback below.
      See contracts/narrative/07-adr.md § Canonical Destination Resolution for
      the filename-numbering scan run when canonical_path is configured.
    when_canonical_path_configured: "<adr.canonical_path>/<adr_filename>"
    when_absent: "<base_path>/archived/<mission_id>-adr.md"
  owner: sniper (on gate approval)
  canonical_human_contract: contracts/narrative/07-adr.md
