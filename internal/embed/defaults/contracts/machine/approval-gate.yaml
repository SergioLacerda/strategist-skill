module: approval-gate
type: gate
description: >
  Approval gate between Archivist and Sniper. User reviews the refined analysis and
  decides to accept, request revision, or reject. Accepting triggers documentation
  materialization by Sniper. Revision or rejection returns control to Archivist or
  ends the mission. Gate cannot be bypassed under any circumstance. Any direct
  repository mutation attempted before acceptance must fail with
  `pipeline_bypass_detected`.

provenance:
  adr_ref: docs/adr/0003-approval-gate-obrigatorio.md
  lifecycle: active
  owner: governance

contract:
  input:
    - name: artifact_path
      type: path
      required: true
      description: Path to the refined analysis artifact set to present to the user
    - name: documentation_targets
      type: array
      required: false
      description: Documentation files Sniper will materialize if analysis is accepted
    - name: confidence_summary
      type: object
      required: false
      description: >
        Shared confidence envelope from the handoff. It is advisory gate input;
        it never substitutes for explicit human acceptance.

  confidence_display:
    source: machine/confidence-governance.yaml
    materializer: internal/telemetry.LoadConfidenceGateReview   # CLI: strategist metrics confidence --mission <id>
    show_distribution: true
    show_per_agent: true
    show_claim_kinds: true
    show_evidence_coverage: true
    show_sample_and_calibration: true
    show_violations: true
    show_missing_and_rejected_records: true
    low_or_unsupported_assertion: review
    unavailable_confidence: review
    empty_history: no_sample
    policy_percentages_are_not_calibration: true

  gate:
    emit_prompt_key: review_prompt
    emit_level: INFO
    emit_on_show:
      format: "[Strategist] phase=approval_gate status=shown artifact_path={artifact_path}"
      emit_level: INFO
    stop: true
    wait_for_response: true

  # W8/P5 (deep analysis 2026-07-26): surface the response-critic result at the
  # gate — the one human decision point. Advisory only.
  critic_display:
    source: internal_skills/response-critic (evaluation of the refined package)
    show_score: true                  # "🎯 CRITIC" line in the gate display
    show_gaps: true                   # must_have_missing / must_not_present items
    on_fail_suggest: review           # pre-suggest `review` as the default answer
    on_no_rubric: omit_line           # critic returned no_rubric → no critic line
    on_missing: omit_line             # critic did not run → no critic line, never block

  # W9: surface the optional mission_quality result (machine/mission-quality.yaml)
  # at the gate, same advisory-only treatment as critic_display above.
  mission_quality_display:
    source: internal/domain/mission_quality.go#EvaluateMissionQuality
    show_when: "analysis.md declares decisions:/evidence: sections"
    show_line: "🧭 MISSION QUALITY"          # e.g. "🧭 MISSION QUALITY  5/6 passed — source_scope_respected: 1 violation"
    on_all_applicable_pass: show_summary_only
    on_any_applicable_fail: list_failed_predicates_and_violations
    on_no_decisions_or_evidence: omit_line   # same non-blocking omission as critic_display#on_missing

  responses:
    accept_aliases: [agree, accepted, approve_analysis, sim, concordo, yes, approve, authorize, autorizar]
    revision_aliases: [missing_item, forgot_item, esqueci, faltou, revision, revisao]
    reject_aliases: [reject, wrong_request, nao_esta_bom, pedi_outra_coisa, no, nao, cancelar]

  on_accept:
    emit_format: "[Strategist] phase=approval_gate status=analysis_accepted"
    emit_level: TRACE
    checkpoint_update:
      step_3_icon: "✅"
      step_4_icon: "⏳"
    next_phase: sniper

  on_revision_requested:
    emit_format: "[Strategist] phase=approval_gate status=revision_requested"
    emit_level: TRACE
    mission_result_status: revision_requested
    riposte_offer: true               # W8/P2 — offer to capture the revision reason (riposte.yaml)
    next_phase: archivist

  on_reject:
    emit_format: "[Strategist] phase=approval_gate status=rejected"
    emit_level: TRACE
    mission_result_status: rejected
    riposte_offer: true               # W8/P2 — offer to capture the rejection reason (riposte.yaml)
    next_phase: closed

  # enforced_by uses the unified 3-tier vocabulary defined in
  # contracts/machine/errors.yaml (machine_enforced / machine_observed /
  # agent_only). Reviewed against actual Go call sites, 2026-08-30, and updated
  # 2026-09-25: mission_status still lives only as Markdown frontmatter the agent
  # reads and writes, so most invariants below stay agent_only. The one
  # exception is entering execution: `strategist mission submit --event
  # handoff_challenge_passed` now calls internal/mission.EvaluateExecutionEntry,
  # which runs internal/domain.EvaluatePipelineBypass against the evidence the
  # mission's Scout route requires (route recorded with `strategist mission
  # route`) and returns a Go error, so that invariant is machine_enforced. The
  # bypass check does not observe repository writes made outside that
  # transition; direct mutation stays agent_only.
  invariants:
    - text: gate must emit status=analysis_accepted, status=revision_requested, or status=rejected before sniper is invoked
      enforced_by: agent_only
    - text: the critic result never auto-rejects and never blocks the gate — it is advisory display; the user decision stands alone
      enforced_by: agent_only
    - text: the riposte offer never alters the gate outcome or its FSM transition; declining Riposte is always valid
      enforced_by: agent_only
    - text: analysis_delivered is a valid terminal state when no documentation_targets exist
      enforced_by: agent_only
    - text: checkpoint is re-emitted on accept (not on revision or reject)
      enforced_by: agent_only
    - text: direct repository mutation before acceptance emits reason=pipeline_bypass_detected (no Go code observes writes made outside the execution-entry transition)
      enforced_by: agent_only
    - text: entering execution (mission submit --event handoff_challenge_passed) without the evidence the Scout-selected route requires is rejected with reason=pipeline_bypass_detected, expected_phase and missing_evidence
      enforced_by: machine_enforced
    - text: pipeline_bypass_detected must include expected_phase=approval_gate and missing_evidence=approval_gate:analysis_accepted
      enforced_by: agent_only
    - text: confidence summary is advisory input and cannot auto-accept, auto-reject, or invoke Sniper
      enforced_by: agent_only
    - text: low-confidence or unsupported assertions default to review and remain visible as violations
      enforced_by: agent_only
    - text: implementation_handoff items remain separate from documentation_target items at this gate
      enforced_by: agent_only

  write_scope: read-only
  owner: internal (orchestrator)
