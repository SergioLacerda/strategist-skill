module: handoff-contract
type: refinement_policy
description: >
  Deduplication policy for the Discovery -> Refinement handoff. Governs whether
  Archivist may reopen a source Ranger already consulted, or must treat the
  Discovery Brief (the Ranger analysis artifact) as sufficient. Exists to give
  contracts/narrative/04-refinement.md and skill.yaml's
  archivist_reopens_discovery_sources_without_declared_reason forbidden_behaviors
  entry a single normative definition of "declared reason" rather than leaving it
  to per-mission judgment.

routing_note: >
  This is a policy reference, not a phase and not an archivist_routine like
  opportunity-attack.yaml — it does not run or emit on its own. It is read by
  Archivist during refinement (04-refinement.md#Inputs) and enforced via the
  forbidden_behaviors entry in skill.yaml.

contract:
  owner: archivist
  consumes: sources_consulted[] (schemas/handoff-ranger-to-archivist.schema.yaml)

  refinement_context_policy:
    enforced_by: agent_only   # no Go code reads sources_consulted[]; the rule is made countable, not machine-enforced
    default_source: discovery_brief
    reopen_original_sources: on_demand
    allowed_reasons:
      - source_marked_partial_or_skimmed_in_sources_consulted
      - brief_reference_is_ambiguous_or_contradictory
      - archivist_needs_a_field_ranger_did_not_capture
      - stale_evidence_check   # bounded verification read, see invariants

  on_reopen:
    action: state the matching allowed_reason explicitly in the refined artifact that needed the reopen
    emit: "[Strategist] phase=archivist status=source_reopened mission_id={mission_id} source_path={source_path} reason={reason}"
    emit_level: TRACE

  on_reopen_without_declared_reason:
    action: block
    reason: archivist_reopens_discovery_sources_without_declared_reason
    emit: "[Strategist] phase=compliance status=blocked reason=archivist_reopens_discovery_sources_without_declared_reason source_path={source_path}"

  invariants:
    - allowed_reasons is a closed list — a real mission needing a reason outside it is
      signal for a follow-up mission to extend this contract, not silent expansion by
      whichever Archivist run hits the gap first
    - a source listed in sources_consulted[] with coverage_status:full is never a valid
      reopen target for completeness under any allowed_reason; the only exception is
      stale_evidence_check
    - stale_evidence_check is valid only when the cited file changed after the Ranger
      artifact was written (checkable with read-only git or file mtime) and the read is
      bounded to the line ranges Ranger already cited; it is a counted reopen, so it is
      listed in the refined artifact and included in refinement_reopens
    - this policy does not apply to Sniper — see token_economy_stop_conditions#sniper_context_gap
      in skill.yaml for the equivalent Sniper-side control

  write_scope: read-only (Archivist reads this contract; it does not write to it)

handoff_verification_policy:
  owner: archivist
  transition: archivist_to_sniper
  description: >
    Risk-based semantic handoff challenge for the Archivist -> Sniper transition.
    It complements YAML handoff structure validation by requiring Sniper to
    acknowledge critical refs and classifications before materialization can begin.
    It never replaces the Strategist Approval Gate.

  default_policy:
    enabled: true
    required_types: [objective, boundary, classification, gate]
    require_all_critical: true
    max_attempts: 2
    on_failure: return_to_archivist

  require_when:
    - approval_gate_present
    - mandatory_constraints_present
    - unresolved_questions_present
    - forbidden_scope_present
    - implementation_handoff_present
    - destructive_operation_possible
    - security_sensitive_task

  skip_when:
    - informational_only
    - no_critical_constraints
    - no_unresolved_questions
    - no_forbidden_scope_beyond_sniper_defaults

  challenge_types:
    objective: receiver identifies the approved mission objective
    boundary: receiver identifies excluded or forbidden scope
    classification: receiver distinguishes approved decisions from unresolved questions
    gate: receiver identifies whether execution is authorized

  failure_tokens:
    missing: handoff_challenge_missing
    failed: handoff_challenge_failed
    repair_required: handoff_challenge_repair_required

  invariants:
    - handoff_verification is optional for backward compatibility, but when required it
      must pass before Sniper materializes any documentation target
    - "passing handoff_verification never grants execution by itself and never bypasses mission_status: gate_analysis_accepted"
    - "validation is deterministic first: required refs, forbidden claims, classifications, and gate state; LLM judging is not the MVP authority"

sniper_to_validation_policy:
  owner: unowned
  transition: sniper_to_validation
  status: documented_but_unconsumed
  description: >
    The third Handoff Challenge transition (quiz.txt § "Executor -> validação/
    reconciliação", see .analysis/refined/20260805-quiz-handoff-challenge-evaluation/):
    after Sniper materializes documentation, a validation/reconciliation pass would
    confirm it understood which files were meant to change and which deviations were
    authorized. internal/handoff already implements this transition in full —
    TransitionSniperToValidation, its own challenge-type set, SniperToValidationPolicy()
    (Enabled: false by default, matching ranger_to_archivist's own advisory-first
    posture), and `strategist handoff verify --transition sniper_to_validation` invokes
    it — but this file, until now, named only the other two transitions, and
    Strategist's pipeline has no dedicated "Validator" role to consume the result.
    This entry documents existing, already-invocable code (ADR-0057 § design.md task
    5.5 / F-H8); it does not add, enable, or wire anything new.

  default_policy:
    enabled: false
    required_types: [boundary, classification]
    require_all_critical: true
    max_attempts: 2
    on_failure: return_to_archivist

  challenge_types:
    boundary: receiver identifies which files were declared in scope (materialized) vs. explicitly out of scope
    classification: receiver distinguishes authorized deviations from unauthorized ones
    counterfactual: receiver applies a concrete constraint/invariant to a short scenario, not merely restates it

  consumer:
    role: none
    note: >
      No Strategist role invokes this transition today. Its challenges are consumed
      only by whatever process reviews a Sniper completion report by hand (a human,
      a follow-up mission, or a future dedicated role) — the same way the completion
      report itself (06-execution.md) already exists without a formal consumer role.
      Assigning an owning role, and deciding require_when/skip_when for this
      transition, is a distinct decision this entry deliberately does not make.

  invariants:
    - this transition is advisory-first like ranger_to_archivist — enabled defaults to
      false, unlike archivist_to_sniper's default_policy
    - documenting this transition here does not authorize any role to invoke it as
      part of the standard mission sequence (00-routing.md's Main Mission Sequence,
      Critical Hit Sequence, and Implementation Short Route are unchanged)
