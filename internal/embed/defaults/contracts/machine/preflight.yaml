module: preflight
type: agent_phase
description: >
  Loads internal domain (identity, directives) and validates slot plugins.
  Runs after Bootstrap. Must emit status=done before Intake begins.

contract:
  input:
    - name: active
      type: object
      required: true
      description: Active config from Bootstrap (mode, base_path, slots)
    - name: persona
      type: object
      required: true
      description: Resolved persona from Bootstrap
    - name: roles
      type: object
      required: true
      description: Slot plugin/provider-id map from Bootstrap

  output:
    - name: domain
      type: object
      description: Loaded internal domain (core_invariants, drift_patterns, directives)
    - name: slot_providers
      type: object
      description: >
        Resolved slot target paths for discovery, refinement, execution. Each slot
        resolves through one of three authorities: a cataloged Weapon, a bound
        custom package, or a built-in Strategist native role. Catalog/custom
        Weapons are validated against the slot's required risk_score; native
        roles are validated against role schema plus slot match. These are
        different authorities — a native role is never required to declare
        risk_score, and a Weapon is never validated as a native role.
    - name: preflight_status
      type: string
      description: '"done" on success'

  # enforced_by tags below use the unified 3-tier vocabulary defined in
  # contracts/machine/errors.yaml (machine_enforced / machine_observed /
  # agent_only). Reviewed against actual Go call sites, 2026-09-16
  # (20260916-preflight-cli-enforcement-wave3, Task Group A): all 7
  # conditions are now machine_enforced. slot_provider_not_found,
  # slot_risk_mismatch, and role_invocation_failed are detected AND blocked
  # by internal/cli/check/check_slots.go on a live, reachable path (feeds
  # `strategist check`'s errs list, which fails the command).
  # index_yaml_not_found, compiled_artifact_corrupt, and directives_missing
  # are detected by internal/cli/check/check_preflight_advisories.go
  # (preflightAdvisories) and surfaced in `strategist check --json`'s
  # PreflightResult.Warnings — deliberately without flipping
  # PreflightResult.Status or `strategist check`'s exit code, since their own
  # `behavior` field below is explicitly non-blocking ("Continue...", "Fall
  # back..."). "machine_enforced" here means "a live Go check observes and
  # reports this," not "this now blocks" — the two are independent axes.
  # identity_files_missing has a deliberately different, separately
  # machine_enforced sibling for the same named condition — not a drift, an
  # intentional split (see internal/cli/check/check_identity.go's own comment,
  # "D6"): internal/cli/check/check_identity.go blocks `strategist check` itself
  # (CLI-level, loud, non-zero exit) on identity_files_missing, stricter than
  # this file's own softer degraded-continue framing below. Once
  # check_identity.go's blocking error fires, `strategist check --json`
  # still emits a structured PreflightResult (status="blocked", the error in
  # Warnings) via printPreflightJSONBlocked, rather than a bare error
  # string — so a --json caller always gets one envelope shape regardless of
  # which check failed first. Likewise
  # internal/cli/check/check_content_lang.go emits reason=compiled_artifact_corrupt
  # for a different artifact (.compiled/.config.gz, a content-by-lang
  # diagnostic) — not the same clause as this file's compiled_artifact_corrupt
  # (.compiled/.domain.gz).
  error_conditions:
    - code: index_yaml_not_found
      trigger: <base_path>/.strategist/index.yaml absent
      behavior: Continue without internal domain (non-blocking)
      enforced_by: machine_enforced
    - code: slot_provider_not_found
      trigger: >
        Neither a catalog entry or bound custom package nor roles/<provider>.yaml
        can be resolved for the configured slot provider — the catalog/custom
        authority and native-role branches found no match.
      behavior: Emit blocked event with reason=slot_provider_not_found, stop mission
      enforced_by: machine_enforced
    - code: slot_risk_mismatch
      trigger: >
        A cataloged Weapon or bound custom package's risk_score does not match
        the required contract for its slot. Native roles (roles/<provider>.yaml)
        are validated against role schema plus slot match instead, and do not
        declare or require risk_score.
      behavior: Emit blocked event with reason=slot_risk_mismatch slot=<label>, stop mission
      enforced_by: machine_enforced
    - code: role_invocation_failed
      trigger: >
        Strategist attempts to invoke a configured slot plugin or native role and the invocation fails
        because the catalog/custom authority is invalid, or the native role
        definition at skill_root/roles/<provider>.yaml is malformed YAML, fails
        role schema validation, or declares a mismatched slot — or the provider
        is otherwise unavailable or not callable from the installed runtime.
        Standalone SKILL.md style, subtype coverage, or creative-first instructions are not provider-invalid conditions.
      behavior: >
        Emit:
          "[Strategist] phase=preflight status=blocked reason=role_invocation_failed
           slot=<slot_name> provider=<provider_id>"
        Stop mission. Do not begin any phase work.
        Hint: fix provider configuration or runtime installation, then run strategist check again.
      enforced_by: machine_enforced
    - code: compiled_artifact_corrupt
      trigger: .compiled/.domain.gz fails jq parse
      behavior: Fall back to standard path (load YAML directly), emit preflight=standard_path
      enforced_by: machine_enforced
    - code: identity_files_missing
      trigger: >
        identity/drift-patterns.yaml or identity/what-i-am.yaml absent
        after index.yaml load attempt
      behavior: >
        Non-blocking. Emit:
          "[Strategist] phase=preflight status=warn reason=identity_files_missing"
          "[Strategist] phase=preflight identity=degraded files_missing=[<list>]"
        Remediation hint: "Run `strategist compile` to deploy identity files."
        Continue. Agent operates in degraded mode; SKILL.md patterns serve as fallback.
      enforced_by: machine_enforced
    # Added 2026-09-24 (20260923-runtime-blind-spots, task 4.4): the 7 conditions
    # above predate it. Unlike the advisory conditions, this one blocks — it is
    # detected by internal/cli/check/check_runtime.go and surfaced by
    # `strategist check --json` as status=blocked.
    - code: runtime_missing
      trigger: >
        a Required normative runtime file (domain.NormativeRuntimeDefaultFiles)
        or the generated agent-protocol.md is absent from the installed .strategist/
      behavior: >
        Blocking. Emit:
          "[Strategist] check=failed runtime_missing: <normative|generated> file <path> is missing"
        Stop mission. Do not begin any phase work.
        Remediation hint: "Run `strategist install` to restore a missing normative file,
        or `strategist compile` to regenerate agent-protocol.md, then rerun `strategist check`."
      enforced_by: machine_enforced
    - code: directives_missing
      trigger: directives/core.yaml absent after index.yaml load attempt
      behavior: >
        Non-blocking. Emit:
          "[Strategist] phase=preflight status=warn reason=directives_missing"
        Continue without behavioral directives.
      enforced_by: machine_enforced
    # Added 2026-10-13 (20261013-drift-agente-cli, tasks 3.1/3.2): the
    # invocation handshake. Readiness above says the mission can start; this
    # says the command lines agents copy from runtime texts will be accepted.
    - code: invocation_nonconformant
      trigger: >
        A `strategist …` command line in SKILL.md, agent-protocol.md, protocol.md,
        contracts/ or roles/ names an unknown command or flag, or omits a flag the
        running binary marks required (MarkFlagRequired or "(required)" in its usage).
        A line with no flag is a mention, not an invocation, and is not checked for
        required flags; alternatives (`a|b`) are illustrative and skipped.
      behavior: >
        Non-blocking advisory in PreflightResult.Warnings. Emit:
          "[Strategist] phase=preflight status=warn reason=invocation_nonconformant file=<rel> line=<n> command=`<line>` detail=<problem>"
        Continue; status and exit code are unchanged.
      enforced_by: machine_enforced
    # Added 2026-10-13 (20261013-drift-agente-cli, task 4.1). Every Role is
    # expected in every workspace; providers are invoked only inside a mission.
    - code: support_binding_unready
      trigger: >
        A role under roles/ declares select_runbook with must_invoke: true and the
        JEWELER binding is not ready: STRATEGIST_TREASURE_CHEST_EXECUTABLE unset
        (executable_not_configured), pointing to no file (executable_not_found),
        plugins/catalog.yaml unreadable or invalid (catalog_unreadable,
        catalog_invalid), the admitted treasure-chest-tmp Weapon absent
        (weapon_not_admitted), or the binding rejected (binding_invalid).
      behavior: >
        Non-blocking advisory in PreflightResult.Warnings, one per dependent role. Emit:
          "[Strategist] phase=preflight status=warn reason=support_binding_unready role=<role> feat=select_runbook binding=jeweler detail=<detail>"
        The check inspects the binding only and never runs the provider; invoking
        `strategist runbook select` still requires --mission and still fails inside a
        mission when the binding is missing.
      enforced_by: machine_enforced

  write_scope: read-only

  owner: internal (orchestrator)

  fast_path:
    artifact: .strategist/.compiled/.domain.gz
    check: strategist check-stale .strategist/.compiled/.domain.gz
    log_fresh: "[Strategist] preflight=fast_path"
    log_stale: "[Strategist] preflight=standard_path"

  validation_rule: >
    If .strategist/contracts/ exists, load this contract file before executing preflight.
    Validate that all declared inputs are present before proceeding.
