module: preflight
type: agent_phase
description: >
  Loads internal domain (identity, directives) and validates slot plugins.
  Runs after Bootstrap. Must emit status=done before Intake begins.

contract:
  input:
    - name: active
      type: object
      required: true
      description: Active config from Bootstrap (mode, base_path, slots)
    - name: persona
      type: object
      required: true
      description: Resolved persona from Bootstrap
    - name: roles
      type: object
      required: true
      description: Slot plugin/provider-id map from Bootstrap

  output:
    - name: domain
      type: object
      description: Loaded internal domain (core_invariants, drift_patterns, directives)
    - name: slot_providers
      type: object
      description: >
        Resolved slot target paths for discovery, refinement, execution. Each slot
        resolves through one of two independent branches: an external skill plugin
        (skills/<provider>/skill.yaml, validated against the slot's required
        risk_score) or a built-in Strategist native role (roles/<provider>.yaml,
        validated against role schema plus slot match). These are different
        authorities — a native role is never required to declare risk_score, and a
        skill plugin manifest is never validated against native role schema.
    - name: preflight_status
      type: string
      description: '"done" on success'

  # enforced_by tags below use the unified 3-tier vocabulary defined in
  # contracts/machine/errors.yaml (machine_enforced / machine_observed /
  # agent_only). Reviewed against actual Go call sites, 2026-08-30:
  # slot_provider_not_found, slot_risk_mismatch, and role_invocation_failed
  # are all detected AND blocked by internal/check/check_slots.go on a live,
  # reachable path (feeds strategist check's errs list, which fails the
  # command) — tagged machine_enforced. The other five conditions, including
  # identity_files_missing, describe the agent's own live-mission preflight
  # fallback behavior (reading index.yaml/.domain.gz/identity/directives
  # itself and degrading gracefully) — no Go code observes or enforces *this
  # non-blocking degraded-continue behavior* today, so they are agent_only.
  # Two of these have a deliberately different, separately machine_enforced
  # sibling elsewhere for the same named condition — not a drift, an
  # intentional split (see internal/check/check_identity.go's own comment,
  # "D6"): internal/check/check_identity.go blocks `strategist check` itself
  # (CLI-level, loud, non-zero exit) on identity_files_missing without
  # changing preflight's own soft degraded emission described here; likewise
  # internal/check/check_content_lang.go emits reason=compiled_artifact_corrupt
  # for a different artifact (.compiled/.config.gz, a content-by-lang
  # diagnostic) — not the same clause as this file's compiled_artifact_corrupt
  # (.compiled/.domain.gz). errors.yaml's own identity_files_missing token
  # (emit: "check=blocked reason=identity_files_missing") is what's tagged
  # machine_enforced there — this file's identity_files_missing describes a
  # different, non-blocking behavior and is tagged agent_only here on purpose.
  error_conditions:
    - code: index_yaml_not_found
      trigger: <base_path>/.strategist/index.yaml absent
      behavior: Continue without internal domain (non-blocking)
      enforced_by: agent_only
    - code: slot_provider_not_found
      trigger: >
        Neither skills/<provider>/skill.yaml nor roles/<provider>.yaml can be resolved
        for the configured slot plugin — the two-branch resolver (skill plugin,
        then native role) found no match in either search path.
      behavior: Emit blocked event with reason=slot_provider_not_found, stop mission
      enforced_by: machine_enforced
    - code: slot_risk_mismatch
      trigger: >
        A skill plugin's risk_score does not match the required contract for its
        slot. This applies only to the skill-plugin branch — native roles
        (roles/<provider>.yaml) are validated against role schema plus slot match
        instead, and do not declare or require risk_score.
      behavior: Emit blocked event with reason=slot_risk_mismatch slot=<label>, stop mission
      enforced_by: machine_enforced
    - code: role_invocation_failed
      trigger: >
        Strategist attempts to invoke a configured slot plugin or native role and the invocation fails
        because either branch of the two-branch resolver is invalid: the skill plugin
        manifest at skill_root/skills/<provider>/skill.yaml is schema-invalid, or the
        native role definition at skill_root/roles/<provider>.yaml is malformed YAML,
        fails role schema validation, or declares a mismatched slot — or the provider is
        otherwise unavailable or not callable from the installed runtime.
        Standalone SKILL.md style, subtype coverage, or creative-first instructions are not provider-invalid conditions.
      behavior: >
        Emit:
          "[Strategist] phase=preflight status=blocked reason=role_invocation_failed
           slot=<slot_name> provider=<provider_id>"
        Stop mission. Do not begin any phase work.
        Hint: fix provider configuration or runtime installation, then run strategist check again.
      enforced_by: machine_enforced
    - code: compiled_artifact_corrupt
      trigger: .compiled/.domain.gz fails jq parse
      behavior: Fall back to standard path (load YAML directly), emit preflight=standard_path
      enforced_by: agent_only
    - code: identity_files_missing
      trigger: >
        identity/drift-patterns.yaml or identity/what-i-am.yaml absent
        after index.yaml load attempt
      behavior: >
        Non-blocking. Emit:
          "[Strategist] phase=preflight status=warn reason=identity_files_missing"
          "[Strategist] phase=preflight identity=degraded files_missing=[<list>]"
        Remediation hint: "Run `strategist compile` to deploy identity files."
        Continue. Agent operates in degraded mode; SKILL.md patterns serve as fallback.
      enforced_by: agent_only
    - code: directives_missing
      trigger: directives/core.yaml absent after index.yaml load attempt
      behavior: >
        Non-blocking. Emit:
          "[Strategist] phase=preflight status=warn reason=directives_missing"
        Continue without behavioral directives.
      enforced_by: agent_only

  write_scope: read-only

  owner: internal (orchestrator)

  fast_path:
    artifact: .strategist/.compiled/.domain.gz
    check: strategist check-stale .strategist/.compiled/.domain.gz
    log_fresh: "[Strategist] preflight=fast_path"
    log_stale: "[Strategist] preflight=standard_path"

  validation_rule: >
    If .strategist/contracts/ exists, load this contract file before executing preflight.
    Validate that all declared inputs are present before proceeding.
