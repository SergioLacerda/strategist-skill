module: intake
type: agent_phase
description: >
  Classifies the user prompt via prompt-intake skill, generates mission_id,
  emits mission checkpoint, and routes quick-draw captures to the side-quest pipeline.
  Runs after bootstrap and preflight complete.

contract:
  input:
    - name: user_prompt
      type: string
      required: true
      description: Raw user invocation text
    - name: output_threshold
      type: string
      required: false
      default: INFO
      description: Active output profile threshold (loaded during bootstrap)

  output:
    - name: task_type
      type: string
      description: Classification from prompt-intake (architecture_analysis, refactor, general, etc.)
    - name: risk_level
      type: string
      description: Estimated mission risk
    - name: constraints
      type: object
      description: delivery_strategy, legacy_compatibility, execution_intent
    - name: mission_id
      type: string
      description: Generated unique mission identifier
    - name: route
      type: enum
      values: [standard, quick_draw, direct_execute]
      description: Determines which pipeline to run

  error_conditions:
    - code: constraint_conflict
      trigger: prompt-intake returns conflicting constraints
      behavior: Stop. Ask user to resolve conflict. Do not proceed to phases.

  quick_draw_triggers:
    - "quick draw"
    - "saque rapido"
    - "saque rápido"
    - prompt starts with "TODO"
  quick_draw_behavior: >
    If any trigger matches: emit side_quest_detected with description="Quick Draw — rapid idea
    capture." before routing. Do NOT run regular intake classification. Skip §4–§7.
    Execute only quick_draw pipeline (§5.0).

  routing_matrix:
    evaluation_order:
      1: quick_draw      # keyword-based, explicit user signal — checked first
      2: direct_execute  # automatic classifier (Critical Hit) — checked second
      3: main_mission    # default, always safe
    critical_hit_conditions:
      task_type_allow: [doc_edit, content_update, readme_update, comment_update]
      risk_level_require: low
      file_count_max: 5
      keyword_deny: [investigar, propor, auditar, projetar, redesenhar, arquitetura, refatorar]
      task_type_deny: [architecture_analysis, refactor, security_audit, new_feature]
      tie_break: main_mission
    emit_on_route_selected:
      format: "[Strategist] phase=intake route_selected={route} task_type={task_type} risk_level={risk_level}"
      level: INFO

  mission_checkpoint:
    emit_key: mission_checkpoint
    emit_level: INFO
    after: intake_complete
    initial_state:
      step_1_icon: "⏳"
      step_2_icon: "⬜"
      step_3_icon: "⬜"
      step_4_icon: "⬜"
    transitions:
      after_ranger_done:    { step_1: "✅", step_2: "⏳" }
      after_archivist_done: { step_1: "✅", step_2: "✅", step_3: "⏳" }
      after_gate_approved:  { step_1: "✅", step_2: "✅", step_3: "✅", step_4: "⏳" }
      after_sniper_done:    { step_1: "✅", step_2: "✅", step_3: "✅", step_4: "✅" }
    skip_reemit_on: [analysis_delivered, revision_requested, rejected]

  mission_metrics:
    emit_key: mission_metrics
    emit_level: INFO
    after: intake_complete_and_each_phase_transition
    fields:
      - mission_id
      - t_start_to_intake_ms
      - t_intake_to_ranger_ms
      - total_wall_time_ms
      - tokens_in
      - tokens_out
      - lines_emitted
    note: >
      Timing and volume metrics are emitted alongside the checkpoint so the
      mission can be measured without changing the visible phase flow.

  persona_template_access: "persona.content_by_lang[active.language.chat].<key>"
  persona_fallback: en

  write_scope: read-only
  owner: internal (orchestrator)
