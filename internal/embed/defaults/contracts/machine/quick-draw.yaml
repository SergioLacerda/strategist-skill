module: quick-draw
type: routing_contract
description: >
  Quick Draw (Saque Rápido) — rapid idea capture pipeline.
  Triggered when a prompt is clearly a note, idea, or quick capture.
  Runs a shortened pipeline: Ranger (normalize) → Archivist (theme/path) → Gate → Sniper (append).
  Skips the full Ranger discovery and Archivist refinement phases.

# --- Detection (§3.1 of intake contract) ---

detection:
  triggers:
    - prompt is clearly a note, idea, or quick capture
    - signals: "quick draw", "saque rapido", "TODO:", "ideia:", "nota:"
  on_match: route_to_quick_draw_pipeline
  on_no_match: continue_main_pipeline

  preserve_mission_id: true

# --- Pipeline: §5.0 of mission-phases contract ---

pipeline:
  - phase: pre_scan             # §5.0pre — scan pending missions before capture
  - phase: ranger_quick_draw    # §5.0a
  - phase: archivist_quick_draw # §5.0b
  - phase: runbook_opportunity  # §5.0b2 — advisory only, no write
  - phase: gate                 # §5.0c — mandatory stop
  - phase: sniper_quick_draw    # §5.0d — conditional on gate approval

phases:
  pre_scan:
    description: >
      Scan analysis files for missions awaiting action before starting capture.
      Informational only — does not block Quick Draw.
    action:
      - scan: "<base_path>/refined/*/analysis.md"
      - filter_by_status: [gate_analysis_accepted, gate_pending]
      - if_found:
          emit: pending_missions_found count=N ids=[list]
          include_in_gate: "⚠️ {N} pending mission(s): {ids}"
      - if_not_found: continue silently

  ranger_quick_draw:
    input: original_prompt
    output: one normalized line
    format: "idea: <formalization without expanding scope>"
    constraints:
      - must_not: add requirements, milestones, or implementation details
      - must_not: expand scope beyond the captured note
    scope_enforcement:
      signals_of_expansion:
        - mentions specific files to edit or create
        - contains execution steps ("run", "install", "update X to Y", "commit")
        - references dependency changes
        - implies multi-step implementation
      on_expansion_detected:
        mark: scope_expansion=true
        action: capture idea headline only — drop implementation details
        gate_warning: "⚠️ scope expansion detected — recording the idea only"
        gate_extra_option:
          escalar: route to full Strategist pipeline with new mission_id

  archivist_quick_draw:
    theme_buckets:
      # Routing criteria:
      # analise-tecnica: tests, coverage, schema, CI, refactor, code architecture
      # analise-negocios: product, roadmap, prioritization, UX, value trade-offs
      # analise: fallback for ambiguous entries
      pt-BR: [arquitetura, seguranca, analise, analise-tecnica, analise-negocios, geral]
      en: [architecture, security, analysis, analysis-technical, analysis-business, general]
    destination: "<base_path>/todo/<bucket>.md"
    compute:
      - ideas_added: 1   # count of entries written in this operation; no reads from todo/

  runbook_opportunity:
    description: >
      Advisory-only routine, analogous in shape to Opportunity Attack but scoped to
      Quick Draw captures instead of refined missions. Evaluates whether the
      normalized idea (from ranger_quick_draw) describes a reusable agent-facing
      operational procedure. Emits gate metadata only — it never writes a runbook
      and never performs discovery beyond the already-captured idea.
    owner: quick_draw
    input:
      - normalized_idea (from ranger_quick_draw)
      - destination_bucket (from archivist_quick_draw)
    activation_criteria:
      repeated_failure_with_recovery: idea records a repeated operational failure and a known recovery sequence
      runtime_governance_diagnostic: idea explains how an agent should diagnose or unblock a known runtime/provider/governance state
      executable_decision_procedure: idea captures a decision procedure a future agent can execute without broad discovery
      source_runtime_lookup_rule: idea identifies a source/runtime lookup pattern that prevents stale or non-canonical behavior
      verified_procedure_worth_preserving: idea preserves verified commands, symptoms, expected outputs, and stop conditions
    non_signals:
      - generic idea with no procedure
      - one-off implementation task
      - broad feature request needing normal discovery/refinement
      - a note whose correctness has not been validated
      - architecture trade-off note — belongs to Opportunity Attack / ADR, not here
    output:
      warranted: boolean
      reason: short operational reason
      candidate_id: "RB-{mission_id}"   # null when warranted=false
      candidate_title: short runbook candidate title   # null when warranted=false
      confidence: low|medium|high
    on_warranted:
      action: add_runbook_side_quest_to_gate
      gate_extra_option:
        runbook: create_runbook_candidate   # only offered when warranted=true
      gate_display: >
        📖 Runbook Opportunity
        [RB-{mission_id}] Draft agent runbook candidate — impact: {confidence}
    on_not_warranted:
      action: emit_done_no_runbook
      emit: "[Strategist] phase=quick_draw runbook_opportunity=done runbook_warranted=false"
    emit:
      format: "[Strategist] phase=quick_draw runbook_opportunity=done runbook_warranted={bool}"
      emit_level: DEBUG
    invariants:
      - this routine MUST NOT write a runbook file directly — it only proposes a candidate at the gate
      - selecting the runbook gate option creates a reviewable candidate, never a trusted canonical docs/runbooks/ entry, without further human review
      - this routine MUST NOT perform discovery beyond the already-normalized Quick Draw idea
      - this routine MUST NOT evaluate ADR-worthiness — that remains Opportunity Attack's responsibility
      - this routine MUST NOT evaluate card closure or movement — that remains Critical Hit's responsibility
      - emit always produced after evaluation (runbook_warranted=false is valid; silence is not)
    write_scope: read-only (evaluates the already-captured idea; any write happens only via sniper_quick_draw after explicit gate approval)

  gate:
    template_key: quick_draw_gate          # persona.content_by_lang[lang].quick_draw_gate
    success_template_key: quick_draw_success
    responses:
      sim: proceed_to_sniper
      nao: return_without_writing
      escalar: escalate_to_full_mission    # only shown when scope_expansion=true
      runbook: create_runbook_candidate    # only shown when runbook_opportunity.warranted=true
    runbook_response_policy: >
      The runbook option is independent of sim/nao: selecting it creates a runbook
      candidate but does not by itself append the Quick Draw idea, and confirming
      sim does not by itself create a runbook candidate. Each action requires its
      own explicit confirmation — a user may select one, both, or neither.
    policy_eval:
      transition_group: finalize_analysis
      emit: "[Strategist] phase=policy_eval status={status} mission={id} mode={mode} can_execute={bool} transition_group=finalize_analysis"
      on_blocked: stop reason=policy_blocked

  sniper_quick_draw:
    action: append entry to destination file
    entry_format: "timestamp + normalized idea"
    return_keys:
      - destination_path
      - ideas_added
    runbook_candidate_action:
      trigger: gate response includes "runbook" (see runbook_response_policy)
      action: create_reviewable_runbook_candidate
      allowed_forms:
        - a pending mission stub under "<base_path>/pending/" that asks for a runbook, routed through the normal discovery/refinement pipeline
        - a draft appended to the destination bucket clearly tagged as a runbook candidate, not a canonical runbook
      forbidden:
        - writing directly to docs/runbooks/<slug>.md from this phase
        - promoting the candidate to canonical without human acceptance
      note: >
        The candidate is a request for a runbook, not the runbook itself. Accepted
        runbooks live under docs/runbooks/ (see docs/runbooks/README.md) only after
        explicit human review.

# --- Escalation: full mission pipeline ---

escalation:
  trigger: gate response == "escalar"
  action:
    - generate new mission_id (derived from quick draw idea + timestamp)
    - route to main Strategist pipeline (bootstrap → preflight → intake → discovery → ...)
    - the quick draw idea becomes the mission prompt

# --- Persona keys used ---

persona_keys:
  - quick_draw_detected   # emitted when detection matches
  - quick_draw_gate       # gate prompt shown to user
  - quick_draw_success    # confirmation after successful append
  - pending_missions_found  # emitted by pre_scan when gate_analysis_accepted/gate_pending missions exist
  - runbook_opportunity   # gate side-quest text shown when runbook_opportunity.warranted=true
