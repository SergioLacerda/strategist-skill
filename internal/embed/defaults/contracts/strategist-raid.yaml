module: strategist-raid
type: batch_orchestration
version: "0.1"

description: >
  Skill /strategist-raid — batch orchestration of captured ideas.
  Given an idea file, processes all entries with status: captured,
  invoking Strategist in refinement mode for each one.

inputs:
  source_file:
    required: true
    description: Path to a .md file with captured idea entries
  filter_status:
    default: captured
    description: Filter entries by status

gate:
  pre_batch:
    show: list of entries to process (id, idea, origin)
    responses:
      yes: process all
      sim: process all  # reserved Portuguese input token (see internal/i18n/reserved.go)
      select: "N,M,... — process selected"
      no: cancel
      nao: cancel  # reserved Portuguese input token

per_entry:
  invoke: strategist --task refine --input <entry_text>
  artifact_dir: "<base_path>/refined/<slug>/"
  on_success: update source entry status → analyzed
  on_failure: skip, log, continue

output:
  summary: "N refined, M skipped, errors listed"

constraints:
  - must_not: invoke recursively if already inside a Strategist mission
  - must_not: execute (Sniper) without separate gate per entry
