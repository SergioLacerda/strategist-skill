module: approval-gate
type: gate
description: >
  Mandatory gate between Archivist and Sniper. User must explicitly approve
  before any execution occurs. Declining results in plan_only mission status —
  not an error. Gate cannot be bypassed under any circumstance. Any direct
  repository mutation attempted before approval must fail with
  `pipeline_bypass_detected`.

contract:
  input:
    - name: artifact_path
      type: path
      required: true
      description: Path to the refined plan artifact to present to the user

  gate:
    emit_prompt_key: approval_prompt
    emit_level: INFO
    emit_on_show:
      format: "[Strategist] phase=approval_gate status=shown artifact_path={artifact_path}"
      emit_level: INFO
    stop: true
    wait_for_response: true

  responses:
    approve_aliases: [yes, approve, authorize, sim, autorizar]
    decline_aliases:  [no, decline, stop, nao, cancelar]

  # approval_policy controls who can approve the gate.
  # mode: any           — any positive alias is accepted (default, backward-compatible)
  # mode: explicit_confirm — requires a confirmation phrase after the positive alias
  #                          phrase: "confirmo execução de {mission_id}"
  # mode: human_only    — heuristic detection of automated responses (phase 2, not yet enforced)
  approval_policy:
    mode: any

  on_approve:
    emit_format: "[Strategist] phase=approval_gate status=approved"
    emit_level: TRACE
    checkpoint_update:
      step_3_icon: "✅"
      step_4_icon: "⏳"
    next_phase: sniper

  on_decline:
    emit_format: "[Strategist] phase=approval_gate status=plan_only"
    emit_level: TRACE
    mission_result_status: plan_only
    next_phase: adr_opportunity

  invariants:
    - gate must emit status=approved or status=plan_only before sniper is invoked
    - plan_only is a valid terminal state, not an error
    - checkpoint is re-emitted on approve (not on decline)
    - direct repository mutation before approval emits reason=pipeline_bypass_detected
    - pipeline_bypass_detected must include expected_phase=approval_gate and missing_evidence=approval_gate:approved

  write_scope: read-only
  owner: internal (orchestrator)
