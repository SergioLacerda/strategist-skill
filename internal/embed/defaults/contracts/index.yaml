schema_version: "1"
description: >
  Phase contract manifest for Strategist. Lists the authoritative loading order
  for narrative contracts and the machine contracts required at each phase.
  Agent reads this file first, then loads only the phases relevant to the current route.

narrative:
  load_order:
    - narrative/00-routing.md
    - narrative/01-bootstrap.md
    - narrative/02-intake.md
    - narrative/03-discovery.md
    - narrative/04-refinement.md
    - narrative/05-approval-gate.md
    - narrative/06-execution.md
    - narrative/07-adr.md
    - narrative/08-learning.md
    - narrative/09-response.md
    - narrative/10-telemetry.md
    - narrative/11-critical-hit.md

  by_phase:
    bootstrap:   [narrative/00-routing.md, narrative/01-bootstrap.md]
    intake:      [narrative/02-intake.md]
    discovery:   [narrative/03-discovery.md]
    refinement:  [narrative/04-refinement.md]
    gate:        [narrative/05-approval-gate.md]
    execution:   [narrative/06-execution.md]
    adr:         [narrative/07-adr.md]
    learning:    [narrative/08-learning.md]
    response:    [narrative/09-response.md]
    telemetry:   [narrative/10-telemetry.md]
    critical_hit: [narrative/11-critical-hit.md]

machine:
  always_load:
    - machine/preflight.yaml
    - machine/mission-status.yaml
  by_phase:
    bootstrap:   [machine/bootstrap.yaml, machine/keen-senses.yaml]
    intake:      [machine/intake.yaml, machine/scout-routing.yaml]
    discovery:   [machine/opportunity-attack.yaml]
    refinement:  [machine/opportunity-attack.yaml]
    gate:        [machine/approval-gate.yaml, machine/riposte.yaml]
    # riposte.yaml also fires at mission close (sq_backlog drain) — response phase:
    response:    [machine/riposte.yaml]
    execution:   [machine/compliance-summary.yaml]
    adr:         [machine/adr.yaml]
    learning:    [machine/learning-curator.yaml, machine/learning-buffer.yaml]
    quick_draw:  [machine/quick-draw.yaml]
    critical_hit: [machine/critical-hit.yaml]
    compile:
      - machine/compile-all.yaml
      - machine/compile-config.yaml
      - machine/compile-domain.yaml
      - machine/compile-knowledge-index.yaml
      - machine/context-enrichment.yaml
      - machine/check-stale.yaml
    # Not an agent-loaded pipeline phase: this is a CI/lint-enforced rule about
    # this repository's own internal/ Go package layout (depguard +
    # internal/domain/architecture_test.go), never read by the agent during a
    # user mission. Kept out of always_load to avoid spending mission tokens
    # on a contributor-only concern; kept under by_phase (rather than a
    # separate section) so it still counts as referenced by the manifest.
    governance:
      - machine/architecture-rules.yaml
    # Cross-cutting reference catalog (W7b): the normative source for error/blocked
    # token reason+action text. Loaded on demand when emitting or interpreting a
    # blocked state — not tied to a single pipeline phase.
    errors:
      - machine/errors.yaml

supplemental:
  - strategist-raid.yaml   # batch refinement route — loaded on /strategist-raid invocation
