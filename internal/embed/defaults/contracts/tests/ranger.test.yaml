subject: roles/ranger.yaml
version: "2.0"

invariants:
  - id: scope_observation_not_opportunity_attack
    description: Ranger records side quests and scope observations — does not invoke opportunity_attack
    rule: ranger_done → scope_observations section present in artifact (even if empty); no opportunity_attack emit

  - id: no_strategy_decisions
    description: Ranger surfaces items only — does not decide strategy for side_quests
    rule: ranger outputs analysis artifact only; strategy is deferred to Archivist

  - id: emit_on_completion
    description: Ranger emits done event with artifact path via persona key
    rule: on success → emit via ranger_done persona key with artifact_path

  - id: treasure_chests_mandatory
    description: Ranger must consult chests scoped to discovery or all before generating artifact
    rule: chests where scope=discovery|all → consult before writing; empty list is non-blocking

cases:
  - name: normal_run_no_side_quests
    given:
      side_quests_found: 0
    expect:
      artifact: "<base_path>/pending/<mission_id>-analysis.md"
      scope_observations: section present, empty or absent items
      no_emit: opportunity_attack

  - name: side_quests_found
    given:
      side_quests_found: 2
    expect:
      artifact: scope_observations section records 2 items
      no_emit: opportunity_attack
      action: handoff side_quests to Archivist for strategy decision

  - name: ranger_failure
    given:
      slot_fails: true
    expect:
      emit: "[Strategist] phase=ranger status=blocked reason=ranger_failed"
