subject: roles/ranger.yaml
version: "1.0"

invariants:
  - id: opportunity_attack_mandatory
    description: Ranger always runs opportunity attack after artifact is written
    rule: ranger_done → opportunity_attack_done items=<N> emitted (even if N=0)

  - id: no_strategy_decisions
    description: Ranger surfaces items only — does not decide strategy for side_quests
    rule: ranger outputs analysis artifact and opportunity manifest only; strategy is deferred

  - id: emit_on_completion
    description: Ranger emits done event with artifact path via persona key
    rule: on success → emit via ranger_done persona key with artifact_path

  - id: treasure_chests_mandatory
    description: Ranger must consult chests scoped to discovery or all before generating artifact
    rule: chests where scope=discovery|all → consult before writing; empty list is non-blocking

  - id: opportunity_gate_on_items
    description: Non-zero items surface to user and wait for response before proceeding
    rule: items > 0 → present via opportunity_detected, wait for yes/no/select before Archivist

cases:
  - name: normal_run_no_items
    given:
      opportunity_items: 0
    expect:
      emit: "[Strategist] phase=ranger opportunity_attack=done items=0"
      artifact: "<base_path>/pending/<mission_id>-analysis.md"

  - name: items_found_user_approves
    given:
      opportunity_items: 3
      user_response: "yes"
    expect:
      emit: "[Strategist] phase=ranger opportunity_attack=done items=3"
      action: proceed to Archivist with manifest deferred to Sniper

  - name: items_found_user_declines
    given:
      opportunity_items: 2
      user_response: "no"
    expect:
      action: discard manifest, proceed to Archivist

  - name: ranger_failure
    given:
      slot_fails: true
    expect:
      emit: "[Strategist] phase=ranger status=blocked reason=ranger_failed"
