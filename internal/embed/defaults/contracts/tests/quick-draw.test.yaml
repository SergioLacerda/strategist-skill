subject: contracts/quick-draw.yaml
version: "1.0"

invariants:
  - id: gate_mandatory
    description: Quick draw gate cannot be bypassed — must stop and wait for sim/nao
    rule: after archivist completes → STOP, show gate, wait for response before any write

  - id: no_write_before_gate
    description: Sniper must not append before gate is approved
    rule: sim/nao gate must precede any file write

  - id: path_resolves_per_language
    description: Destination path uses the correct bucket for active.language.chat
    rule: >
      pt-BR → <base_path>/todo/<arquitetura|seguranca|analise|geral>.md
      en    → <base_path>/todo/<architecture|security|analysis|general>.md

  - id: ranger_no_scope_expansion
    description: Ranger normalizes the idea without adding requirements or milestones
    rule: "ranger output is one normalized line only — ideia: <text>"

  - id: policy_eval_before_write
    description: Policy must be evaluated before Sniper appends
    rule: policy_eval finalize_analysis must precede sniper_append

cases:
  - name: user_approves_pt_br
    given:
      gate_response: "sim"
      normalized_idea: "ideia sobre cache layer"
      theme: arquitetura
      language: pt-BR
    expect:
      action: policy_eval then append to <base_path>/todo/arquitetura.md
      output: "sucesso: ideia adicionada em <base_path>/todo/arquitetura.md"

  - name: user_declines
    given:
      gate_response: "nao"
    expect:
      action: return without writing
      output: none

  - name: user_approves_en
    given:
      gate_response: "yes"
      theme: architecture
      language: en
    expect:
      action: append to <base_path>/todo/architecture.md

  - name: policy_blocked
    given:
      gate_response: "sim"
      policy_eval: blocked
    expect:
      emit: "[Strategist] phase=policy_eval status=blocked"
      action: stop with reason=policy_blocked
