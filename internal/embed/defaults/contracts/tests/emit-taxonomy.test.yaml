subject: output-profiles/emit-taxonomy.yaml
version: "1.0"

invariants:
  - id: all_keys_have_level
    description: Every emit key must declare a severity level
    rule: for all keys in emits — level is present and non-empty

  - id: valid_levels_only
    description: Only TRACE, DEBUG, or INFO are valid levels
    rule: emits[*].level in [TRACE, DEBUG, INFO]

  - id: compliance_summary_is_debug
    description: compliance_summary is structured debug telemetry
    rule: emits.compliance_summary == DEBUG

  - id: phase_status_is_trace
    description: Pipeline telemetry lines are TRACE — suppressed in default mode
    rule: emits.phase_status == TRACE

  - id: pipeline_starting_is_debug
    description: Pipeline starting is structured debug telemetry
    rule: emits.pipeline_starting == DEBUG

  - id: generic_role_events_are_info
    description: The generic role events are rendered through the active profile
    rule: emits.role_start == INFO and emits.role_done == INFO and emits.role_task_done == INFO

  - id: role_aliases_share_the_generic_level
    description: A listed <role>_start, <role>_done or <role>_task_done key has the level of its generic role event
    rule: for all listed aliases — emits[alias] == emits[generic]

cases:
  - name: default_profile_hides_telemetry
    given:
      output_threshold: INFO
    expect:
      visible: [ranger_start, archivist_done]
      hidden: [pipeline_starting, compliance_summary, phase_status, bootstrap_path]

  - name: verbose_profile_shows_narrative
    given:
      output_threshold: DEBUG
    expect:
      visible: [pipeline_starting, compliance_summary, opportunity_attack_header, side_quest_none_found, treasure_chest_found]
      hidden: [phase_status, opportunity_attack_done]

  - name: full_profile_shows_everything
    given:
      output_threshold: TRACE
    expect:
      visible: [phase_status, opportunity_attack_done, bootstrap_path, pipeline_starting]
