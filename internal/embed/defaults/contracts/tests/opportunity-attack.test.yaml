subject: contracts/machine/opportunity-attack.yaml
version: "1.0"

invariants:
  - id: archivist_owns_adr_evaluation
    description: Archivist is the sole owner of ADR Opportunity Attack evaluation
    rule: archivist must run opportunity_attack after four refined artifacts exist

  - id: ranger_surfaces_observations
    description: Ranger surfaces scope observations but does not invoke opportunity_attack
    rule: ranger must record side_quests and scope_observations — must NOT invoke opportunity_attack routine

  - id: sniper_reports_discovered_items
    description: Sniper reports newly discovered out-of-scope items during materialization
    rule: sniper must stop_and_report any out-of-scope writes — must NOT invoke opportunity_attack routine

  - id: emit_always_produced
    description: Emit is produced even when items=0 (Archivist only)
    rule: after archivist opportunity_attack completes → emit phase=archivist opportunity_attack=done|failed

  - id: non_blocking_on_error
    description: Technical failure does not stop the pipeline
    rule: opportunity_attack_failed → emit failed reason=<why>, continue to next step

cases:
  - name: ranger_scope_observation_no_items
    given:
      role: ranger
      side_quests_found: 0
    expect:
      artifact: scope_observations section is empty or absent
      no_emit: opportunity_attack

  - name: ranger_scope_observation_with_items
    given:
      role: ranger
      side_quests_found: 2
    expect:
      artifact: scope_observations records 2 items
      no_emit: opportunity_attack

  - name: archivist_adr_evaluation_no_items
    given:
      role: archivist
      four_refined_artifacts: present
      adr_candidates: 0
    expect:
      emit: "[Strategist] phase=archivist opportunity_attack=done items=0"

  - name: archivist_adr_evaluation_with_items
    given:
      role: archivist
      four_refined_artifacts: present
      adr_candidates: 2
    expect:
      emit: "[Strategist] phase=archivist opportunity_attack=done items=2"
      action: surface ADR candidates at approval gate

  - name: sniper_out_of_scope_write_detected
    given:
      role: sniper
      out_of_scope_write: true
      items: 1
    expect:
      emit: "[Strategist] phase=sniper scope_violation=detected items=1"
      action: stop_and_report — pause materialization

  - name: technical_error
    given:
      role: archivist
      error: "file not found"
    expect:
      emit: "[Strategist] phase=archivist opportunity_attack=failed reason=file not found"
      pipeline: continues
