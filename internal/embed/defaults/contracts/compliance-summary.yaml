module: compliance-summary
type: mandatory_emit
description: >
  Mandatory block appended as the final element of every response, regardless
  of pipeline outcome (completed, plan_only, blocked, or early termination).
  Emitted as structured DEBUG telemetry. The payload is mandatory, but normal
  console visibility still depends on the active output threshold.

contract:
  emit_level: DEBUG
  emit_timing: after_all_phases
  emit_also_on: [early_termination, blocked, plan_only]

  emit_format: |
    ---
    [Strategist] response_complete
      pipeline_compliant: yes | no
      expected_phases: <n>
      executed_phases: <n>
      missing: <n>
      phases_run: <comma-separated list of phases that ran>
      phases_skipped: <list or none>
      opportunity_attack: ranger=<N> archivist=<N> sniper=<N|triggered|n/a>
      treasure_chests_consulted: yes | no | none_configured
      gate_presented: yes | no | n/a

  on_non_compliant:
    include_field: reason
    format: "  reason: <which phases were skipped and why>"

  invariants:
    - emitted on every response without exception
    - emit_level is always DEBUG — persona rendering does not alter payload
    - pipeline_compliant=no must include reason field
    - compliance_summary is the last element before mission_result

  write_scope: read-only
  owner: internal (orchestrator)
