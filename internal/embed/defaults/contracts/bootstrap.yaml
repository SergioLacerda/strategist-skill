module: bootstrap
type: agent_phase
description: >
  Loads active configuration (mode, persona, roles) from compiled artifact or YAML files.
  Runs before every mission. Must complete before Preflight is invoked.

contract:
  input:
    - name: skill_root
      type: path
      required: true
      description: Directory containing active.yaml, personas/, roles/
    - name: mode_override
      type: string
      required: false
      description: --mode flag value; overrides active.yaml.mode for this mission only
    - name: roles_override
      type: string
      required: false
      description: --roles flag value; overrides active.yaml.roles_config for this mission only

  output:
    - name: active
      type: object
      description: Parsed active.yaml content (mode, base_path, roles_config, knowledge_index_path)
    - name: persona
      type: object
      description: Resolved persona content (tone_directive, phase_labels, prompt_templates)
    - name: roles
      type: object
      description: Resolved roles content (discovery, refinement, execution provider names)
    - name: governance_injection
      type: object
      required: false
      description: Governance injection overrides if governance_injection block is active

  error_conditions:
    - code: active_yaml_not_found
      trigger: active.yaml absent from skill_root
      behavior: Emit blocked event, stop mission
    - code: persona_not_found
      trigger: personas/<mode>.yaml absent
      behavior: Emit blocked event, stop mission
    - code: invalid_local_profile
      trigger: >
        active.yaml present but fails schema validation: field `mode` absent or empty,
        `base_path` absent, or `roles_config` absent.
      behavior: >
        Emit: "[Strategist] phase=bootstrap status=blocked reason=invalid_local_profile file=<path> field=<field>"
        Stop mission. No fallback to global profile.
    - code: compiled_artifact_corrupt
      trigger: .compiled/.config.gz fails jq parse
      behavior: Fall back to standard path (load YAML directly), emit bootstrap=standard_path

  output_profile:
    description: Output verbosity resolved from --output flag at bootstrap time
    flag: --output
    valid_values: [default, verbose, full]
    default: default
    load_from: output-profiles/profiles/<flag_value>.yaml
    stores: output_threshold (level_threshold value from profile)
    fallback: if profile file missing, use INFO threshold and continue (non-blocking)

  governance_precedence:
    order:
      1: explicit user instruction (approval gates, user responses — always wins)
      2: active.yaml (local project configuration — single source of truth)
      3: governance_injection.* (external context, only when declared in active.yaml)
      4: slot provider contracts (risk_score, write scope)
      5: embedded kernel (forbidden_behaviors, stop_conditions in skill.yaml)
    note: >
      governance_injection does not override active.yaml — it extends it.
      active.yaml enables injection by declaring the governance_injection: block.

  write_scope: read-only

  owner: internal (orchestrator)

  fast_path:
    artifact: .strategist/.compiled/.config.gz
    check: sh .strategist/scripts/check-stale.sh .strategist/.compiled/.config.gz
    log_fresh: "[Strategist] bootstrap=fast_path"
    log_stale: "[Strategist] bootstrap=standard_path"
