role: ranger
slot: discovery

# Canonical behaviors — read-only, source in skill.yaml.
# Listed here for reference when writing custom_brief below.
canonical:
  - find_unexpected_items       # surface items outside declared mission scope
  - consult_treasure_chests     # consult chests scoped to discovery before generating artifact
  - output_format: "<base_path>/pending/<mission_id>-discovery.md"

# Additional instructions for the Ranger in this installation.
# Strategist appends this block to the role brief at invocation, after canonical behaviors.
# If empty or absent, only canonical behaviors are used.
#
# Examples:
#   custom_brief: |
#     Search the codebase for patterns similar to the mission scope.
#     Check open related issues before closing the discovery artifact.
custom_brief: ""

phase_procedure:
  emit_start_key: ranger_start
  emit_start_level: INFO

  invoke_slot: discovery
  slot_inputs:
    - user_prompt
    - mission_contract.planning_rules
    - dossier (from context enrichment)
    - artifact_path: "<base_path>/pending/<mission_id>-discovery.md"

  treasure_chests:
    scope_filter: [discovery, all]
    emit_key: treasure_chest_found
    emit_level: DEBUG
    empty_list_behavior: skip consultation, proceed

  artifact_requirements:
    mandatory_section: "Mission Checklist and Phase Roles"
    section_entries: [Ranger, Archivist, Sniper]
    status_markers: {"done": "[x]", "pending": "[ ]", "not_applicable": "[-]"}

  opportunity_attack:
    runs_after: artifact_written
    scan_dirs:
      pending: does this spec have a corresponding plan in refined/?
      refined: does this plan have a corresponding report in done/?
      todo: does this spec have an implementation commit in git?
    heuristic: >
      git log contains a commit referencing the spec slug OR spec lists features
      that exist as code in the repo. When uncertain, list as candidate — user decides.
    manifest_fields: [type, origin_path, destination, reason]
    emit_format: "[Strategist] phase=ranger opportunity_attack=done items=<N>"
    emit_level: TRACE
    on_items_gt_0:
      emit_key: opportunity_detected
      variables: "{count} {items_brief}"
      wait_for_response: true
      responses:
        yes: proceed to Archivist (manifest deferred to Sniper after main gate)
        no: discard manifest, proceed to Archivist
        select: user picks items by number; defer selected items only

  on_success:
    emit_key: ranger_done
    emit_level: INFO
    variables: "{artifact_path}"

  on_failure:
    emit_format: "[Strategist] phase=ranger status=blocked reason=ranger_failed"
    action: present partial artifact if any
