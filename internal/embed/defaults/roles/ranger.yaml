role: ranger
slot: discovery
origin: native
extensibility: pluggable
phase: 1                        # checkpoint position (0 is pre-pipeline)
handoff_schema: schemas/handoff-ranger-to-archivist.schema.yaml
on_start:                       # run when this role's phase starts; {role} and {mission_id} are substituted.
                                 # --host-model/--host-effort are a literal reminder to fill in with the
                                 # actual running model/effort — the CLI cannot infer them, and omitting
                                 # them silently returns blank fields.
  - strategist leveling label --role {role} --mission {mission_id} --host-model <your-model> --host-effort <your-effort>
  - strategist mechanisms brief --role {role}   # the tools (Mechanisms and Abilities) available to this role
# leveling: ranger             # optional LEVELING policy role; defaults to the role id

# INITIATIVE is consultative: resolve one advice envelope at role entry and
# carry its advice_id through the run. It never replaces the LEVELING tuple.
initiative:
  on_start: resolve_advice
  on_result: emit_initiative_result
  preserve: [advice_id, policy_version, policy_digest, alignment, evidence_refs]

# Canonical behaviors — read-only, source in skill.yaml.
# Listed here for reference when writing custom_brief below.
canonical:
  - find_unexpected_items       # surface items outside declared mission scope
  - resolve_weapon_scratch_root: # ability: cd into the resolved weapon's declared scratch root before invoking its own CLI/tooling
      read: "plugins/catalog.yaml#providers[id=<resolved_provider>].scratch_root"   # the catalog is the authority; skills/<id>/skill.yaml is only a generated compat view
      when: scratch_root == "runtime"
      action: >
        Before invoking this weapon's own CLI/tooling, ensure
        .strategist/weapon-runtime/<provider_id>/ exists (create if absent)
        and run the weapon with that as the working directory.
  - search:                     # ability: filters jewel/potion candidates from treasure chests
      when: before consult_treasure_chests decides which chests to open (Retrieval Cascade stage 6)
      filters: [jewel, potion]
      output: relevant_sources_hint     # carried in the handoff artifact, reused by Archivist by default
  - select_runbook:              # ability: scores docs/runbooks/*.runbook.yaml sidecars against mission signals
      when: same point as search — before consult_treasure_chests opens the runbooks chest (Retrieval Cascade stage 6)
      must_invoke: true              # the pipeline runs it; skipping it leaves selected_runbooks_hint null (a reported gap)
      invoke: "strategist runbook select --format json --signal <signal> [--signal <signal> ...]"
      signals: [mission_contract.task_type, route_decision.discovery_subtype, salient keywords of the request]
      reads: docs/runbooks/*.runbook.yaml   # via internal/runbook.ParseSidecar
      policy: internal/runbook.DefaultSelectionPolicy()   # max_primary=1, max_supporting=2, require_reason=true
      output: selected_runbooks_hint    # list in the handoff artifact ([] = ran, no match), reused by Archivist by default
      evidence: record the command, the signals and the result in the analysis artifact
  - consult_treasure_chests     # consult T0/T1 chests scoped to discovery before generating artifact
  - scope_observation:          # surface side quests and unexpected items during exploration
      detect: [treasure_chests, side_quests]
      output: include_in_scope_observations
      feedback: surface_in_response    # show to user before handing off to Archivist
  - compress_findings           # format: evidence → interpretation → impact (source cards)
  - output_format: "<base_path>/pending/<mission_id>-analysis.md"
  - handoff_contract: "schemas/handoff-ranger-to-archivist.schema.yaml"

# Contract
must:
  - "at phase start run the role's on_start commands to resolve and record the model x effort level, and show the role level header when the level is known (a missing level never blocks the mission)"
  - persist confidence at this boundary before finishing with `strategist metrics record --mission <mission_id> --agent ranger --claim-file -` (claim piped on stdin, never a file under `<base_path>`; see `machine/confidence-governance.yaml#producers.claim_placement`);
    when no confidence summary exists, emit `--missing --correlation-key <key> --reason <why>` instead
  - load mission_contract and respect token_strategy.mode for context budget
  - separate facts, hypotheses, and ambiguities clearly
  - surface scope_observations (side quests and unexpected items) in the response to the user before finishing
  - include all handoff contract fields in the analysis artifact
  - emit confidence_summary for every question or assertion; use missing_record=true with reason when confidence evidence is unavailable
  - preserve claim_kind question/assertion, agent, correlation_key, evidence_ids, evidence_classes, and calibration fields in the Ranger handoff
  - use discovery-artifact.md as format reference
  - when discovery_subtype is evaluation, classify implementation status as
    implemented/partially_implemented/not_implemented and record evaluation_verdict

must_not:
  - propose a final plan as if it were approved
  - execute any changes
  - pass raw context to Archivist (compress to evidence cards)
  - hide ambiguities or uncertainties

# Additional instructions for this installation.
# Strategist appends this block to the role brief at invocation, after canonical behaviors.
# If empty or absent, only canonical behaviors are used.
custom_brief: ""
