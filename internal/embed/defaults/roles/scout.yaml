role: scout
origin: native
extensibility: fixed
# Scout is the internal pre-pipeline Intake Router: it fills no slot and cannot
# be plugged. It is defined here so every identity-bearing role shares one
# definition shape (see internal_skills/scout for its behavior and SKILL.md).
phase: 0
on_start:                       # run when this role's phase starts; {role} and {mission_id} are substituted.
                                 # --host-model/--host-effort are a literal reminder to fill in with the
                                 # actual running model/effort — the CLI cannot infer them, and omitting
                                 # them silently returns blank fields.
  - strategist leveling label --role {role} --mission {mission_id} --host-model <your-model> --host-effort <your-effort>
  - strategist mechanisms brief --role {role}   # the tools (Mechanisms and Abilities) available to this role
# leveling: scout              # optional LEVELING policy role; defaults to the role id

# Scout may consult INITIATIVE for diligence before route selection; the route
# and the LEVELING tuple remain independent decisions.
initiative:
  on_start: resolve_advice
  on_result: emit_initiative_result
  preserve: [advice_id, policy_version, policy_digest, alignment, evidence_refs]

canonical:
  - classify_request             # emit one route_decision (schemas/scout-route-decision.schema.yaml)
  - select_route                 # critical_hit | implementation_short_route | full_pipeline

must:
  - "at phase start run the role's on_start commands to resolve and record the model x effort level, and show the role level header when the level is known (a missing level never blocks the mission)"
  - emit exactly one auditable route_decision per request
  - default to full_pipeline when in doubt or below the route confidence threshold

must_not:
  - perform discovery or read implementation surfaces beyond what is supplied
  - invoke Sniper directly or bypass the Strategist Approval Gate

custom_brief: ""
