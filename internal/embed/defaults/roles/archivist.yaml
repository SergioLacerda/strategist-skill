role: archivist
slot: refinement
phase: 2
pluggable: true
handoff_schema: schemas/handoff-archivist-to-sniper.schema.yaml
on_start:                       # run when this role's phase starts; {role} and {mission_id} are substituted.
                                 # --host-model/--host-effort are a literal reminder to fill in with the
                                 # actual running model/effort — the CLI cannot infer them, and omitting
                                 # them silently returns blank fields.
  - strategist leveling label --role {role} --mission {mission_id} --host-model <your-model> --host-effort <your-effort>
# leveling: archivist

# Canonical behaviors — read-only, source in skill.yaml.
# Listed here for reference when writing custom_brief below.
canonical:
  - load_ranger_analysis_artifact    # read handoff contract fields only; do NOT re-read full history
  - resolve_weapon_scratch_root:      # ability: cd into the resolved weapon's declared scratch root before invoking its own CLI/tooling
      read: "skills/<resolved_provider>/skill.yaml#scratch_root"
      when: scratch_root == "runtime"
      action: >
        Before invoking this weapon's own CLI/tooling, ensure
        .strategist/weapon-runtime/<provider_id>/ exists (create if absent)
        and run the weapon with that as the working directory.
  - reuse_search_cache:               # ability: reuse Ranger's Search/select_runbook output by default
      default: [reuse_ranger_relevant_sources_hint, reuse_ranger_selected_runbooks_hint]    # from handoff-ranger-to-archivist.schema.yaml#relevant_sources_hint / #selected_runbooks_hint
      rerun_requires: declared_reason  # see contracts/machine/handoff-contract.yaml#refinement_context_policy.allowed_reasons
  - consult_treasure_chests          # consult chests scoped to refinement
  - opportunity_attack:              # Archivist ADR evaluation routine — mandatory after four refined artifacts
      detect: [adr_criteria]         # evaluate after all four refined artifacts are written
      output: add_to_opportunity_manifest_if_criteria_met
      feedback: include_in_approval_gate   # surfaced as OA-ADR side quest at gate
  - emit_completion_signal           # must emit has_execution_tasks: true|false after writing artifacts
  - output_format:
      - "<base_path>/refined/<mission_id>/proposal.md"
      - "<base_path>/refined/<mission_id>/design.md"
      - "<base_path>/refined/<mission_id>/tasks.md"
  - handoff_contract: "schemas/handoff-archivist-to-sniper.schema.yaml"

# Contract
must:
  - "at phase start run the role's on_start commands to resolve and record the model x effort level, and show the role level header when the level is known (a missing level never blocks the mission)"
  - persist confidence at this boundary before finishing with `strategist metrics record --mission <mission_id> --agent archivist --claim-file <file>`;
    when no confidence summary exists, emit `--missing --correlation-key <key> --reason <why>` instead; record critic and mission_quality
    boundaries with their respective agent values when those evaluations run
  - load only the Ranger analysis artifact (do NOT re-read full history)
  - write all conversational/user-facing prose (questions, framing, confirmations —
    anything other than the four written artifact files) in the `chat_language`
    value received at invocation. The four written artifact files
    (analysis.md/proposal.md/design.md/tasks.md) remain in `docs_language`,
    unaffected by this rule (see contracts/narrative/04-refinement.md § Language
    and 09-response.md § Chat Language)
  - decide side_quest_strategy for every side quest received in the handoff
  - convert ambiguities into decisions or explicit blockers
  - produce numbered tasks with scope and validation steps
  - declare allowed and forbidden file scope in handoff
  - include all handoff contract fields in the refinement output
  - validate and preserve the Ranger confidence_summary by correlation_key; do not promote questions to assertions or drop evidence fields
  - emit confidence_summary for Archivist claims, or an explicit missing_record outcome when no producer evidence exists
  - include opportunity_attack findings in the approval gate response

must_not:
  - invent evidence not present in the Ranger analysis artifact
  - execute tasks
  - expand scope without marking it as an explicit decision

# Additional instructions for this installation.
# Strategist appends this block to the role brief at invocation, after canonical behaviors.
# If empty or absent, only canonical behaviors are used.
custom_brief: ""
