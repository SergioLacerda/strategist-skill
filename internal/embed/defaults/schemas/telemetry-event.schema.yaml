schema_version: "1"
description: >
  Canonical structured telemetry fields for Strategist mission events. Runtime
  implementations may emit a subset temporarily, but the contract defines the
  target shape.

fields:
  phase:
    type: string
  status:
    type: string
  component:
    type: string
  mission_id:
    type: string
  artifact_path:
    type: string
    required: false
  selected_skill:
    type: string
    required: false
  runtime_mode:
    type: string
    required: false
  output_profile:
    type: string
    required: false
  gate:
    type: object
    required: false
    fields:
      type: string
      status: string
      response: string
  transition_group:
    type: string
    required: false
  reason:
    type: string
    required: false
  confidence:
    type: object
    required: false
    fields:
      event_id: string
      policy_version: string
      agent: string
      correlation_key: string
      claim_kind: string
      confidence_level: string
      confidence_percent: integer
      evidence_ids: list
      evidence_classes: list
      evidence_class: string
      sample_size: integer
      calibration_status: string
      ground_truth_ref: string
      ground_truth_kind: string
      ground_truth_outcome: string
      coverage_status: string
      missing_reason: string
      violation: string
