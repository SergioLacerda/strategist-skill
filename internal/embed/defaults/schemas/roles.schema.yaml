schema: roles-config
version: "1.0"
description: Required fields for roles configuration used by Strategist.

role_taxonomy:
  origin:
    type: enum
    values: [native, external]
    description: Contract owner; independent from provider pluggability.
  extensibility:
    type: enum
    values: [fixed, pluggable]
    description: Whether a provider may fill the role.
  pluggable:
    type: boolean
    removed: true
    description: Removed. A role file that still declares it is rejected; declare extensibility instead.

required_fields:
  - discovery
  - refinement
  - execution

field_rules:
  discovery:
    type: string
    non_empty: true
  refinement:
    type: string
    non_empty: true
  execution:
    type: string
    non_empty: true

on_validation_error:
  emit_format: "[Strategist] phase=preflight status=blocked reason=yaml_validation_failed file=<path> field=<field>"
  action: stop
