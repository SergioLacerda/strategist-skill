schema_version: "1"
description: >
  Route decision emitted by Scout (Intake Router) before pipeline branching.
  This is a compact, auditable classification record — NOT a discovery report.
  It is logged and telemetered; it is not written as a pending/ analysis artifact.
  The implementing skill decides the file/log format.

required_fields:
  mission_id:
    type: string
    required: true
  role:
    type: string
    required: true
    allowed_values: [Scout]
  component:
    type: string
    required: true
    allowed_values: [intake_router]
  request_category:
    type: string
    required: true
    description: >
      Coarse classification of the request, e.g. implementation_evaluation,
      creative_request, diagnostic_request, closure_request, general.
  selected_route:
    type: string
    required: true
    allowed_values:
      - critical_hit
      - implementation_short_route
      - full_pipeline
  route_reason:
    type: string
    required: true
  route_confidence:
    type: float
    range: [0.0, 1.0]
    required: true
  evidence_state:
    type: string
    required: true
    allowed_values:
      - explicit
      - insufficient
      - requires_discovery
    description: >
      explicit: enough evidence already exists for a narrow route decision.
      insufficient: the request lacks enough detail to route narrowly.
      requires_discovery: evidence must be gathered by Ranger.
  discovery_subtype:
    type: string
    required: false
    allowed_values: [creative, evaluation, diagnostic, closure_evidence]
    description: >
      Required when selected_route=full_pipeline and evidence_state=requires_discovery.
      Absent otherwise. See contracts/narrative/03-discovery.md.
  fallback_route:
    type: string
    required: true
    allowed_values: [full_pipeline]
    description: The conservative default when the route is uncertain — always full_pipeline.
  gate_required:
    type: boolean
    required: true
    description: >
      MUST always be true. Scout never sets this false on any route — the
      Strategist Approval Gate is never optional and Scout never substitutes for it.
  provider:
    type: string
    required: false
    description: >
      Resolved discovery provider id, present only when evidence_state=requires_discovery
      (e.g. brainstorming).

invariants:
  - route_confidence below contracts/machine/scout-routing.yaml's route_confidence_threshold
    forces selected_route=full_pipeline regardless of other signals
  - gate_required is always true — Scout never sets it false, on any route
  - discovery_subtype MUST be present whenever evidence_state=requires_discovery and
    selected_route=full_pipeline
  - selected_route is never quick_draw — quick_draw is resolved by keyword match before
    Scout runs and is out of Scout's scope
  - fallback_route is always full_pipeline — conservatism is the safe default
