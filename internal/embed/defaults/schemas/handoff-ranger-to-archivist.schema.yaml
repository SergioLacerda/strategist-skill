schema_version: "1"
description: >
  Handoff contract from Ranger (discovery) to Archivist (refinement).
  These fields are REQUIRED in the analysis artifact, regardless of format.
  The implementing skill (brainstorming, openspec, custom) decides the file format.
  Fields may live as YAML frontmatter, embedded sections, or separate files —
  the orchestrator must be able to locate them.

required_fields:
  mission_id:
    type: string
    required: true
  mission_status:
    type: string
    required: true
    allowed_values:
      - ranger_pending
      - ranger_done
      - archivist_pending
      - archivist_done
      - gate_pending
      - gate_analysis_accepted
      - gate_revision_requested
      - gate_rejected
      - sniper_running
      - documentation_applied
    description: >
      Runtime isolation marker set in the analysis file frontmatter. Canonical vocabulary
      and phase/successor mapping: contracts/machine/mission-status.yaml (single source
      of truth — do not restate the set elsewhere).
      Each phase writes its own status on start and completion.
      gate_analysis_accepted is the only "unclaimed" state — any Sniper may claim it.
      Sniper MUST verify mission_id and mission_status before executing.
  analysis_artifact_path:
    type: string
    required: true
  objective:
    type: string
    required: true
  analysis_summary:
    type: string
    required: true
  confidence_score:
    type: float
    range: [0.0, 1.0]
    required: true
  known_facts:
    type: list
    required: true
    item_fields: [id, text, evidence_ref]
  uncertainties:
    type: list
    required: false
    item_fields: [id, text, suggested_resolution]
  treasure_chests:
    type: list
    description: From opportunity_attack routine — chests found or used during discovery
    required: false
    item_fields: [id, trust, impact, promote_candidate]
  side_quests:
    type: list
    description: From opportunity_attack routine — adjacent work detected during discovery
    required: false
    item_fields: [id, description, relation, suggested_strategy, estimated_impact, dependencies, status]
    item_values:
      relation: [related, unrelated, duplicate]
      suggested_strategy: [execute_together, execute_later, separate_mission, discard]
      estimated_impact: [low, medium, high]
      status: [sq_pending, sq_backlog, sq_done]
    field_descriptions:
      id: "SQ-NNN format — unique within the mission"
      estimated_impact: "scope of effort if executed"
      dependencies: "list of other SQ ids or mission ids this depends on"
      status: "sq_pending when presented at gate; sq_backlog if not selected"
  discovery_subtype:
    type: string
    required: false
    allowed_values: [creative, evaluation, diagnostic, closure_evidence]
    description: >
      Carried forward from Scout's route_decision when full_pipeline was selected.
      See contracts/narrative/03-discovery.md § Discovery Subtypes.
  evaluation_verdict:
    type: string
    required: false
    allowed_values: [implemented, partially_implemented, not_implemented]
    description: >
      Required when discovery_subtype=evaluation. Absent for other subtypes.
  recommended_refinement_focus:
    type: list
    required: false
    description: Bullet points guiding the Archivist on where to focus
  narrative_state:
    type: object
    required: false
    description: Mission framing used for user-facing continuity between slots
    fields:
      mission_open: boolean
      active_phase: string
  relevant_sources_hint:
    type: list
    required: false
    item_fields: [id, kind, chest_id, ref, reason]
    item_values:
      kind: [jewel, potion]
    description: >
      Output of the Search ability (contracts/narrative/03-discovery.md § Retrieval
      Cascade, stage 6): candidate jewels/potions filtered from treasure chests before
      consult_treasure_chests decides which chests to open in full. Reused by Archivist
      by default (roles/archivist.yaml#canonical.reuse_search_cache) — re-running
      Search during refinement requires a declared reason (see
      contracts/machine/handoff-contract.yaml#refinement_context_policy).
  selected_runbooks_hint:
    type: list
    required: false
    item_fields: [runbook_id, role, chest_id, ref, reason]
    item_values:
      role: [primary, supporting]
    description: >
      Output of the select_runbook ability (contracts/narrative/03-discovery.md § Retrieval
      Cascade, stage 6): docs/runbooks/*.runbook.yaml sidecars scored against mission
      signals via internal/runbook.Select(), bounded by
      internal/runbook.DefaultSelectionPolicy() (max_primary=1, max_supporting=2,
      require_reason=true — reason is always non-empty for a returned selection).
      Reused by Archivist by default (roles/archivist.yaml#canonical.reuse_search_cache)
      — re-running select_runbook during refinement requires a declared reason (see
      contracts/machine/handoff-contract.yaml#refinement_context_policy).
  sources_consulted:
    type: list
    required: false
    item_fields: [source_path, content_fingerprint, coverage_status]
    item_values:
      coverage_status: [full, partial, skimmed]
    description: >
      Sources Ranger opened during discovery, with a fingerprint and how thoroughly
      each was read. Consumed by contracts/machine/handoff-contract.yaml to decide
      whether Archivist may reopen a source or must treat it as already covered.
  evidence_cards:
    type: list
    required: false
    item_fields: [id, question, evidence, interpretation, impact, confidence]
    description: >
      Structured question -> evidence -> interpretation -> impact -> confidence
      records, one per Discovery Question answered.
  constraints:
    type: list
    required: false
    item_fields: [id, text]
    description: Hard constraints Archivist must respect while refining.
  risks:
    type: list
    required: false
    item_fields: [id, text, severity]
    item_values:
      severity: [low, medium, high]
    description: Risks identified during discovery that refinement must account for.
  knowledge:
    type: object
    required: false
    description: >
      Epistemic stratification for the discovery output. facts[] remains the home for
      established facts (see known_facts above) — this field only adds inferences[],
      which are distinct from facts and must not be treated as decisions until
      promoted.
    fields:
      inferences:
        type: list
        item_fields: [id, text, confidence, promoted_to_decision]
        description: >
          confidence is a float in [0.0, 1.0]. promoted_to_decision is a bool set
          only by Archivist during refinement, never by Ranger — an inference
          becomes a decision during refinement, never during discovery.
