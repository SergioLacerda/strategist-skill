schema_version: "1"
description: >
  Defines recognized constraint fields and their accepted values with aliases.
  Used by prompt-intake to extract mission_contract.planning_rules from the user prompt.

fields:
  delivery_strategy:
    description: How the mission should be delivered across time.
    default: sprint
    values:
      sprint:
        description: Deliver in phases; backward-compatible changes preferred.
        aliases:
          - por sprint
          - faseado
          - iterativo
          - incremental
          - fase a fase
          - entrega faseada
      total:
        description: Full delivery in one go; legacy compatibility not required.
        aliases:
          - big bang
          - sem prazo
          - entrega total
          - tudo de uma vez
          - de uma vez
          - sem fases

  legacy_compatibility:
    description: Whether the output must maintain compatibility with existing interfaces.
    default: required
    values:
      required:
        description: Existing consumers must not break.
        aliases:
          - retrocompatível
          - backwards compatible
          - sem breaking changes
          - não pode quebrar
      not_required:
        description: Breaking changes are acceptable.
        aliases:
          - sem retrocompatibilidade
          - pode quebrar
          - breaking ok
          - clean break

  execution_intent:
    description: Whether the user intends to execute the plan after review.
    default: review_only
    values:
      review_only:
        description: User wants discovery and refinement only; will decide on execution later.
        aliases:
          - só análise
          - sem execução
          - apenas revisar
          - só plano
          - não executar
      execute:
        description: User intends to execute the plan after approval.
        aliases:
          - executar
          - implementar
          - aplicar
          - rodar
          - fazer

  urgency:
    description: Urgência da missão — impacta priorização e trade-offs de qualidade.
    default: normal
    values:
      normal:
        description: Sem prazo específico. Qualidade prioritária sobre velocidade.
        aliases:
          - sem pressa
          - quando puder
          - normal
          - sem urgência
      urgent:
        description: Prazo curto. Trade-offs de qualidade controlados são aceitáveis.
        aliases:
          - urgente
          - para ontem
          - precisa hoje
          - precisa essa semana
          - deadline curto
          - com prazo
          - tem prazo
      deferred:
        description: Baixa prioridade. Pode aguardar outras missões.
        aliases:
          - pode esperar
          - baixa prioridade
          - deferred
          - depois
          - sem prioridade

  token_strategy:
    description: >
      Execution mode inferred by prompt-intake from task_type and uncertainty signals.
      Never set by the user. Determines context budget, chest limits, and triage gate.
    inferred: true
    fields:
      mode:
        values: [lean, balanced, deep]
        default: balanced
        description: >
          lean = simple bug/task, balanced = common feature (default), deep = ambiguous/architecture
      uncertainty_level:
        values: [low, medium, high]
        default: medium
      pressure_score:
        type: integer
        description: Sum of uncertainty signals triggered. Auditable.
      signals_triggered:
        type: list
        description: Which signal rules fired during inference.
      context_policy:
        fields:
          max_sources:
            lean: 2
            balanced: 4
            deep: 8
          max_excerpt_tokens: 450
          require_source_justification: true
      triage_gate:
        fields:
          blocked:
            type: boolean
            default: false
          blocking_question:
            type: string
            description: Present only when blocked=true. One question, highest-priority missing item.

confidence_threshold: 0.65

conflict_behavior: >
  When two aliases for mutually exclusive values of the same field are detected in the
  same prompt, stop and ask the user to resolve the conflict before proceeding.
  Do NOT apply defaults when a conflict is detected.
