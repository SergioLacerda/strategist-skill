schema: slot-output
version: "1.0"
description: Output contract validation for discovery and refinement slot providers.

contracts:
  discovery_slot:
    required_fields:
      - artifact_path
      - status
    field_rules:
      artifact_path:
        type: string
        non_empty: true
      status:
        type: enum
        values: [success, completed]

  refinement_slot:
    required_fields:
      - artifact_dir
      - status
      - proposal.md
      - design.md
      - tasks.md
    field_rules:
      artifact_dir:
        type: string
        non_empty: true
      status:
        type: enum
        values: [success, completed]
      proposal.md:
        type: file
        must_exist: true
      design.md:
        type: file
        must_exist: true
      tasks.md:
        type: file
        must_exist: true

execution_slot:
  optional_fields:
    gates:
      type: array
      description: >
        Audit trail of gates approved during the mission. Each entry captures the gate
        type, the ISO 8601 timestamp when the approval was received, and the verbatim
        user response. Written by the agent when recording outcomes.tmp.
      items:
        type: object
        fields:
          type:
            type: enum
            values: [approval_gate, adr_gate, quick_draw_gate]
          approved_at:
            type: string
            format: iso8601
          response:
            type: string

failure_output:
  description: >
    Optional fields emitted by a slot provider when it fails. Used by Strategist
    to classify the failure and decide whether to retry.
  fields:
    failure_type:
      type: enum
      required: false
      values: [transient, permanent]
      default_when_absent: permanent
      description: >
        transient — temporary failure (network, rate limit, LLM unavailable); Strategist
        may re-invoke once. permanent — contract violation, invalid output, config error,
        deliberate refusal; Strategist stops immediately without retry.

on_validation_error:
  discovery_emit: "[Strategist] phase=analysis status=blocked reason=slot_output_invalid"
  refinement_emit: "[Strategist] phase=refinement status=blocked reason=slot_output_invalid"
  action: stop
