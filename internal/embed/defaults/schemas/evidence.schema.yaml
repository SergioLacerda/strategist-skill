schema_version: "1"
description: >
  Evidence record — critique_skill.txt item 3's "finding → source →
  snippet/hash → classification → confidence" chain, refined by the
  evidence_classes vocabulary proposed in .analysis/todo/v2/pathfinder.txt
  ("never promote an inference to a fact; cite every historical claim").
  Optional in any given mission's refined package; when present, evidence[]
  entries are validated against this shape and evaluated by
  internal/domain's EvaluateMissionQuality (mission_quality.go). See
  .analysis/done/20260803-critique-skill-affinity-review/design.md §
  "Consolidated Decision/Evidence Model".

fields:
  id:
    type: string
    format: "EVD-NNN or a stable slug"
    example: "EVD-001"
    required: true
  source_ref:
    type: string
    description: >
      Where this evidence came from — a file path, commit hash, ADR id,
      test name, or Treasure Chest jewel id. Not required to be a
      filesystem path; source_scope_respected
      (mission_quality.go#checkSourceScopeRespected) checks it against
      caller-supplied approved prefixes only when the caller opts in.
    required: true
  class:
    type: string
    values: [explicit, corroborated_inference, weak_inference, unknown]
    required: true
    description: >
      explicit: directly stated in the source (e.g. an ADR's own words).
      corroborated_inference: not stated outright, but supported by
      multiple independent sources (e.g. tests + commit history agreeing).
      weak_inference: a single, uncorroborated inference.
      unknown: classification not yet done — distinct from omitting class
      entirely, which fails validation
      (mission_quality.go#checkFactInferenceSeparation) rather than passing
      silently.
  confidence:
    type: string
    values: [low, medium, high]
    required: true
  confidence_percent:
    type: integer
    range: [0, 100]
    required: false
    description: Derived confidence percentage; must agree with confidence.
  valid_until:
    type: string
    format: RFC3339 timestamp
    description: >
      Optional expiry. Absent means no expiry is declared. Interpreting
      this against "now" is a caller concern — internal/domain stays free
      of a time dependency.
    required: false
  excerpt_anchor:
    type: string
    required: false
    description: >
      Which part of source_ref was cited: a line range ("L12-L34"), a heading anchor
      or a YAML path. Absent means the whole source.
  hash:
    type: string
    required: false
    description: >
      sha256 hex digest of the cited excerpt (or of the whole source when only
      file-level content was available). When excerpt is present, hash must be its digest.
  commit:
    type: string
    required: false
    description: Git commit the citation was verified against, for git-tracked sources.
  excerpt:
    type: string
    required: false
    description: >
      The quoted value or lines the finding rests on, at most 1200 bytes (never a whole
      file). Expected whenever source_ref points at mutable or regenerable state — anything
      under .strategist/ (memory logs, missions, generated files) — so the refined package
      stays checkable after that state changes or is reinstalled. The source_ref stays as a
      pointer for whoever still has the source; it is not the only evidence.
  captured_at:
    type: string
    format: RFC3339 timestamp
    required: false
    description: When excerpt was read. Required when excerpt is set.
