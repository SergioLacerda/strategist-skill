schema_version: "1"
description: >
  Handoff contract from Archivist (refinement) to Sniper (execution).
  These fields are REQUIRED in the refinement artifact, regardless of format.
  The implementing skill decides the file format.

required_fields:
  mission_id:
    type: string
    required: true
  analysis_artifact_path:
    type: string
    required: true
  proposal_path:
    type: string
    required: true
  design_path:
    type: string
    required: true
  tasks_path:
    type: string
    required: true
  approved_scope:
    type: object
    required: true
    fields:
      allowed:
        type: list
        description: Glob patterns of paths Sniper may touch
      forbidden:
        type: list
        description: Glob patterns Sniper must not touch
  implementation_plan:
    type: list
    required: true
    item_fields:
      id: string
      objective: string
      scope: list           # files or paths
      validation: list      # commands or checks
  side_quests_approved:
    type: list
    description: Side quest strategy decisions made by Archivist — surfaced at approval gate
    required: false
    item_fields: [id, description, strategy, estimated_impact, dependencies, status]
    item_values:
      strategy: [execute_together, execute_later, separate_mission, discard]
      estimated_impact: [low, medium, high]
      status: [sq_pending, sq_backlog, sq_done]
    field_descriptions:
      id: "SQ-NNN format — matches ranger handoff id"
      description: "brief description of the side quest"
      estimated_impact: "scope of effort if executed"
      dependencies: "list of other SQ ids or task ids this depends on"
      status: "sq_pending when gate opens; sq_backlog if user does not select it"
  acceptance_checks:
    type: list
    required: true
    description: Conditions that must be true for the mission to be considered complete
  stop_conditions:
    type: list
    required: true
    known_values: [scope_drift, missing_file, validation_failure, ambiguity]
    description: Conditions under which Sniper must stop and report, not decide
