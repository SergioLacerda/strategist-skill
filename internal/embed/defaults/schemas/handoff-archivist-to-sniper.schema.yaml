schema_version: "1"
description: >
  Handoff contract from Archivist (refinement) to Sniper (execution).
  These fields are REQUIRED in the refinement artifact, regardless of format.
  The implementing skill decides the file format.

required_fields:
  mission_id:
    type: string
    required: true
  analysis_artifact_path:
    type: string
    required: true
  proposal_path:
    type: string
    required: true
  design_path:
    type: string
    required: true
  tasks_path:
    type: string
    required: true
  approved_scope:
    type: object
    required: true
    fields:
      allowed:
        type: list
        description: Glob patterns of paths Sniper may touch
      forbidden:
        type: list
        description: Glob patterns Sniper must not touch
  implementation_plan:
    type: list
    required: true
    item_fields:
      id: string
      objective: string
      scope: list           # files or paths
      validation: list      # commands or checks
      task_type: string
    item_values:
      task_type: [documentation_target, analysis_artifact, implementation_handoff, out_of_scope]
    field_descriptions:
      task_type: >
        Archivist classification of this item. Only documentation_target items are
        Sniper-executable. implementation_handoff items (code/hook/config/test mutation)
        must never be presented as Sniper-executable work — see 04-refinement.md and
        06-execution.md.
  confidence_summary:
    type: object
    required: true
    description: >
      Versioned confidence envelope preserved from Ranger and refined by Archivist.
      Questions remain questions unless explicitly resolved; assertion evidence
      references must resolve before the package is presented at the Approval Gate.
    fields:
      policy_version:
        type: string
        required: true
      claims:
        type: list
        required: true
        item_fields: [id, statement, agent, correlation_key, claim_kind, confidence_percent, confidence_level, evidence_ids, evidence_classes, risk_level, ground_truth_ref, ground_truth_kind, ground_truth_outcome]
        item_values:
          evidence_classes: [explicit, corroborated_inference, weak_inference, unknown]   # schemas/evidence.schema.yaml#class
      open_questions:
        type: list
        required: false
        item_fields: [id, statement, confidence_percent, resolution_status]
      evidence:
        type: list
        required: false
        item_fields: [id, source_ref, class]
        item_values:
          class: [explicit, corroborated_inference, weak_inference, unknown]   # schemas/evidence.schema.yaml#class
      sample_size:
        type: integer
        required: true
      calibration_status:
        type: string
        required: true
        allowed_values: [no_sample, uncalibrated, observed, calibrated]
      missing_record:
        type: boolean
        required: true
      violations:
        type: list
  handoff_policy_facts:
    type: object
    required: true
    location: frontmatter of analysis.md (key handoff_policy_facts)
    description: >
      Typed facts Archivist declares so the handoff challenge policy can be derived
      without reading prose. Every field is required: an absent or null field makes a
      require_when predicate unknowable and the package is rejected, never inferred.
      implementation_handoff_present is not declared; it is derived from the task_type of
      each tasks.md / implementation_plan item. The Approval Gate is not a fact here.
    fields:
      schema_version:
        type: string
        allowed_values: ["strategist-handoff-policy-facts/v1"]
      mandatory_constraints:
        type: list
        description: Constraints Sniper must honor; empty list when none
      unresolved_questions:
        type: list
        description: Open questions carried into the handoff; empty list when none
      forbidden_scope:
        type: list
        description: Scope forbidden beyond Sniper's defaults; empty list when none
      destructive_operation_possible:
        type: boolean
      security_sensitive_task:
        type: boolean
      informational_only:
        type: boolean
        description: >
          true only for a documentation-only package. Declaring it while any require fact
          holds (a list above is non-empty, a flag above is true, or a task is an
          implementation_handoff) is contradictory and rejected.
    rules:
      - the optional intake risk_level may only make the derived policy stricter
      - a package whose handoff_policy_facts are absent, unknown, null or contradictory has no evaluable policy
  handoff_outcome:
    type: object
    required: false
    description: >
      Durable terminal record written by `strategist handoff evaluate` under
      missions/handoff/<mission_id>/attempt-<n>.json. It is runtime state, not a package
      field; a package may mirror it as handoff_verification metadata but metadata presence
      is never proof, and a mismatch with the persisted outcome fails closed.
    fields:
      schema_version: strategist-handoff-outcome/v1
      mission_id: string
      transition: archivist_to_sniper
      package_digest: sha256 of proposal.md, design.md, tasks.md, the analysis.md body and its handoff_policy_facts
      attempt: integer, derived from the recorded outcomes
      result:
        type: string
        allowed_values: [passed, failed, skipped]
      policy_id: digest of the policy rules the outcome was decided under
      required: boolean
      signals: the evaluated require/skip signals
      provenance: list of {signal, source, detail}
      gate_observed: mission state the Approval Gate evidence was read from
      integrity: digest of every other field
  side_quests_approved:
    type: list
    description: Side quest strategy decisions made by Archivist — surfaced at approval gate. An accepted OA-ADR-<mission_id> entry is recorded by `strategist mission accept-side-quest` and becomes the mission's gate-derived ADR documentation target
    required: false
    item_fields: [id, description, strategy, estimated_impact, dependencies, status, confidence_percent, investigation_required]
    item_values:
      strategy: [execute_together, execute_later, separate_mission, discard]
      estimated_impact: [low, medium, high]
      status: [sq_pending, sq_backlog, sq_done]
    field_descriptions:
      id: "SQ-NNN format — matches ranger handoff id"
      description: "brief description of the side quest"
      estimated_impact: "scope of effort if executed"
      dependencies: "list of other SQ ids or task ids this depends on"
      status: "sq_pending when gate opens; sq_backlog if user does not select it"
      confidence_percent: >
        optional, integer 0-100. Present only when investigation_required is
        false/absent. Never fabricate a low or placeholder value to fill this
        field — a side quest without enough evidence to assess is
        investigation_required, not a low confidence_percent.
      investigation_required: >
        optional boolean, default false. true means the side quest cannot be
        confidently assessed yet — the gate must show "precisa investigar"
        instead of a percentage, and confidence_percent must be omitted. This
        mirrors the existing claim_kind: question rule for tasks (a claim that
        cannot support an assertion is a question, never a guessed percent).
  acceptance_checks:
    type: list
    required: true
    description: Conditions that must be true for the mission to be considered complete
  stop_conditions:
    type: list
    required: true
    known_values: [scope_drift, missing_file, validation_failure, ambiguity]
    description: Conditions under which Sniper must stop and report, not decide
  handoff_verification:
    type: object
    required: false
    description: >
      Optional semantic handoff challenge metadata for the Archivist -> Sniper
      transition. This complements YAML structure validation; it never replaces the
      Strategist Approval Gate.
    fields:
      enabled:
        type: boolean
      transition:
        type: string
        allowed_values: [archivist_to_sniper]
      required:
        type: boolean
      required_types:
        type: list
        allowed_values: [objective, boundary, classification, gate]
      require_all_critical:
        type: boolean
      max_attempts:
        type: integer
      on_failure:
        type: string
        allowed_values: [return_to_archivist]
      challenges:
        type: list
        item_fields: [id, type, source_refs, critical]
        item_values:
          type: [objective, boundary, classification, gate]
      acknowledgment:
        type: object
        required: false
        fields:
          understood_refs: list
          classifications: object
          gate_allowed: boolean
