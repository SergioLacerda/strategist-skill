schema: mission-result
version: "1.0"
description: >
  Canonical result statuses for a completed Strategist mission.
  Documentation-pipeline semantics replace legacy single-mode execution concepts.

field_rules:
  mission_id:
    type: string
    required: true
    description: Unique identifier generated during intake. Required for parallel mission support.
  status:
    type: enum
    values: [analysis_delivered, documentation_applied, revision_requested, rejected, blocked]
    descriptions:
      analysis_delivered: refined analysis delivered without documentation materialization
      documentation_applied: approved documentation materialized to declared targets
      revision_requested: user identified a missing item or correction; Archivist must revisit
      rejected: user rejected analysis as not matching the original request
      blocked: pipeline stopped due to contract, governance, or safety blocker
  jewels_consulted:
    type: array
    required: false
    description: >
      Deduplicated IDs of jewels consulted across this mission's discovery and
      refinement phases (see context-enrichment.yaml jewel_retrieval). Forwarded by
      learning-curator into outcome-entry.schema.yaml's jewel_ids field. Absence means
      no jewels were consulted, or the mission predates this field — not an error.
    items:
      type: string
      non_empty: true

invariants:
  - id: only_documentation_pipeline_statuses
    rule: mission result must only carry statuses from the documentation-pipeline values list above
  - id: documentation_scope_only
    rule: documentation_applied is only reachable after approval gate acceptance and Sniper documentation materialization
  - id: revision_loops_to_archivist
    rule: revision_requested must return pipeline control to Archivist, never to Sniper directly
