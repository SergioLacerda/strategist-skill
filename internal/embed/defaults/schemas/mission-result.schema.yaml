schema: mission-result
version: "1.0"
description: Shape of the object returned at the end of every Strategist mission.

fields:
  mission_id:
    type: string
    required: true
    description: Unique identifier generated during intake

  status:
    type: enum
    values: [analysis_delivered, documentation_applied, revision_requested, rejected, blocked]
    required: true
    description: >
      analysis_delivered      — refined analysis delivered; approval gate did not result in documentation
      documentation_applied   — Sniper materialized all approved documentation targets
      revision_requested      — user identified a missing item; Archivist must revisit
      rejected                — user rejected analysis as not matching the request
      blocked                 — pipeline stopped due to a blocker before completion

  artifacts:
    type: object
    required: false
    description: Paths to produced artifacts (only fields present when the phase ran)
    fields:
      discovery:
        type: path
        present_when: Ranger ran
        path_template: "<base_path>/refined/<mission_id>/analysis.md"
      opportunity_report:
        type: string
        value: inline
        present_when: opportunity execution ran (items > 0 and user approved)
      refined_plan:
        type: path
        present_when: Archivist ran
        path_template: "<base_path>/refined/<mission_id>/"
      documentation_report:
        type: path
        present_when: Sniper ran and documentation materialization completed
        path_template: "<base_path>/archived/<mission_id>-report.md"
      adr:
        type: path
        present_when: ADR generated and committed (gate_2 approved)
        path_template: "<base_path>/archived/<mission_id>-adr.md"

  blockers:
    type: array
    items: string
    default: []
    description: List of blocker codes when status=blocked
