id: sniper
version: "1.0.0"
schema_version: "1"
status: active
risk_score: controlled
category: documentation

description: >
  Documentation materialization skill for the Strategist pipeline. Materializes approved
  execution_snapshot artifacts one at a time. Requires gate_analysis_accepted in artifact
  frontmatter before any action. Git mutating commands and code file writes are forbidden.

input:
  refined_plan: object           # from Archivist handoff
  execution_snapshot: object     # immutable hierarchical snapshot from the execution entry
    fields: [version, mission_id, groups]
  execution_targets: array       # legacy flat projection; never expands authorization
  base_path: string
  mission_id: string
  treasure_chests: array         # chests scoped to documentation materialization

output:
  report_path: string            # <base_path>/archived/<mission_id>-report.md
  mission_status: string         # documentation_applied on completion

completion_signal:
  format: |
    sniper: done
    report_path: <report_path>
    mission_status: documentation_applied

claim_protocol:
  steps:
    1: Read <base_path>/refined/<mission_id>/analysis.md
    2: Confirm mission_status == gate_analysis_accepted
    3: Write atomically — mission_status: sniper_running + claimed_by: <agent_id>
    4: If status is sniper_running on check → blocked reason=already_claimed → STOP

behavior:
  - Execute claim_protocol before any action.
  - Consume execution_snapshot as the only authorized target set; never infer targets from the selected Weapon, plan prose, or a re-read of tasks.md.
  - Declare the active execution artifact at the start of each loop.
  - Materialize exactly ONE declared artifact per loop — never batch.
  - Complete a group only after every declared artifact in that group is materialized.
  - Use generic artifact metadata for completion evidence; do not branch on ADR, Runbook, OpenSpec, or Weapon names.
  - Run targeted validation after each materialization.
  - Update task checklist before advancing.
  - Stop and report on documentation_scope_violation, ambiguity, or validation failure.
  - Update frontmatter mission_status to documentation_applied on completion.

forbidden_behaviors:
  - materialize_documentation_without_review_acceptance
  - batch_multiple_tasks
  - non_documentation_write
  - write_code_files
  - run_git_mutating_commands
  - re_read_full_discovery_history
  - write_new_plan
  - decide_side_quest_strategy
  - load_context_not_in_handoff

failure_modes:
  - gate_approval_missing: mission_status is not gate_analysis_accepted. Stop. Emit reason=gate_approval_missing.
  - already_claimed: mission_status is sniper_running on claim check. Stop. Emit reason=already_claimed.
  - execution_target_missing: execution_snapshot is absent or empty. Stop. Report to user.
  - documentation_scope_violation: attempted write outside execution_snapshot artifacts. Stop. Report to user.
