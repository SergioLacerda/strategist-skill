id: dossier-builder
version: "1.0.0"
schema_version: "1"
status: active
risk_score: read_only
category: assembly
skill_type: support

description: >
  Assembles a minimal dossier from context-enrichment output and .strategist/ identity files.
  The dossier is passed to slot providers as their knowledge context.
  It MUST NOT include the full knowledge base — only relevant excerpts within token budget.

input:
  task_type: string
  enrichment_output: object        # output of context-enrichment
  identity_files: object           # loaded what-i-am.yaml + drift-patterns.yaml (if available)
  token_budget: integer
  source_cards: list               # from context-enrichment — follows source-card.schema.yaml
  mode: string                     # lean | balanced | deep — drives card limits

output:
  dossier:
    task_type: string
    directives: string | null
    good_examples: array           # max 2 items from enrichment
    bad_examples: array            # max 1 item from enrichment
    rubric: object | null
    output_template: string | null
    source_cards: array            # max cards by mode: lean=5, balanced=10, deep=20
    token_count: integer
  compression_metrics:
    sources_seen: integer          # from context-enrichment
    sources_selected: integer      # cards actually included
    tokens_estimated: integer      # sum of excerpt lengths
  evidence_pack_path: string | null  # <base_path>/<state>/<mission_id>-evidence-pack.md, null when dossier.source_cards is empty

behavior:
  - If enrichment_output is empty: produce minimal dossier with only task_type and output_template.
  - Include directives from enrichment if available; otherwise omit.
  - Include at most 2 good examples and 1 bad example, prioritized by relevance score.
  - Include rubric if present.
  - Respect token_budget. If assembling all sections would exceed the budget,
    drop bad_examples first, then good_examples (keep highest-scored), then directives.
  - Never include raw identity files (what-i-am.yaml, drift-patterns.yaml) in the dossier.
    Those are for Strategist only.
  - If source_cards is non-empty, assemble dossier source_cards section using source-card.schema.yaml.
    Apply card limits by mode (lean=5, balanced=10, deep=20).
    Prefer cards with higher trust tier (T0 > T1 > T2 > T3).
    Each card must include all required fields — id, chest, trust, excerpt, relevance, interpretation, impact.
  - Emit compression_metrics with sources_seen (from enrichment_output), sources_selected (cards included),
    and tokens_estimated (sum of excerpt character counts divided by 4).
  - If dossier.source_cards is non-empty, write a mission Evidence Pack artifact at
    <base_path>/<state>/<mission_id>-evidence-pack.md serializing the selected source_cards
    (per evidence_pack contract in machine/context-enrichment.yaml) and set evidence_pack_path
    to that path. Never load raw chest contents into the pack. Never introduce a new retrieval unit.

failure_modes:
  - empty_enrichment: return minimal dossier (task_type + template only). Not an error.
  - empty_source_cards: omit source_cards section from dossier. Not an error.
    evidence_pack_path is null; no Evidence Pack file is written. Non-blocking.
