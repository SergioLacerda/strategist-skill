id: scout
version: "1.0.0"
schema_version: "1"
status: active
risk_score: read_only
category: routing
skill_type: utility

description: >
  Internal pre-pipeline route classifier ("Intake Router"). Runs immediately after
  prompt-intake. Reads mission_contract and the user prompt, then selects
  critical_hit, implementation_short_route, or
  full_pipeline. Emits a compact route_decision — never a discovery report. Never
  performs deep discovery, never invokes Sniper directly, never bypasses the
  Strategist Approval Gate, never replaces Ranger. Scout is internal/built-in
  Strategist behavior — it is not a configurable slot and has no active.yaml entry.

input:
  user_prompt: string
  mission_contract: object       # from prompt-intake
  mission_id: string

output:
  route_decision: object         # schemas/scout-route-decision.schema.yaml

completion_signal:
  format: |
    scout: done
    selected_route: <route>
    mission_status: route_selected

behavior:
  - Classify request_category from user_prompt and mission_contract.task_type.
  - Evaluate critical_hit_candidate conditions by deferring to
    contracts/machine/critical-hit.yaml's own trigger_conditions (plain_move,
    closure_move) — do not redefine them here.
  - Evaluate implementation_short_route_candidate conditions per
    contracts/machine/scout-routing.yaml.
  - If neither matches, or route_confidence < route_confidence_threshold (0.6),
    select selected_route=full_pipeline.
  - For full_pipeline, classify discovery_subtype (creative | evaluation | diagnostic |
    closure_evidence) per contracts/narrative/03-discovery.md.
  - Never read beyond mission_contract, user_prompt, and explicitly supplied evidence —
    Scout does not open source files, run discovery, or read the target codebase.
  - gate_required is always true in the emitted route_decision, regardless of route.

forbidden_behaviors:
  - perform_deep_discovery
  - invoke_sniper_directly
  - bypass_approval_gate
  - replace_ranger
  - set_gate_required_false
  - infer_evidence_not_supplied

failure_modes:
  - ambiguous_route: cannot confidently select a narrow route. Set
      selected_route=full_pipeline, evidence_state=insufficient,
      fallback_route=full_pipeline.
