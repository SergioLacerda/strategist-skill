id: context-enrichment
version: "1.0.0"
schema_version: "1"
status: active
risk_score: read_only
category: knowledge

description: >
  Queries knowledge.index.yaml and treasure-chests.yaml by task_type tags. Applies
  source-hints.yaml priority overrides. Returns ranked knowledge excerpts and source cards
  within the configured token budget driven by token_strategy.mode. Empty result is valid.

input:
  task_type: string
  token_budget: integer
  knowledge_index_path: string     # from active.yaml
  source_hints_path: string        # memory/source-hints.yaml
  token_strategy:                  # from mission_contract — drives mode-aware budget limits
    mode: string                   # lean | balanced | deep
    context_policy: object         # max_sources, max_excerpt_tokens, require_source_justification

output:
  excerpts:                        # ranked list, highest priority first
    - source_id: string
      path: string
      content: string
      priority: string             # high, medium, low (after hints applied)
  source_cards:                    # from treasure-chests.yaml — follows source-card.schema.yaml
    - id: string
      chest: string
      trust: string                # T0 | T1 | T2 | T3
      excerpt: string
      relevance: string
      interpretation: string       # filled by Ranger during discovery
      impact: string               # filled by Ranger during discovery
  rubric: object | null
  sources_queried: integer
  sources_matched: integer
  compression_metrics:
    sources_seen: integer
    sources_selected: integer
    tokens_estimated: integer

mode_policy:
  lean:
    max_sources: 2
    max_total_tokens: 900
  balanced:
    max_sources: 4
    max_total_tokens: 2200
  deep:
    max_sources: 8
    max_total_tokens: 5000
  default: balanced

chest_stop_conditions:
  - no_task_type_match: do_not_load
  - relevance_reason_missing: do_not_load
  - source_stale_conflicts_T0: prefer_T0
  - context_budget_exceeded: summarize_or_drop_lowest_trust

behavior:
  - Load knowledge_index_path. If missing or empty, return empty output immediately.
  - Filter sources whose tags[] contain task_type OR contain "all".
  - Load source-hints.yaml and apply priority_adjustment to matching source_ids.
  - Rank matched sources by effective priority (high > medium > low).
  - Apply mode budget limits from token_strategy.mode (or default=balanced if absent).
  - Load file excerpts from each source path within the budget. Stop when budget exhausted.
  - Deduplicate by source id.
  - If treasure-chests.yaml exists, query chests by routing.task_types and routing.keywords.
    Apply trust tier scoring (T0 > T1 > T2 > T3) and chest_stop_conditions.
    Do not load chest if relevance justification cannot be stated.
  - Return at most 2 good examples and 1 bad example per task_type (from patterns/ if indexed).
  - Load and return rubric for task_type if available (from .strategist/rubrics/).
  - Emit compression_metrics with sources_seen, sources_selected, tokens_estimated.

failure_modes:
  - empty_result: no sources match task_type. Return empty excerpts, null rubric. Do not error.
  - source_path_missing: a source path in the index does not exist. Skip and continue.
  - token_budget_exceeded: stop loading excerpts when budget is reached. Return what was loaded.
  - chest_manifest_missing: treasure-chests.yaml not found. Skip chest loading, continue.
