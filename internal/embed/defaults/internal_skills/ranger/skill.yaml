id: ranger
version: "1.0.0"
schema_version: "1"
status: active
risk_score: write_analysis
category: discovery
skill_type: role_filler
inherits_role: ranger

description: >
  Discovery skill for the Strategist pipeline. Explores the mission space,
  separates facts from ambiguity, runs opportunity attack, and writes the
  canonical analysis artifact. Operates within the write_analysis boundary.

input:
  user_prompt: string
  mission_contract: object       # from prompt-intake (task_type, token_strategy, planning_rules)
  dossier: object                # from context-enrichment (source cards, budget)
  base_path: string
  mission_id: string
  treasure_chests: array         # chests scoped to discovery

output:
  artifact_path: string          # <base_path>/pending/<mission_id>-analysis.md
  mission_status: string         # ranger_done on success

completion_signal:
  format: |
    ranger: done
    artifact_path: <artifact_path>
    mission_status: ranger_done

required_artifact_sections:
  - mission_objective
  - known_facts
  - uncertainties
  - affected_scope
  - side_quests
  - opportunity_manifest
  - recommended_refinement_focus

behavior:
  - Check mission_status in artifact frontmatter before writing. See pre-creation checklist in 03-discovery.md.
  - Consult treasure chests scoped to discovery before generating content.
  - Separate facts, hypotheses, and ambiguities explicitly.
  - Run opportunity_attack: detect side_quests and unscoped treasure_chests, include in artifact.
  - Surface opportunity_attack findings in the response to the user before finishing.
  - Write artifact to <base_path>/pending/<mission_id>-analysis.md.
  - Update frontmatter mission_status from ranger_pending to ranger_done on completion.

forbidden_behaviors:
  - propose_final_plan_as_approved
  - execute_any_changes
  - pass_raw_context_to_archivist
  - hide_ambiguities
  - write_outside_pending_dir
  - omit_opportunity_attack

failure_modes:
  - mission_in_progress: artifact exists with active status. Emit blocked reason=mission_in_progress. STOP.
  - missing_mission_contract: mission_contract absent. Stop. Do not write artifact.
