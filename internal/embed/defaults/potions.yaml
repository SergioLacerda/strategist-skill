# Potions — compact, source-linked index entries for runbooks, children of the
# "runbooks" treasure chest. Sibling of Jewel (jewels.yaml): a jewel is a fact
# extracted from a mission; a potion is an index entry for one whole runbook file
# under docs/runbooks/. Generated by `strategist treasure-chest index` (scan of
# docs/runbooks/*.md) or by the agent during discovery/refinement consultation of
# the "runbooks" chest — no pre-approval gate; trust is capped at the parent
# chest's trust.tier. See .analysis/refined/runbook-jewel-relevance-mechanism/
# design.md for the full rationale and the Search ability this index feeds.
# Format version: 1

schema_version: "1"

# potion schema reference:
#
# id: string                  # unique identifier
# chest_id: runbooks           # mandatory — parent chest id (always "runbooks" in this v1)
# runbook_ref: string          # mandatory — path to the indexed runbook, e.g. docs/runbooks/<slug>.md
# when_to_use: string          # mandatory — short summary of when this runbook applies,
#                               #   extracted from the runbook's own header/intro section
#                               #   (not LLM-generated — see design.md decision)
# when_to_avoid: string        # optional
# trust: T0 | T1 | T2 | T3     # mandatory; MUST be <= parent chest's trust.tier (runbooks = T2)
# status: proposed | accepted | verified | deprecated
#   proposed   — agent- or index-generated, not yet human-curated; usable only as a hint
#   accepted   — promoted by `strategist treasure-chest items accept`
#   verified   — promoted by `strategist treasure-chest items verify`, requires evidence
#   deprecated — no longer usable at runtime
# source_refs: [string]        # mandatory — at least one, format docs/runbooks/<slug>.md#<section-slug>
# reviewed_by: agent | human
# last_reviewed: YYYY-MM-DD    # optional; set only if/when a human reviews it

potions: []
