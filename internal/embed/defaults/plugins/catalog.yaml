  - id: brainstorming
    version: "1.0.0"
    provider_schema_version: "1"
    status: active
    risk_score: write_analysis
    category: discovery
    provider_class: rankeado
    canonical_role: ranger
    installable: true
    legacy_manifest_path: skills/brainstorming/skill.yaml
    known_provider_class: neutral
    compatibility_source: embedded
    description: >
      Configured discovery-slot metadata for Strategist (risk_score/provider-class
      only). Discovery invocation no longer resolves to this weapon for any
      subtype — all discovery always resolves to internal_skills/ranger (native
      role); see contracts/narrative/00-routing.md § Discovery Weapon Resolution
      by Subtype. A live invocation of this skill's own SKILL.md revealed
      structural incompatibilities with Ranger's autonomous single-shot contract
      (see .analysis/refined/20260728-ranger-drift-eval/), so this manifest no
      longer makes any discovery-subtype capability claim.
    auxiliary_tools_allowed:
      - writing-plans

