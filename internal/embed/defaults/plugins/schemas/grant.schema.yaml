schema: strategist-plugin-resource-schema/v1
resource: grant
authority: operator_policy
additional_properties: false
limits:
  max_document_bytes: 262144
  max_path_length: 240
required:
  - schema_version
  - id
  - package_digest
  - adapter_digest
  - granted_permissions
properties:
  schema_version: {type: string}
  id: {type: string}
  package_digest: {type: digest}
  adapter_digest: {type: digest}
  granted_permissions:
    type: array
    values:
      - workspace.read
      - analysis.write
      - docs.write
      - source.write
      - network.access
      - subprocess.exec
      - external_app.access
      - secret.access
  expires_at: {type: timestamp}
forbidden_authorities:
  - requested_permissions
  - observed_behavior
  - connector_enforcement
