schema: strategist-plugin-resource-schema/v1
resource: lock
authority: resolver
additional_properties: false
limits:
  max_document_bytes: 262144
  max_path_length: 240
required:
  - schema_version
  - resolution_id
  - graph_digest
  - nodes
properties:
  schema_version: {type: string}
  resolution_id: {type: string}
  graph_digest: {type: digest}
  nodes:
    type: array
    item:
      required: [id, kind, digest]
      properties:
        id: {type: string}
        kind:
          type: enum
          values: [package, adapter_contract, dependency, connector, trust_policy, weapon, composition_edge]
        digest: {type: digest}
        weapon_kind:
          type: enum
          values: [atomic, composite]
        origin:
          type: enum
          values: [embedded, custom]
        runtime_kind:
          type: enum
          values: [embedded, host, executable, openspec_root]
        component_id: {type: string}
        depends_on: {type: array}
  conflict_explanation: {type: array}
forbidden_authorities:
  - trusted_publishers
  - granted_permissions
  - binding_status
