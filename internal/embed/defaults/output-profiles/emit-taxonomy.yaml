# Severity levels align with sdd_telemetry/constants.py (TRACE=1, DEBUG=5, INFO=9)
# and internal/telemetry/schema.go (strategist.* attribute namespace).
# OTEL export is never filtered — this taxonomy controls agent-side stdout only.
# INFO events are rendered through the active profile.
# DEBUG/TRACE events bypass persona rendering, but still respect the selected
# output threshold for visibility on normal console output.
# Speed policy bridge:
# - fast -> compact mission flow, keep visibility at the default profile threshold
# - balanced -> default mission flow, default profile threshold
# - full -> full telemetry profile and complete pipeline output

version: "1.0"

emits:
  # TRACE — pipeline telemetry ([Strategist] phase=X status=Y lines)
  # Suppressed in default and verbose output profiles.
  phase_status:                TRACE
  phase_skipped:               TRACE
  opportunity_attack_done:     INFO
  learning_buffer_flushed:     TRACE
  bootstrap_path:              TRACE
  preflight_path:              TRACE
  context_enrichment_path:     TRACE
  policy_eval:                 TRACE
  phase_blocked:               TRACE

  # DEBUG — structured telemetry and internal diagnostics
  # Bypass persona rendering. Visible in verbose and full profiles.
  opportunity_attack_header:   DEBUG
  side_quest_none_found:       DEBUG
  side_quest_detected:         DEBUG
  pipeline_starting:           DEBUG
  compliance_summary:          DEBUG
  mission_metrics:             DEBUG
  profile_source:              DEBUG
  treasure_chest_found:        INFO
  adr_opportunity:             DEBUG

  # INFO — rendered through the active profile and visible in all output modes
  ranger_start:                INFO
  ranger_done:                 INFO
  archivist_start:             INFO
  archivist_done:              INFO
  sniper_start:                INFO
  approval_prompt:             INFO
  execution_tasks_header:      INFO
  execution_task_line:         INFO
  mission_checkpoint:          INFO
  approval_gate_result:        INFO
