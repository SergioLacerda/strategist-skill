    max_depth: 1
    parallelism: 1
    context_budget: low
    evidence_depth: standard
    permissions:
      specialists: false
      side_quests: false
      deep_history: false
    escalation_allowed: true
    max_escalations: 1
  roles:
    scout:
      capability: economical
      effort: medium
      criteria:
        ambiguity: low
        risk: low
        scope: bounded
        evidence: sufficient
      escalation:
        capability: reasoning
        effort: high
      budget:
        max_delegations: 0
        max_depth: 0
        parallelism: 1
        context_budget: low
        evidence_depth: standard
        permissions:
          specialists: false
          side_quests: false
          deep_history: false
        escalation_allowed: true
        max_escalations: 1
    ranger:
      capability: reasoning
      effort: high
      criteria:
        ambiguity: medium
        risk: medium
        scope: cross_module
        evidence: sufficient
      escalation:
        capability: reasoning
        effort: xhigh
      budget:
        max_delegations: 2
        max_depth: 2
        parallelism: 1
        context_budget: medium
        evidence_depth: standard
        permissions:
          specialists: true
          side_quests: false
          deep_history: false
        escalation_allowed: true
        max_escalations: 1
    archivist:
      capability: reasoning
      effort: high
      criteria:
        ambiguity: medium
        risk: medium
        scope: cross_module
        evidence: sufficient
      escalation:
        capability: reasoning
        effort: xhigh
      budget:
        max_delegations: 2
        max_depth: 2
        parallelism: 1
        context_budget: medium
        evidence_depth: deep
        permissions:
          specialists: true
          side_quests: false
          deep_history: true
        escalation_allowed: true
        max_escalations: 1
    sniper:
      capability: economical
      effort: medium
      criteria:
        ambiguity: low
        risk: medium
        scope: bounded
        evidence: sufficient
      escalation:
        capability: reasoning
        effort: high
      budget:
        max_delegations: 1
        max_depth: 1
        parallelism: 1
        context_budget: low
        evidence_depth: minimal
        permissions:
          specialists: false
          side_quests: false
          deep_history: false
        escalation_allowed: true
        max_escalations: 1
providers:
  CODEX:
    ranked: true
    models:
      general: codex-general
      economical: codex-economical
      reasoning: codex-reasoning
    effort_tiers: [none, low, medium, high, xhigh, max]
  CLAUDE:
    ranked: true
    models:
      general: claude-general
      economical: claude-economical
      reasoning: claude-reasoning
    # Short names shown on role log lines; presentation only, not part of the
    # policy digest. Providers without `display` show the model id without its prefix.
    display:
      claude-general: Sonnet
      claude-economical: Haiku
      claude-reasoning: Opus
      # Common host model ids are explicit aliases, not policy model ids. They
      # keep role labels stable while the provider/capability provenance stays
      # in the LEVELING ledger.
      claude-sonnet-5: Sonnet
      claude-haiku-4: Haiku
      claude-opus-5: Opus
    effort_tiers: [low, medium, high, xhigh]
