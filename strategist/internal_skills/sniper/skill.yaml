id: sniper
version: "1.0.0"
schema_version: "1"
status: active
risk_score: controlled
category: execution
skill_type: role_filler
inherits_role: sniper

description: >
  Execution skill for the Strategist pipeline. Executes the approved refined package
  one task at a time. Requires gate_approval in artifact frontmatter before any action.
  Surfaces opportunity_attack findings immediately and pauses execution.

input:
  refined_plan: object           # from Archivist handoff
  approved_scope: object         # allowed files and operations from gate approval
  base_path: string
  mission_id: string
  treasure_chests: array         # chests scoped to execution

output:
  report_path: string            # <base_path>/archived/<mission_id>-report.md
  mission_status: string         # execution_done on completion

completion_signal:
  format: |
    sniper: done
    report_path: <report_path>
    mission_status: execution_done

claim_protocol:
  steps:
    1: Read <base_path>/refined/<mission_id>/analysis.md
    2: Confirm mission_status == gate_approval
    3: Write atomically — mission_status: sniper_running + claimed_by: <agent_id>
    4: If status is sniper_running on check → blocked reason=already_claimed → STOP

behavior:
  - Execute claim_protocol before any action.
  - Declare the active task at the start of each loop.
  - Execute exactly ONE task per loop — never batch.
  - Run targeted validation after each task.
  - Update task checklist before advancing.
  - Surface opportunity_attack findings immediately and pause execution.
  - Stop and report on scope drift, ambiguity, or validation failure.
  - Update frontmatter mission_status to execution_done on completion.

forbidden_behaviors:
  - execute_without_gate_approval
  - batch_multiple_tasks
  - modify_files_outside_approved_scope
  - re_read_full_discovery_history
  - write_new_plan
  - decide_side_quest_strategy
  - load_context_not_in_handoff

failure_modes:
  - gate_approval_missing: mission_status is not gate_approval. Stop. Emit reason=gate_approval_missing.
  - already_claimed: mission_status is sniper_running on claim check. Stop. Emit reason=already_claimed.
  - scope_drift_detected: attempted write outside approved_scope. Stop. Report to user.
