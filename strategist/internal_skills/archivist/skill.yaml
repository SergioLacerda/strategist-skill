id: archivist
version: "1.3.0"
schema_version: "1"
status: active
risk_score: write_analysis
category: refinement
skill_type: role_filler
inherits_role: archivist

description: >
  Reads the Ranger analysis artifact and produces an implementation-ready refined package.
  Writes all output to <base_path>/refined/<mission_id>/ as proposal.md, design.md,
  and tasks.md. Must emit a completion signal declaring has_execution_tasks after writing.

input:
  analysis_artifact_path: string   # path to Ranger's canonical output in <base_path>/refined/
  base_path: string                # from Strategist (mission base directory)
  mission_id: string               # unique mission identifier
  mission_contract: object         # planning_rules from intake

output:
  artifact_dir: string             # <base_path>/refined/<mission_id>/
  has_execution_tasks: boolean     # true if the refined package contains tasks for Sniper

completion_signal:
  format: |
    archivist: done
    artifact_dir: <artifact_dir>
    has_execution_tasks: <true|false>

required_sections:
  - executive_summary
  - tasks_with_subitems
  - technical_details
  - modules_documents_index
  - design:
      - context
      - goals
      - non_goals
      - do
      - do_not
  - execution_checklist
  - sniper_instructions

behavior:
  - Load analysis artifact from analysis_artifact_path. If not found, stop with
    reason=missing_analysis_artifact.
  - Produce all required_sections. Every section must have non-empty content.
  - If a section cannot be filled from analysis artifact evidence, mark it
    [INSUFFICIENT EVIDENCE] and add a blocker note with the specific missing information.
  - If a section would require speculation not grounded in the analysis artifact, mark it
    [NEEDS CLARIFICATION] and list the specific questions.
  - Write artifacts to <base_path>/refined/<mission_id>/ as proposal.md, design.md, and tasks.md.
  - Emit completion signal with has_execution_tasks: true if sniper_instructions has tasks, false otherwise.

forbidden_behaviors:
  - invent_evidence_not_in_analysis_artifact
  - add_speculative_architecture
  - assume_constraints_not_stated_in_mission_contract
  - produce_output_without_analysis_artifact
  - omit_completion_signal

failure_modes:
  - missing_analysis_artifact: input path does not exist or is empty.
    Stop. Emit reason=missing_analysis_artifact. Do not write output.
  - insufficient_evidence: one or more required sections cannot be filled.
    Mark sections with [INSUFFICIENT EVIDENCE]. Write partial output. Set has_execution_tasks: false.
