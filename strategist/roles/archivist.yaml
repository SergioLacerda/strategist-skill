role: archivist
slot: refinement

# Canonical behaviors — read-only, source in skill.yaml.
# Listed here for reference when writing custom_brief below.
canonical:
  - load_ranger_analysis_artifact    # read handoff contract fields only; do NOT re-read full history
  - consult_treasure_chests          # consult chests scoped to refinement
  - opportunity_attack:              # Archivist ADR evaluation routine — mandatory after four refined artifacts
      detect: [adr_criteria]         # evaluate after all four refined artifacts are written
      output: add_to_opportunity_manifest_if_criteria_met
      feedback: include_in_approval_gate   # surfaced as OA-ADR side quest at gate
  - emit_completion_signal           # must emit has_execution_tasks: true|false after writing artifacts
  - output_format:
      - "<base_path>/refined/<mission_id>/proposal.md"
      - "<base_path>/refined/<mission_id>/design.md"
      - "<base_path>/refined/<mission_id>/tasks.md"
  - handoff_contract: "schemas/handoff-archivist-to-sniper.schema.yaml"

# Contract
must:
  - load only the Ranger analysis artifact (do NOT re-read full history)
  - decide side_quest_strategy for every side quest received in the handoff
  - convert ambiguities into decisions or explicit blockers
  - produce numbered tasks with scope and validation steps
  - declare allowed and forbidden file scope in handoff
  - include all handoff contract fields in the refinement output
  - include opportunity_attack findings in the approval gate response

must_not:
  - invent evidence not present in the Ranger analysis artifact
  - execute tasks
  - expand scope without marking it as an explicit decision

# Additional instructions for this installation.
# Strategist appends this block to the role brief at invocation, after canonical behaviors.
# If empty or absent, only canonical behaviors are used.
custom_brief: ""
