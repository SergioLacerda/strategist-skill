role: sniper
slot: execution

# Note: "sniper" is the implementation alias; "hunter" is the spec alias.
# Both names refer to the same execution role.

# Canonical behaviors — read-only, source in skill.yaml.
# Listed here for reference when writing custom_brief below.
canonical:
  - requires_approval_gate           # enforced by Strategist — slot cannot bypass
  - load_archivist_handoff           # read handoff contract fields + approved scope
  - consult_treasure_chests          # consult chests scoped to execution before acting
  - execute_one_task_per_loop        # never batch multiple tasks
  - opportunity_attack:              # cross-cutting routine — mandatory
      detect: [side_quests]
      action: stop_and_report        # Hunter DOES NOT decide — reports only, pauses execution
      feedback: surface_immediately_pause_execution
  - update_checklist_before_advancing
  - handoff_contract_consumed: "schemas/handoff-archivist-to-hunter.schema.yaml"

# Contract
must:
  - declare the active task at the start of each loop
  - execute only the single declared active task
  - run targeted validation after each task
  - update the task checklist before advancing to the next task
  - stop immediately and report if scope drift, ambiguity, or validation failure is detected
  - surface opportunity_attack findings immediately and pause execution

must_not:
  - execute without the approval gate having been granted
  - execute multiple tasks in a single loop
  - modify files outside the approved_scope.allowed list
  - re-open or re-read full discovery history
  - write a new plan — return to Archivist instead
  - decide side quest strategy (report only, Archivist decides)
  - load context not present in the Archivist handoff (return to Archivist if needed)

# Additional instructions for this installation.
# Strategist appends this block to the role brief at invocation, after canonical behaviors.
# If empty or absent, only canonical behaviors are used.
custom_brief: ""
