module: quick-draw
type: routing_contract
description: >
  Quick Draw (Saque Rápido) — rapid idea capture pipeline.
  Triggered when a prompt is clearly a note, idea, or quick capture.
  Runs a shortened pipeline: Ranger (normalize) → Archivist (theme/path) → Gate → Sniper (append).
  Skips the full Ranger discovery and Archivist refinement phases.

# --- Detection (§3.1 of intake contract) ---

detection:
  triggers:
    - prompt is clearly a note, idea, or quick capture
    - signals: "quick draw", "saque rapido", "TODO:", "ideia:", "nota:"
  on_match: route_to_quick_draw_pipeline
  on_no_match: continue_main_pipeline

  preserve_mission_id: true

# --- Pipeline: §5.0 of mission-phases contract ---

pipeline:
  - phase: ranger_quick_draw    # §5.0a
  - phase: archivist_quick_draw # §5.0b
  - phase: gate                 # §5.0c — mandatory stop
  - phase: sniper_quick_draw    # §5.0d — conditional on gate approval

phases:
  ranger_quick_draw:
    input: original_prompt
    output: one normalized line
    format: "ideia: <formalizacao sem expandir escopo>"
    constraints:
      - must_not: add requirements, milestones, or implementation details
      - must_not: expand scope beyond the captured note

  archivist_quick_draw:
    theme_buckets:
      # Critério de roteamento:
      # analise-tecnica: testes, coverage, schema, CI, refactor, arquitetura de código
      # analise-negocios: produto, roadmap, priorização, UX, trade-offs de valor
      # analise: fallback para entradas ambíguas
      pt-BR: [arquitetura, seguranca, analise, analise-tecnica, analise-negocios, geral]
      en: [architecture, security, analysis, analysis-technical, analysis-business, general]
    destination: "<base_path>/todo/<bucket>.md"
    compute:
      - total_ideas: total idea entries in destination file
      - similar_ideas: ideas in same theme with textual similarity to normalized idea

  gate:
    template_key: quick_draw_gate          # persona.content_by_lang[lang].quick_draw_gate
    success_template_key: quick_draw_success
    responses:
      sim: proceed_to_sniper
      nao: return_without_writing
    policy_eval:
      transition_group: finalize_analysis
      emit: "[Strategist] phase=policy_eval status={status} mission={id} mode={mode} can_execute={bool} transition_group=finalize_analysis"
      on_blocked: stop reason=policy_blocked

  sniper_quick_draw:
    action: append entry to destination file
    entry_format: "timestamp + normalized idea"
    return_keys:
      - destination_path
      - total_ideas
      - similar_ideas

# --- Persona keys used ---

persona_keys:
  - quick_draw_detected   # emitted when detection matches
  - quick_draw_gate       # gate prompt shown to user
  - quick_draw_success    # confirmation after successful append
