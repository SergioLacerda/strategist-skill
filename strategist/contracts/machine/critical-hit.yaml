module: critical-hit
type: routing_decision
version: "0.1"

description: >
  Decision point between full pipeline (main_mission) and direct route (direct_execute).
  Evaluated after intake, before any slot provider.
  When Critical Hit conditions are met, bypasses Ranger and Archivist,
  replacing the standard approval gate with an inline confirmation gate.

trigger_conditions:
  all_of:
    - task_type: [doc_edit, content_update, readme_update, comment_update]
    - risk_level: low
    - file_count: "<= 5"
    - no_cross_module_deps: true
    - no_adr_required: true
    - no_architectural_decision: true
  none_of:
    # Keywords matched in both English and Portuguese (reserved tokens in internal/i18n/reserved.go)
    - keywords: [investigate, propose, audit, design, redesign, architecture, refactor,
                 investigar, propor, auditar, projetar, redesenhar, arquitetura, refatorar]
    - task_type: [architecture_analysis, refactor, security_audit, new_feature]

route_assigned: direct_execute

pipeline:
  omitted_phases: [discovery, refinement, opportunity_attack]
  artifacts_written: none
  gate_style: inline

inline_gate:
  display: |
    Critical Hit detected.
    Task: <task_description>
    Files: <file_list>
    Confirm direct materialization? (yes / no)
  stop: true
  wait_for_response: true
  responses:
    yes: proceed to sniper
    sim: proceed to sniper   # reserved Portuguese input token (see internal/i18n/reserved.go)
    no:  resolve as analysis_delivered (no documentation written)
    nao: resolve as analysis_delivered (no documentation written)  # reserved Portuguese token

emit:
  on_trigger:
    format: "[Strategist] phase=critical_hit status=triggered task_type={task_type} file_count={file_count}"
    level: INFO
  on_gate_approved:
    format: "[Strategist] phase=critical_hit status=gate_approved"
    level: TRACE
  on_gate_declined:
    format: "[Strategist] phase=critical_hit status=gate_declined"
    level: TRACE

write_scope: read-only (gate phase only; Sniper write scope applies after approval)
owner: internal (orchestrator)

invariants:
  - Critical Hit NEVER fires when risk_level != low
  - Critical Hit NEVER fires for tasks with cross-module dependencies
  - Critical Hit NEVER fires when any none_of keyword is present in the prompt
  - If in doubt, route to main_mission — conservatism is the safe default
  - Approval gate cannot be bypassed even in Critical Hit route
