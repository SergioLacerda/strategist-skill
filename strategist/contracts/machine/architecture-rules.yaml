id: architecture-dependency-direction
version: "1.0"
type: mandate
severity: high

description: >
  Defines the allowed import directions between internal packages.
  Violations indicate improper coupling and must be blocked in CI.

allowed_directions:
  - from: cmd/strategist
    to: [internal/compile, internal/install, internal/stale, internal/embed]
    rationale: cmd is the wiring point; may import any internal package
  - from: internal/*
    to: [internal/domain]
    rationale: all business packages depend on domain types and contracts

forbidden_directions:
  - from: internal/domain
    to: [internal/compile, internal/install, internal/stale, internal/embed]
    reason: domain is a pure layer — no infrastructure dependencies
  - from: internal/compile
    to: [internal/install, internal/stale, internal/embed]
    reason: business packages must not couple laterally
  - from: internal/install
    to: [internal/compile, internal/stale, internal/embed]
    reason: business packages must not couple laterally
  - from: internal/stale
    to: [internal/compile, internal/install, internal/embed]
    reason: business packages must not couple laterally

enforcement:
  - tool: depguard (golangci-lint)
    scope: CI — blocks lint step
  - tool: TestDomainIsolation + TestLateralIsolation (go test)
    scope: CI — blocks test step
    file: internal/domain/architecture_test.go
