module: approval-gate
type: gate
description: >
  Approval gate between Archivist and Sniper. User reviews the refined analysis and
  decides to accept, request revision, or reject. Accepting triggers documentation
  materialization by Sniper. Revision or rejection returns control to Archivist or
  ends the mission. Gate cannot be bypassed under any circumstance. Any direct
  repository mutation attempted before acceptance must fail with
  `pipeline_bypass_detected`.

contract:
  input:
    - name: artifact_path
      type: path
      required: true
      description: Path to the refined analysis artifact set to present to the user
    - name: documentation_targets
      type: array
      required: false
      description: Documentation files Sniper will materialize if analysis is accepted

  gate:
    emit_prompt_key: review_prompt
    emit_level: INFO
    emit_on_show:
      format: "[Strategist] phase=approval_gate status=shown artifact_path={artifact_path}"
      emit_level: INFO
    stop: true
    wait_for_response: true

  responses:
    accept_aliases: [agree, accepted, approve_analysis, sim, concordo, yes, approve, authorize, autorizar]
    revision_aliases: [missing_item, forgot_item, esqueci, faltou, revision, revisao]
    reject_aliases: [reject, wrong_request, nao_esta_bom, pedi_outra_coisa, no, nao, cancelar]

  on_accept:
    emit_format: "[Strategist] phase=approval_gate status=analysis_accepted"
    emit_level: TRACE
    checkpoint_update:
      step_3_icon: "✅"
      step_4_icon: "⏳"
    next_phase: sniper

  on_revision_requested:
    emit_format: "[Strategist] phase=approval_gate status=revision_requested"
    emit_level: TRACE
    mission_result_status: revision_requested
    next_phase: archivist

  on_reject:
    emit_format: "[Strategist] phase=approval_gate status=rejected"
    emit_level: TRACE
    mission_result_status: rejected
    next_phase: adr_opportunity

  invariants:
    - gate must emit status=analysis_accepted, status=revision_requested, or status=rejected before sniper is invoked
    - analysis_delivered is a valid terminal state when no documentation_targets exist
    - checkpoint is re-emitted on accept (not on revision or reject)
    - direct repository mutation before acceptance emits reason=pipeline_bypass_detected
    - pipeline_bypass_detected must include expected_phase=approval_gate and missing_evidence=approval_gate:analysis_accepted

  write_scope: read-only
  owner: internal (orchestrator)
