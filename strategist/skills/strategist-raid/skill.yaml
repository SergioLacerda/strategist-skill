id: strategist-raid
version: "0.1.0"
schema_version: "1"
status: active
risk_score: write_analysis
category: batch_orchestration

description: >
  Batch refinement orchestration for captured ideas in todo files.
  Reads entries with `status: capturada`, presents a single pre-batch gate,
  and invokes Strategist refinement for each approved item.

input:
  source_file: string
  filter_status: string
  base_path: string

output:
  summary: string
  refined_count: integer
  skipped_count: integer
  errors: array

entry_point:
  contract: strategist/contracts/strategist-raid.yaml

behavior:
  - Load the source_file and collect entries whose status matches filter_status
    (default: capturada).
  - Present a single pre-batch gate listing candidate entries before processing.
  - For each approved entry, invoke Strategist in refinement-only mode.
  - Write artifacts only under <base_path>/refined/<slug>/.
  - Update the source entry to status=analisado only after successful refinement.
  - Continue processing remaining entries if one entry fails.

forbidden_behaviors:
  - invoke_sniper_without_per_entry_gate
  - recurse_if_already_inside_strategist_mission
  - write_outside_analysis_workspace
  - silently_drop_failed_entries
