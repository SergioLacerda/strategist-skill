schema_version: "1"
description: >
  Handoff contract from Ranger (discovery) to Archivist (refinement).
  These fields are REQUIRED in the analysis artifact, regardless of format.
  The implementing skill (brainstorming, openspec, custom) decides the file format.
  Fields may live as YAML frontmatter, embedded sections, or separate files —
  the orchestrator must be able to locate them.

required_fields:
  mission_id:
    type: string
    required: true
  analysis_artifact_path:
    type: string
    required: true
  objective:
    type: string
    required: true
  analysis_summary:
    type: string
    required: true
  confidence_score:
    type: float
    range: [0.0, 1.0]
    required: true
  known_facts:
    type: list
    required: true
    item_fields: [id, text, evidence_ref]
  uncertainties:
    type: list
    required: false
    item_fields: [id, text, suggested_resolution]
  treasure_chests:
    type: list
    description: From opportunity_attack routine — chests found or used during discovery
    required: false
    item_fields: [id, trust, impact, promote_candidate]
  side_quests:
    type: list
    description: From opportunity_attack routine — adjacent work detected during discovery
    required: false
    item_fields: [id, description, relation, suggested_strategy]
    item_values:
      relation: [related, unrelated, duplicate]
      suggested_strategy: [execute_together, execute_later, separate_mission, discard]
  recommended_refinement_focus:
    type: list
    required: false
    description: Bullet points guiding the Archivist on where to focus
  narrative_state:
    type: object
    required: false
    description: Mission framing used for user-facing continuity between slots
    fields:
      mission_open: boolean
      active_phase: string
