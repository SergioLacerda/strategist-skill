schema_version: "1"
description: >
  Defines the mandatory progress event format emitted by Strategist on every
  phase transition, start, and end. Labels are sourced from the active persona.

prefix: "[Strategist]"

event_format: "[Strategist] phase=<phase_label> status=<status> [fields...]"

phase_labels:
  source: active_persona
  note: >
    phase labels are resolved from the active persona at runtime.
    pragmatic: analysis / refinement / execution
    epic: Ranger / Archivist / Sniper
    Internal role names (Ranger/Archivist/Sniper) appear in SKILL.md prose and persona labels;
    external slot keys (discovery/refinement/execution) appear in roles YAML and progress events.

statuses:
  running:
    description: Phase has started.
    required_fields: [phase, status, skill, checklist]
  done:
    description: Phase completed successfully.
    required_fields: [phase, status, artifact]
  blocked:
    description: Phase cannot continue.
    required_fields: [phase, status, reason, action]
  plan_only:
    description: Mission stopped at approval gate; execution was declined.
    required_fields: [phase, status]

event_examples:
  - "[Strategist] phase=preflight status=done slots=ok"
  - "[Strategist] phase=discovery status=running skill=sdd-diagnose checklist=0/3"
  - "[Strategist] phase=discovery status=done artifact=.analysis/pending/abc123-discovery.md"
  - "[Strategist] phase=preflight status=blocked reason=slot_provider_not_found action=check_skill_root"
  - "[Strategist] phase=refinement status=running skill=archivist checklist=1/3"
  - "[Strategist] phase=approval_gate status=blocked reason=user_declined action=none"
  - "[Strategist] phase=execution status=done artifact=.analysis/done/abc123-report.md"
  - "[Strategist] event=treasure_chest_found chest=my-chest phase=discovery"
  - "[Strategist] event=side_quest_detected type=quick_draw phase=intake"
  - "[Strategist] event=side_quest_detected type=adr_opportunity phase=post_execution"
  - "[Strategist] phase=execution task=2 status=running"
  - "[Strategist] phase=execution task=2 status=done"

user_facing_signals:
  description: >
    User-facing signals emitted via persona templates (not progress events).
    These produce visible chat output; progress events are machine-readable only.
  signals:
    treasure_chest_found:
      template: treasure_chest_found
      trigger: Non-empty chest list being passed to any slot
      fields: [chest_id, description]
    side_quest_detected:
      template: side_quest_detected
      trigger: Quick draw route matched, or ADR criteria met
      fields: [description]
    opportunity_signal:
      template: opportunity_signal
      trigger: Ataque de Oportunidade produces non-empty manifest
      fields: [count]
    mission_checkpoint:
      template: mission_checkpoint
      trigger: After intake and at every phase transition
      fields: [mission_id, step_1_icon, step_2_icon, step_3_icon, step_4_icon]
    mission_metrics:
      template: mission_metrics
      trigger: After intake and at each phase transition checkpoint
      fields:
        [
          mission_id,
          t_start_to_intake_ms,
          t_intake_to_ranger_ms,
          total_wall_time_ms,
          tokens_in,
          tokens_out,
          lines_emitted,
        ]
    execution_task_line:
      template: execution_task_line
      trigger: Before Sniper invocation and after each task=done event
      fields: [status_icon, index, task_title]

output_paths:
  discovery: "<base_path>/pending/<mission_id>-discovery.md"
  refined_plan: "<base_path>/refined/<mission_id>-plan.md"
  execution_report: "<base_path>/done/<mission_id>-report.md"
