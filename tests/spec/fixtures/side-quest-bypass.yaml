scenario: skip_opportunity_attack_routine
description: >
  The Archivist completed refinement and wrote all four refined artifacts but did not
  run opportunity_attack ADR evaluation. Strategist must detect the missing evaluation
  and request Archivist to re-run before presenting the approval gate.

input:
  active_yaml:
    mode: pragmatic
    base_path: .analysis
  archivist_response:
    has_opportunity_attack_evaluation: false
    has_refined_artifacts: true
  state: opportunity_attack_not_run

trigger: archivist_completes_without_opportunity_attack

expected_event: "[Strategist] phase=refinement status=drift pattern=skip_opportunity_attack_routine"
