scenario: single_target_sweep_bypass
description: >
  Mission is focused on refining a single artifact, and Archivist attempts to
  skip opportunity_attack ADR evaluation because of narrow scope. This is
  forbidden: narrow scope is not a valid reason to bypass mandatory OA evaluation.

input:
  active_yaml:
    mode: pragmatic
    base_path: .analysis
    roles_config: default
  mission_shape:
    target: .analysis/pending/review_readme.md
    intent: refinement_only
  phase_state:
    opportunity_attack_evaluation: skipped
    refined_artifacts: written

trigger: advance_to_approval_gate_without_opportunity_attack

expected_event: "phase=refinement status=blocked reason=opportunity_sweep_failed"
